    const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ═══════════════════════════════════════════════════════════════════════════
//  PROJ.FLOW AUTH — mesmo Supabase do Proj.Flow
// ═══════════════════════════════════════════════════════════════════════════
const PF_URL     = 'https://ydfytofjbpoqpsbryhyg.supabase.co';
const PF_KEY     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkZnl0b2ZqYnBvcXBzYnJ5aHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NzAxMjUsImV4cCI6MjA5MDE0NjEyNX0.C2EmgZUxO3x0vNpqtw0uzL4U4YGRBaL0XeIK7INjVzM';
const PF_ADMIN   = 'frederico.viana@hidrobr.com';
const pfSb       = supabase.createClient(PF_URL, PF_KEY);

// Carrega equipe e projetos do Proj.Flow via Supabase (leitura)
async function pfLoadData() {
  try {
    const { data } = await pfSb.from('projflow_data').select('data').order('updated_at',{ascending:false}).limit(1).single();
    return data?.data || null;
  } catch(e) { return null; }
}

// Carrega perfil do servidor (projflow_profiles)
async function pfLoadProfile(userId) {
  try {
    const { data } = await pfSb.from('projflow_profiles').select('profile').eq('user_id', userId).single();
    return data?.profile || null;
  } catch(e) { return null; }
}

// Permissões do GAC por perfil
// gerente → tudo; lider → sem custos/importar/config; analista → só lab e relatórios
const GAC_ABAS_PERFIL = {
  gerente:  ['dashboard','areas','sondagem','laboratorio','relatorios','custos','medicao','relatorio_qtd','report_semanal','importar','seguranca','legal','config'],
  lider:    ['dashboard','areas','sondagem','laboratorio','relatorios','custos','medicao','relatorio_qtd','report_semanal','importar','seguranca','legal','config'],
  analista: ['laboratorio','relatorios'],
};
const GAC_ABA_PADRAO = {
  gerente:  'dashboard',
  lider:    'dashboard',
  analista: 'laboratorio',
};

// ── Faixa de ambiente de homologação ──────────────────────────────────────
function FaixaHomologacao(){
  useEffect(()=>{document.title="HOMOLOGAÇÃO · HBR GAC";},[]);
  return <div style={{background:"#d29922",color:"#0d1117",fontWeight:700,fontSize:12,letterSpacing:".08em",textAlign:"center",padding:"5px 12px",position:"sticky",top:0,zIndex:101}}>
    AMBIENTE DE HOMOLOGAÇÃO — dados de teste (tabelas hml_). Nada aqui altera a produção.
  </div>;
}

// ── Login Screen ──────────────────────────────────────────────────────────
async function pfResolveAuth(user) {
  // Carrega perfil e dados do ProjFlow dado um user autenticado
  let profile = await pfLoadProfile(user.id);
  if (!profile && user.email === PF_ADMIN) profile = 'gerente';
  if (!profile) {
    const pfData = await pfLoadData();
    const person = (pfData?.team||[]).find(p => p.email?.toLowerCase() === user.email?.toLowerCase());
    profile = person?.profile || 'analista';
  }
  const pfData = await pfLoadData();
  return { user, profile, pfTeam: pfData?.team||[], pfProjects: pfData?.projects||[] };
}

function LoginGAC({ onLogin }) {
  const [email,   setEmail]   = useState('');
  const [senha,   setSenha]   = useState('');
  const [erro,    setErro]    = useState('');
  const [loading, setLoading] = useState(true); // começa verificando sessão
  const [shake,   setShake]   = useState(false);

  // Ao montar, verifica se já há sessão ativa no Proj.Flow
  useEffect(() => {
    (async () => {
      try {
        const { data } = await pfSb.auth.getSession();
        if (data?.session?.user) {
          const authData = await pfResolveAuth(data.session.user);
          onLogin(authData);
          return;
        }
      } catch(e) {}
      setLoading(false);
    })();
  }, []);

  const tentar = async () => {
    if (!email || !senha) { setErro('Preencha e-mail e senha.'); return; }
    setLoading(true); setErro('');
    try {
      const { data, error } = await pfSb.auth.signInWithPassword({ email: email.trim(), password: senha });
      if (error || !data?.user) throw new Error('E-mail ou senha incorretos.');
      const authData = await pfResolveAuth(data.user);
      onLogin(authData);
    } catch(e) {
      setErro(e.message || 'Erro ao fazer login.');
      setShake(true); setSenha('');
      setTimeout(() => setShake(false), 400);
      setLoading(false);
    }
  };

  if (loading) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#080b0f',flexDirection:'column',gap:16}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&display=swap');@keyframes pulse{to{opacity:1;transform:scale(1.3)}}`}</style>
      <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:15,color:'#388bfd',letterSpacing:2}}>HBR GAC</div>
      <div style={{color:'#484f58',fontSize:12}}>Verificando sessão…</div>
      <div style={{display:'flex',gap:4}}>
        {[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:'50%',background:'#388bfd',opacity:.4,animation:`pulse 1s ${i*0.2}s infinite alternate`}}/>)}
      </div>
    </div>
  );

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:20,background:'#080b0f'}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'IBM Plex Sans',sans-serif}
        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .shake{animation:shake .35s ease}
        .fi{animation:fadeIn .3s ease}
      `}</style>
      <div className={`fi${shake?' shake':''}`} style={{width:'100%',maxWidth:380,background:'#0d1117',border:'1px solid #21262d',borderRadius:8,padding:'40px 36px',textAlign:'center'}}>
        <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:22,fontWeight:700,color:'#388bfd',letterSpacing:3,marginBottom:4}}>HBR GAC</div>
        {GAC_HML&&<div style={{display:'inline-block',background:'#d29922',color:'#0d1117',fontWeight:700,fontSize:11,letterSpacing:'.08em',padding:'3px 10px',borderRadius:4,marginBottom:8}}>HOMOLOGAÇÃO</div>}
        <div style={{fontSize:12,color:'#484f58',marginBottom:32}}>Acesso via conta Proj·Flow</div>

        <div style={{textAlign:'left',marginBottom:14}}>
          <div style={{fontSize:10,color:'#484f58',marginBottom:5,letterSpacing:'.08em',fontWeight:600}}>E-MAIL</div>
          <input
            style={{width:'100%',background:'#010409',border:`1px solid ${erro?'#f85149':'#30363d'}`,color:'#c9d1d9',borderRadius:6,padding:'8px 12px',fontSize:13,outline:'none',fontFamily:'inherit'}}
            type="email" placeholder="seu@email.com" value={email}

// Calcula o período de medição do cliente baseado no dia de corte
// diaCorte=20 → início=AAAA-MM-20, fim=próximo mês dia 19
// `mesRef` (AAAA-MM) é a identidade estável do ciclo — não muda mesmo que o
// usuário edite manualmente as datas de início/fim de um ciclo específico.
function periodoCiclo(diaCorte, refDate) {
  const ref = refDate ? new Date(refDate+"T12:00:00") : new Date();
  const dia = parseInt(diaCorte)||1;
  let ano = ref.getFullYear();
  let mes = ref.getMonth(); // 0-based
  // Se hoje é antes do dia de corte, o ciclo atual começou no mês anterior
  if(ref.getDate() < dia) { mes--; if(mes<0){mes=11;ano--;} }
  const inicio = new Date(ano, mes, dia);
  const fimD   = new Date(ano, mes+1, dia);
  fimD.setDate(fimD.getDate()-1);
  return {
    inicio: inicio.toISOString().slice(0,10),
    fim:    fimD.toISOString().slice(0,10),
    mesRef: `${ano}-${String(mes+1).padStart(2,"0")}`,
    label:  `${String(inicio.getDate()).padStart(2,"0")}/${String(inicio.getMonth()+1).padStart(2,"0")} → ${String(fimD.getDate()).padStart(2,"0")}/${String(fimD.getMonth()+1).padStart(2,"0")}/${fimD.getFullYear()}`
  };
}

// Formata AAAA-MM-DD → DD/MM/AAAA (uso nos rótulos de ciclo editados)
const fmtDataBR = d => { if(!d) return "—"; const[y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };

// Aplica, se existir, o período customizado (override) que o usuário definiu
// manualmente para um ciclo (tabela periodos_medicao), identificado por mesRef+cliente.
function aplicarOverrideCiclo(ciclo, overrides, cliId) {
  if(!Array.isArray(overrides) || !overrides.length) return ciclo;
  const ov = overrides.find(o => o.mesRef===ciclo.mesRef && (o.cliId||"")===(cliId||""));
  if(!ov) return ciclo;
  return {
    ...ciclo,
    inicio: ov.inicio,
    fim: ov.fim,
    label: `${fmtDataBR(ov.inicio)} → ${fmtDataBR(ov.fim)}`,
    editado: true,
  };
}

// ─── Normalização de colunas custos_var_config (snake_case ↔ camelCase) ───
// O Supabase pode retornar valor_por_unidade (snake) se a coluna foi criada assim
function normalizeCVC(row) {
  if (!row) return row;
  const r = {...row};
  if (r.valor_por_unidade !== undefined && r.valorPorUnidade === undefined) {
    r.valorPorUnidade = r.valor_por_unidade;
    delete r.valor_por_unidade;
  }
  // Normaliza ativo: pode vir como booleano ou número do banco
  if (r.ativo === 1 || r.ativo === "true") r.ativo = true;
  if (r.ativo === 0 || r.ativo === "false") r.ativo = false;
  return r;
}
function denormalizeCVC(row) {
  if (!row) return row;
  const r = {...row};
  // Garante que o banco receba o campo que ele tem (tenta ambos)
  if (r.valorPorUnidade !== undefined) {
    r.valor_por_unidade = r.valorPorUnidade;
  }
  return r;
}

// ─── Contador global de operações de sync pendentes ─────────────────────
// Permite que o App saiba se há dados ainda sendo enviados ao banco
const _pendingSyncCount = { value: 0, listeners: [] };
function _incPending() {
  _pendingSyncCount.value++;
  _pendingSyncCount.listeners.forEach(fn => fn(_pendingSyncCount.value));
}
function _decPending() {
  _pendingSyncCount.value = Math.max(0, _pendingSyncCount.value - 1);
  _pendingSyncCount.listeners.forEach(fn => fn(_pendingSyncCount.value));
}
function usePendingSync() {
  const [count, setCount] = useState(_pendingSyncCount.value);
  useEffect(() => {
    const fn = v => setCount(v);
    _pendingSyncCount.listeners.push(fn);
    return () => { _pendingSyncCount.listeners = _pendingSyncCount.listeners.filter(f => f !== fn); };
  }, []);
  return count;
}

// ─── Hook de sincronização com Supabase ───────────────────────────────────
// Funciona como usePersist mas usa Supabase.
// "setter" recebe o novo array/valor e faz upsert+delete automaticamente.
function useSupabase(table, init, options={}) {
  const [data, setData] = useState(init);
  const [loading, setLoading] = useState(true);
  const [syncErr, setSyncErr] = useState(null);
  const isScalar = options.scalar || false;
  const isCVC = table === "custos_var_config";

  // Carrega dados na montagem
  useEffect(() => {
    (async () => {
      try {
        if (isScalar) {
          const rows = await sb.get(table, "select=value&key=eq.cliAtivo");
          setData(rows[0]?.value ?? null);
        } else {
          const rows = await sb.get(table);
          const normalized = isCVC ? rows.map(normalizeCVC) : rows;
          setData(normalized.length ? normalized : init);
        }
      } catch(e) {
        console.warn(`[Supabase] load ${table}:`, e.message);
      } finally {
        setLoading(false);
      }
    })();
  }, [table]);

  // Setter que atualiza estado local E sincroniza com Supabase
  const setter = (updater) => {
    setData(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      (async () => {
        _incPending();
        try {
          setSyncErr(null);
          if (isScalar) {
            await sb.upsert("configuracoes", {key:"cliAtivo", value: next}, "key");
          } else {
            if (!Array.isArray(next)) return;
            const prevIds = new Set((Array.isArray(prev)?prev:[]).map(x=>x.id));
            const nextIds = new Set(next.map(x=>x.id));
            // Deletar removidos
            for (const id of prevIds) {
              if (!nextIds.has(id)) await sb.delete(table, id).catch(()=>{});
            }
            // Upsert apenas itens novos ou modificados
            const changed = next.filter(item => {
              const prevItem = (Array.isArray(prev)?prev:[]).find(x=>x.id===item.id);
              if (!prevItem) return true;
              return JSON.stringify(prevItem) !== JSON.stringify(item);
            });
            if (changed.length) {
              const toSend = isCVC ? changed.map(denormalizeCVC) : changed;
              await sb.upsert(table, toSend);
            }
          }
        } catch(e) {
          const msg = `[${table}] ${e.message}`;
          console.error("[Supabase sync error]", msg);
          setSyncErr(msg);
        } finally {
          _decPending();
        }
      })();
      return next;
    });
  };

  return [data, setter, loading, syncErr];
}

// ═══════════════════════════════════════════════════════════════════════════
//  GRÁFICO PLANEJADO × REALIZADO (SVG nativo, barras duplas por mês)
// ═══════════════════════════════════════════════════════════════════════════
function GraficoPlanReal({planejado, realizado, svcMap, altura=220}){
  // Agrupar por mês
  const dados = useMemo(()=>{
    const meses={};
    planejado.forEach(l=>{
      const m=(l.data||"").slice(0,7);
      if(!m)return;
      if(!meses[m])meses[m]={m,plan:0,real:0};
      meses[m].plan+=(svcMap[l.sid]?.valor||0)*l.qtd;
    });
    realizado.forEach(l=>{
      const m=(l.data||"").slice(0,7);
      if(!m)return;
      if(!meses[m])meses[m]={m,plan:0,real:0};
      meses[m].real+=(svcMap[l.sid]?.valor||0)*l.qtd;
    });
    return Object.values(meses).sort((a,b)=>a.m.localeCompare(b.m));
  },[planejado,realizado,svcMap]);

  if(!dados.length) return(
    <div style={{height:altura,display:"flex",alignItems:"center",justifyContent:"center",color:"#484f58",fontSize:12}}>
      Nenhum dado para exibir
    </div>
  );

  const maxVal = Math.max(...dados.map(d=>Math.max(d.plan,d.real)),1);
  const W=700, H=altura, PAD={top:20,right:20,bottom:48,left:72};
  const plotW=W-PAD.left-PAD.right;
  const plotH=H-PAD.top-PAD.bottom;
  const n=dados.length;
  const groupW=plotW/n;
  const barW=Math.min(groupW*0.35,32);
  const gap=barW*0.3;

  // Linhas de grade
  const ticks=5;
  const gridLines=Array.from({length:ticks+1},(_,i)=>i*(maxVal/ticks));

  const y=v=>PAD.top+plotH-(v/maxVal)*plotH;
  const xGroup=i=>PAD.left+i*groupW+groupW/2;

  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:altura,overflow:"visible"}}>
      {/* Grid lines */}
      {gridLines.map((v,i)=>(
        <g key={i}>
          <line x1={PAD.left} y1={y(v)} x2={W-PAD.right} y2={y(v)} stroke="#21262d" strokeWidth="1"/>
          <text x={PAD.left-8} y={y(v)+4} textAnchor="end" fontSize="10" fill="#484f58" fontFamily="IBM Plex Mono">
            {v>=1000?`${(v/1000).toFixed(0)}k`:v.toFixed(0)}
          </text>
        </g>
      ))}

      {/* Eixo X */}
      <line x1={PAD.left} y1={PAD.top+plotH} x2={W-PAD.right} y2={PAD.top+plotH} stroke="#30363d" strokeWidth="1"/>

      {/* Barras + labels */}
      {dados.map((d,i)=>{
        const cx=xGroup(i);
        const hPlan=Math.max((d.plan/maxVal)*plotH,2);
        const hReal=Math.max((d.real/maxVal)*plotH,2);
        const xPlan=cx-gap/2-barW;
        const xReal=cx+gap/2;
        const isAtual=d.m===hoje().slice(0,7);
        return(
          <g key={d.m}>
            {/* Barra planejado */}
            <rect x={xPlan} y={y(d.plan)} width={barW} height={hPlan} rx="2" fill="#388bfd" opacity={isAtual?1:.65}/>
            {/* Barra realizado */}
            <rect x={xReal} y={y(d.real)} width={barW} height={hReal} rx="2" fill="#3fb950" opacity={isAtual?1:.65}/>
            {/* Delta line */}
            {d.plan>0&&d.real>0&&(
              <line x1={xPlan+barW/2} y1={y(d.plan)} x2={xReal+barW/2} y2={y(d.real)}
                stroke={d.real>=d.plan?"#3fb95066":"#f8514966"} strokeWidth="1.5" strokeDasharray="3 2"/>
            )}
            {/* Label mês */}
            <text x={cx} y={H-PAD.bottom+14} textAnchor="middle" fontSize="10" fill={isAtual?"#c9d1d9":"#484f58"} fontFamily="IBM Plex Mono">
              {d.m.slice(5)}
            </text>
            {/* Valores topo */}
            {d.plan>0&&<text x={xPlan+barW/2} y={y(d.plan)-4} textAnchor="middle" fontSize="9" fill="#388bfd" fontFamily="IBM Plex Mono">
              {d.plan>=1000?`${(d.plan/1000).toFixed(0)}k`:d.plan.toFixed(0)}
            </text>}
            {d.real>0&&<text x={xReal+barW/2} y={y(d.real)-4} textAnchor="middle" fontSize="9" fill="#3fb950" fontFamily="IBM Plex Mono">
              {d.real>=1000?`${(d.real/1000).toFixed(0)}k`:d.real.toFixed(0)}
            </text>}
          </g>
        );
      })}

      {/* Legenda */}
      <g transform={`translate(${PAD.left},${H-10})`}>
        <rect x="0" y="-8" width="10" height="10" rx="2" fill="#388bfd"/>
        <text x="14" y="0" fontSize="10" fill="#8b949e" fontFamily="IBM Plex Sans">Planejado</text>
        <rect x="80" y="-8" width="10" height="10" rx="2" fill="#3fb950"/>
        <text x="94" y="0" fontSize="10" fill="#8b949e" fontFamily="IBM Plex Sans">Realizado</text>
      </g>
    </svg>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  SIDEBAR DE CLIENTES — sempre visível à esquerda
// ═══════════════════════════════════════════════════════════════════════════
function ClienteSidebar({clientes,setClientes,cliAtivo,setCliAtivo,planejado,realizado,svcMap}){
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const empty={nome:"",cnpj:"",contato:"",email:"",diaCorte:"20",contrato:"",obs:""};
  const [f,setF]=useState(empty);

  const salvar=()=>{
    if(!f.nome)return;
    if(editId){setClientes(c=>c.map(x=>x.id===editId?{...f,id:editId}:x));setEditId(null);}
    else setClientes(c=>[...c,{...f,id:uid()}]);
    setF(empty);setShowForm(false);
  };
  const editar=c=>{setF(c);setEditId(c.id);setShowForm(true);};
  const del=id=>{setClientes(c=>c.filter(x=>x.id!==id));if(cliAtivo===id)setCliAtivo(null);};

  const stats=cid=>({
    p:planejado.filter(l=>l.cliId===cid).reduce((a,l)=>a+(svcMap[l.sid]?.valor||0)*l.qtd,0),
    r:realizado.filter(l=>l.cliId===cid).reduce((a,l)=>a+(svcMap[l.sid]?.valor||0)*l.qtd,0),
  });

  return(
    <div style={{
      width:260,minWidth:260,background:"#0d1117",borderRight:"1px solid #21262d",
      display:"flex",flexDirection:"column",overflowY:"auto",
      position:"sticky",top:52,height:"calc(100vh - 52px)"
    }}>
      {/* Header sidebar */}
      <div style={{padding:"14px 16px 10px",borderBottom:"1px solid #21262d",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:11,fontWeight:600,color:"#484f58",letterSpacing:.08*14+"px",textTransform:"uppercase"}}>Clientes</span>
        <button
          className="btn btn-primary btn-xs"
          onClick={()=>{setF(empty);setEditId(null);setShowForm(true);}}
          title="Novo cliente"
        >+</button>
      </div>

      {/* "Todos" */}
      <button
        onClick={()=>setCliAtivo(null)}
        style={{
          display:"flex",alignItems:"center",gap:10,padding:"10px 16px",
          background:!cliAtivo?"#161b22":"transparent",
          border:"none",borderBottom:"1px solid #21262d",cursor:"pointer",
          textAlign:"left",transition:"background .15s",width:"100%",
        }}
      >
        <div style={{width:28,height:28,borderRadius:"50%",background:!cliAtivo?"#1f6feb":"#21262d",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0}}>
          ⊞
        </div>
        <div>
          <div style={{fontSize:12,fontWeight:500,color:!cliAtivo?"#c9d1d9":"#8b949e"}}>Todos os clientes</div>
          <div style={{fontSize:10,color:"#484f58"}}>{clientes.length} cadastrados</div>
        </div>
      </button>

      {/* Lista de clientes */}
      <div style={{flex:1,overflowY:"auto"}}>
        {clientes.map(c=>{
          const s=stats(c.id);
          const isAtivo=cliAtivo===c.id;
          const ciclo=periodoCiclo(c.diaCorte);
          const avanco=s.p>0?Math.min((s.r/s.p)*100,100):0;
          const ini=c.nome.slice(0,2).toUpperCase();
          return(
            <div key={c.id}
              style={{
                borderBottom:"1px solid #161b22",
                background:isAtivo?"#161b22":"transparent",
                borderLeft:`3px solid ${isAtivo?"#388bfd":"transparent"}`,
                transition:"all .15s",
              }}
            >
              {/* Linha principal clicável */}
              <button
                onClick={()=>setCliAtivo(isAtivo?null:c.id)}
                style={{
                  display:"flex",alignItems:"center",gap:10,padding:"10px 14px 8px 13px",
                  background:"transparent",border:"none",cursor:"pointer",
                  textAlign:"left",width:"100%",
                }}
              >
                <div style={{
                  width:28,height:28,borderRadius:"50%",flexShrink:0,
                  background:isAtivo?"#1f6feb":"#21262d",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:10,fontWeight:600,color:isAtivo?"#fff":"#8b949e",
                  fontFamily:"'IBM Plex Mono'",
                }}>{ini}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,color:isAtivo?"#c9d1d9":"#8b949e",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nome}</div>
                  <div style={{fontSize:10,color:"#484f58",marginTop:1}}>
                    Corte: dia {c.diaCorte}
                    {c.contrato&&<span style={{marginLeft:6,color:"#30363d"}}>{c.contrato}</span>}
                  </div>
                </div>
                {isAtivo&&<span style={{width:6,height:6,borderRadius:"50%",background:"#388bfd",flexShrink:0}}/>}
              </button>

              {/* Detalhes expandidos quando ativo */}
              {isAtivo&&(
                <div style={{padding:"0 14px 10px 14px"}}>
                  {/* Ciclo */}
                  <div style={{padding:"6px 10px",background:"#0d1117",borderRadius:4,marginBottom:8,border:"1px solid #21262d"}}>
                    <div style={{fontSize:9,color:"#d29922",fontWeight:600,marginBottom:2,letterSpacing:1}}>CICLO ATUAL</div>
                    <div style={{fontSize:11,color:"#d29922"}}>{ciclo.label}</div>
                  </div>
                  {/* Financeiro mini */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:8}}>
                    <div style={{padding:"5px 8px",background:"#0d1117",borderRadius:4,border:"1px solid #21262d"}}>
                      <div style={{fontSize:9,color:"#484f58",marginBottom:1}}>PLAN.</div>
                      <div style={{fontFamily:"'IBM Plex Mono'",fontSize:11,color:"#388bfd",fontWeight:500}}>R$ {s.p>=1000?`${(s.p/1000).toFixed(0)}k`:s.p.toFixed(0)}</div>
                    </div>
                    <div style={{padding:"5px 8px",background:"#0d1117",borderRadius:4,border:"1px solid #21262d"}}>
                      <div style={{fontSize:9,color:"#484f58",marginBottom:1}}>REAL.</div>
                      <div style={{fontFamily:"'IBM Plex Mono'",fontSize:11,color:"#3fb950",fontWeight:500}}>R$ {s.r>=1000?`${(s.r/1000).toFixed(0)}k`:s.r.toFixed(0)}</div>
                    </div>
                  </div>
                  {/* Barra */}
                  <div style={{height:3,background:"#21262d",borderRadius:2,overflow:"hidden",marginBottom:6}}>
                    <div style={{height:"100%",width:`${avanco}%`,background:avanco>=100?"#3fb950":"#388bfd",borderRadius:2,transition:"width .4s"}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#484f58",marginBottom:8}}>
                    <span>Avanço</span><span style={{fontFamily:"'IBM Plex Mono'"}}>{fmtN(avanco)}%</span>
                  </div>
                  {/* Ações */}
                  <div style={{display:"flex",gap:4}}>
                    <button className="btn btn-ghost btn-xs" style={{flex:1,justifyContent:"center"}} onClick={e=>{e.stopPropagation();editar(c);}}>✎ Editar</button>
                    <button className="btn btn-danger btn-xs" onClick={e=>{e.stopPropagation();del(c.id);}}>✕</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
        {clientes.length===0&&(
          <div style={{padding:"24px 16px",textAlign:"center",color:"#484f58",fontSize:12,lineHeight:1.6}}>
            Nenhum cliente.<br/>Use + para adicionar.
          </div>
        )}
      </div>

      {/* Formulário inline */}
      {showForm&&(
        <div style={{borderTop:"1px solid #21262d",padding:"14px 16px",background:"#080b0f"}}>
          <div style={{fontSize:11,color:"#484f58",fontWeight:600,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
            {editId?"Editar cliente":"Novo cliente"}
          </div>
          <div style={{display:"grid",gap:8}}>
            {[
              {k:"nome",     l:"NOME *",          ph:"Nome do cliente",         full:true},
              {k:"contrato", l:"Nº CONTRATO",      ph:"CONT-2024-001"},
              {k:"cnpj",     l:"CNPJ",             ph:"00.000.000/0001-00"},
              {k:"contato",  l:"CONTATO",          ph:"Responsável"},
              {k:"email",    l:"E-MAIL",           ph:"email@cliente.com",      full:true},
              {k:"obs",      l:"OBSERVAÇÕES",      ph:"Obs.",                   full:true},
            ].map(fd=>(
              <div key={fd.k} style={fd.full?{}:{}}>
                <div style={{fontSize:9,color:"#484f58",marginBottom:3,textTransform:"uppercase",letterSpacing:.5}}>{fd.l}</div>
                <input className="inp" style={{fontSize:12,padding:"5px 9px"}} placeholder={fd.ph} value={f[fd.k]} onChange={e=>setF(x=>({...x,[fd.k]:e.target.value}))}/>
              </div>
            ))}
            <div>
              <div style={{fontSize:9,color:"#d29922",marginBottom:3,fontWeight:600,textTransform:"uppercase",letterSpacing:.5}}>DIA DE CORTE ★</div>
              <select className="inp" style={{fontSize:12,padding:"5px 9px"}} value={f.diaCorte} onChange={e=>setF(x=>({...x,diaCorte:e.target.value}))}>
                {Array.from({length:28},(_,i)=>i+1).map(d=><option key={d} value={d}>{d}</option>)}
              </select>
              {f.diaCorte&&<div style={{fontSize:10,color:"#484f58",marginTop:3}}>{periodoCiclo(f.diaCorte).label}</div>}
            </div>
          </div>
          <div style={{display:"flex",gap:6,marginTop:12}}>
            <button className="btn btn-primary btn-sm" style={{flex:1,justifyContent:"center"}} onClick={salvar}>✓ Salvar</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>{setShowForm(false);setEditId(null);}}>✕</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════
function Dashboard({kpis,realizado,amostras,relats,svcMap,planejado,clienteAtivo}){
  const dias14=useMemo(()=>{
    const arr=[];
    for(let i=13;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      const m=realizado.filter(l=>l.data===ds&&svcMap[l.sid]?.unidade==="m").reduce((a,l)=>a+l.qtd,0);
      arr.push({ds,label:ds.slice(8),m});
    }
    return arr;
  },[realizado,svcMap]);
  const maxM=Math.max(...dias14.map(d=>d.m),1);

  const proxLaudos=amostras
    .filter(a=>["enviado","em_analise"].includes(a.status)&&a.prazoLaudo)
    .sort((a,b)=>a.prazoLaudo.localeCompare(b.prazoLaudo))
    .slice(0,5);

  const funil=[
    {l:"Coletadas", v:kpis.amTotal, c:"#484f58"},
    {l:"Enviadas",  v:kpis.amEnv,   c:"#388bfd"},
    {l:"Laudo OK",  v:kpis.amLaudo, c:"#3fb950"},
    {l:"Relatórios",v:`${kpis.rDone}/${kpis.rTotal}`,c:"#ec4899",raw:true},
  ];

  return(
    <div style={{display:"grid",gap:16}}>
      {/* KPI row */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12}}>
        {/* m/dia */}
        <div className="card ca-blue" style={{padding:"18px 20px",gridColumn:"span 2",background:"linear-gradient(135deg,#0d1117,#0d1421)"}}>
          <div className="sl" style={{marginBottom:8,color:"#388bfd99"}}>PRODUTIVIDADE — METROS / DIA</div>
          <div style={{display:"flex",alignItems:"flex-end",gap:20}}>
            <div>
              <div className="mono" style={{fontSize:52,fontWeight:600,color:"#388bfd",lineHeight:1}}>{fmtN(kpis.mDia)}</div>
              <div style={{fontSize:12,color:"#484f58",marginTop:4}}>m/dia • {kpis.diasP} dias com produção</div>
            </div>
            <div style={{flex:1}}>
              <div style={{display:"flex",gap:3,alignItems:"flex-end",height:50}}>
                {dias14.slice(-7).map((d,i)=>(
                  <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                    <div style={{width:"100%",background:"#161b22",borderRadius:3,height:40,display:"flex",alignItems:"flex-end",overflow:"hidden"}}>
                      <div style={{width:"100%",background:d.ds===hoje()?"#388bfd":"#388bfd55",height:`${(d.m/maxM)*100}%`,borderRadius:"2px 2px 0 0"}}/>
                    </div>
                    <div style={{fontSize:9,color:"#30363d"}}>{d.label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:20,marginTop:10,paddingTop:10,borderTop:"1px solid #21262d",fontSize:12}}>
            <span><span style={{color:"#484f58"}}>Realizado: </span><span className="mono" style={{color:"#3fb950"}}>{fmtN(kpis.mReal)} m</span></span>
            <span><span style={{color:"#484f58"}}>Planejado: </span><span className="mono" style={{color:"#388bfd"}}>{fmtN(kpis.mPlan)} m</span></span>
            <span><span style={{color:"#484f58"}}>Avanço: </span><span className="mono" style={{color:kpis.avanco>=100?"#3fb950":"#d29922"}}>{fmtN(kpis.avanco)}%</span></span>
          </div>
        </div>
        {/* Tempo médio laudo */}
        <div className="card ca-teal" style={{padding:"18px 20px",background:"linear-gradient(135deg,#0d1117,#0d1a1a)"}}>
          <div className="sl" style={{marginBottom:8,color:"#2dd4bf99"}}>TEMPO MÉDIO LAUDO</div>
          {kpis.tLaudo!==null
            ?<><div className="mono" style={{fontSize:52,fontWeight:600,color:"#2dd4bf",lineHeight:1}}>{fmtN(kpis.tLaudo,0)}</div>
               <div style={{fontSize:12,color:"#484f58",marginTop:4}}>dias envio → recebimento</div></>
            :<><div className="mono" style={{fontSize:36,fontWeight:600,color:"#21262d",lineHeight:1}}>—</div>
               <div style={{fontSize:12,color:"#484f58",marginTop:8}}>Sem laudos com datas registradas</div></>
          }
        </div>
        {/* Medição ciclo cliente OU acumulada */}
        {kpis.medCiclo!==null
          ?<div className="card ca-orange" style={{padding:"18px 20px"}}>
              <div className="sl" style={{marginBottom:4}}>MEDIÇÃO DO CICLO</div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:8}}>{kpis.cicloPeriodo?.label}</div>
              <div className="mono" style={{fontSize:22,fontWeight:600,color:"#d29922",lineHeight:1}}>R$ {fmt(kpis.medCiclo)}</div>
              <div style={{fontSize:11,color:"#484f58",marginTop:4}}>Dia {clienteAtivo?.diaCorte} de corte</div>
            </div>
          :<div className="card ca-orange" style={{padding:"18px 20px"}}>
              <div className="sl" style={{marginBottom:8}}>MEDIÇÃO ACUMULADA</div>
              <div className="mono" style={{fontSize:22,fontWeight:600,color:"#d29922",lineHeight:1}}>R$ {fmt(kpis.medHj)}</div>
              <div style={{fontSize:11,color:"#484f58",marginTop:4}}>até hoje</div>
              <div style={{marginTop:10}}>
                <div className="pt"><div className="pf" style={{width:`${kpis.tPlan>0?Math.min((kpis.tReal/kpis.tPlan)*100,100):0}%`,background:"#d29922"}}/></div>
              </div>
            </div>
        }
      </div>

      {/* ── Gráfico Planejado × Realizado ── */}
      <div className="card" style={{padding:"16px 18px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div className="sl">PLANEJADO × REALIZADO — EVOLUÇÃO MENSAL (R$)</div>
          <div style={{display:"flex",gap:16,fontSize:11}}>
            <span><span style={{color:"#484f58"}}>Total planejado: </span><span className="mono" style={{color:"#388bfd"}}>R$ {fmt(kpis.tPlan)}</span></span>
            <span><span style={{color:"#484f58"}}>Total realizado: </span><span className="mono" style={{color:"#3fb950"}}>R$ {fmt(kpis.tReal)}</span></span>
            <span><span style={{color:"#484f58"}}>Avanço: </span><span className="mono" style={{color:kpis.avanco>=100?"#3fb950":"#d29922"}}>{fmtN(kpis.avanco)}%</span></span>
          </div>
        </div>
        <GraficoPlanReal planejado={planejado} realizado={realizado} svcMap={svcMap} altura={220}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:12}}>
        {/* Funil */}
        <div className="card" style={{padding:"16px 18px"}}>
          <div className="sl" style={{marginBottom:14}}>PIPELINE DO PROCESSO</div>
          {funil.map((f,i)=>(
            <div key={i} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:12,color:"#8b949e"}}>{f.l}</span>
                <span className="mono" style={{fontWeight:600,color:f.c,fontSize:16}}>{f.v}</span>
              </div>
              {!f.raw&&kpis.amTotal>0&&<div className="pt"><div className="pf" style={{width:`${(Number(f.v)/kpis.amTotal)*100}%`,background:f.c}}/></div>}
            </div>
          ))}
          {kpis.tLaudo!==null&&(
            <div style={{marginTop:6,padding:"8px 12px",background:"#161b22",borderRadius:6,fontSize:12,display:"flex",justifyContent:"space-between"}}>
              <span style={{color:"#484f58"}}>⌀ tempo laudo</span>
              <span className="mono" style={{color:"#2dd4bf"}}>{fmtN(kpis.tLaudo,0)} dias</span>
            </div>
          )}
        </div>
        {/* Próximos laudos */}
        <div className="card" style={{padding:"16px 18px"}}>
          <div className="sl" style={{marginBottom:12}}>PRÓXIMOS LAUDOS ESPERADOS</div>
          {proxLaudos.length===0
            ?<div style={{color:"#484f58",fontSize:12,paddingTop:12}}>Nenhum laudo aguardando com prazo definido</div>
            :<table className="table">
              <thead><tr><th>ÁREA</th><th>PONTO</th><th>TIPO</th><th>LABORATÓRIO</th><th>STATUS</th><th>PRAZO</th><th>DIAS</th></tr></thead>
              <tbody>{proxLaudos.map(a=>{
                const dias=diffD(hoje(),a.prazoLaudo);
                return <tr key={a.id}>
                  <td><span className="badge bg">{a.area||"—"}</span></td>
                  <td className="mono" style={{color:"#388bfd"}}>{a.ponto}</td>
                  <td><span className="badge bg">{a.tipo}</span></td>
                  <td style={{color:"#8b949e",fontSize:12}}>{a.lab||"—"}</td>
                  <td><SBadge status={a.status} list={ST_LAB}/></td>
                  <td className="mono" style={{fontSize:11}}>{a.prazoLaudo}</td>
                  <td><span className={`badge ${dias===null?"bg":dias<0?"br":dias<5?"bo":"bgn"}`}>{dias!==null?`${dias}d`:"—"}</span></td>
                </tr>;
              })}</tbody>
            </table>
          }
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  SONDAGEM
// ═══════════════════════════════════════════════════════════════════════════
function Sondagem({planejado,setPlanejado,realizado,setRealizado,boletins,setBoletins,pontos=[],servicos,svcMap,clientes,cliAtivo,custosVarConfig,setCustosArea,areas}){
  const [sub,setSub]=useState("planejado");
  const ABAS=[["planejado","▦ Planejado"],["boletins","▤ Boletins diários"],["realizado","▶ Realizado"]];
  return(
    <div style={{display:"grid",gap:16}}>
      <div style={{display:"flex",gap:4,background:"#0d1117",padding:4,borderRadius:8,border:"1px solid #21262d",width:"fit-content"}}>
        {ABAS.map(([s,l])=>(
          <button key={s} onClick={()=>setSub(s)} style={{padding:"6px 20px",borderRadius:6,border:"none",cursor:"pointer",background:sub===s?"#21262d":"transparent",color:sub===s?"#c9d1d9":"#8b949e",fontWeight:sub===s?600:400,transition:"all .15s"}}>
            {l}
          </button>
        ))}
      </div>
      {sub==="planejado"&&<LancList
            label="PLANEJADO"
            itens={planejado}
            setItens={setPlanejado}
            servicos={servicos} svcMap={svcMap}
            clientes={clientes} cliAtivo={cliAtivo}
            ac="ca-blue" bc="btn-primary"
            isRealizado={false}
            planejado={[]}
            realizadoTodos={realizado}
            pontos={pontos}
            areas={areas}
          />}
      {sub==="boletins"&&<BoletinsExecucao
            boletins={boletins} setBoletins={setBoletins}
            planejado={planejado} realizado={realizado} setRealizado={setRealizado}
            servicos={servicos} svcMap={svcMap} clientes={clientes} cliAtivo={cliAtivo} areas={areas} pontos={pontos}
          />}
      {sub==="realizado"&&<LancList
            label="REALIZADO"
            itens={realizado}
            setItens={setRealizado}
            servicos={servicos} svcMap={svcMap}
            clientes={clientes} cliAtivo={cliAtivo}
            ac="ca-green" bc="btn-success"
            isRealizado={true}
            modoBoletim={true}
            boletins={boletins}
            pontos={pontos}
            planejado={planejado}
            custosVarConfig={custosVarConfig}
            setCustosArea={setCustosArea}
            areas={areas}
          />}
    </div>
  );
}
