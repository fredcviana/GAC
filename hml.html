function LancList({label,itens,setItens,servicos,svcMap,clientes,cliAtivo,ac,bc,isRealizado,planejado,custosVarConfig,setCustosArea,areas:areasCadastradas,modoBoletim=false,boletins=[],realizadoTodos=null,pontos=[]}){
  const pontoMapL=useMemo(()=>Object.fromEntries((pontos||[]).map(p=>[p.id,p])),[pontos]);
  const situacaoPlan=useMemo(()=>realizadoTodos?calcSituacaoPlan(realizadoTodos):null,[realizadoTodos]);
  const svcF=servicos;
  const emptyLinha=()=>newLinhaVazia(svcF,cliAtivo);

  const [linhas,setLinhas]=useState([emptyLinha()]);
  const [modalPlan,setModalPlan]=useState(null); // item planejado sendo confirmado
  const [editando,setEditando]=useState(null); // item (planejado ou realizado) sendo editado
  const [filtroArea,setFiltroArea]=useState("");
  const [filtroStatus,setFiltroStatus]=useState("todos"); // "todos"|"pendentes"|"realizados"

  useEffect(()=>{
    setLinhas(ls=>ls.map(l=>({...l,cliId:cliAtivo||""})));
  },[cliAtivo]);

  const setLinha=(idx,campo,valor)=>setLinhas(ls=>ls.map((l,i)=>i===idx?{...l,[campo]:valor}:l));
  const addLinha=()=>setLinhas(ls=>[...ls,emptyLinha()]);
  const remLinha=idx=>setLinhas(ls=>ls.filter((_,i)=>i!==idx));

  // Resolve areaId pelo nome da área cadastrada
  const resolveAreaId = useCallback((nomeArea, areaIdDireto) => {
    if(areaIdDireto) return areaIdDireto;
    if(nomeArea && Array.isArray(areasCadastradas)){
      const found = areasCadastradas.find(a=>
        a.nome === nomeArea ||
        (a.nome||"").toUpperCase() === (nomeArea||"").toUpperCase()
      );
      if(found) return found.id;
    }
    return null;
  }, [areasCadastradas]);

  // Dispara regras de custo variável — usa props diretamente (sem refs)
  const dispararCustosVar = useCallback((dados) => {
    // Desativado: o custo variável é calculado a partir de `realizado` nas telas de Custos.
    // Gravar aqui em custos_area duplicava o valor em Custos por Área e Resultado.
    if (CUSTO_VAR_GRAVAR_EM_CUSTOS_AREA !== true) return;
    const config = custosVarConfig;
    const setter = setCustosArea;
    if(!Array.isArray(config) || config.length === 0 || !setter) return;
    const regras = config.filter(r => {
      const ativo = r.ativo===true || r.ativo==="true" || r.ativo===1;
      return ativo && String(r.sid) === String(dados.sid);
    });
    if(regras.length === 0) return;
    const areaId = resolveAreaId(dados.area, dados.areaId);
    const qtd = parseFloat(dados.qtd || 0);
    if(qtd <= 0) return;
    const novos = regras
      .map(regra => {
        const vpu = parseFloat(regra.valorPorUnidade || regra.valor_por_unidade || 0);
        const valor = vpu * qtd;
        if(!valor || isNaN(valor) || valor <= 0) return null;
        return {
          id: uid(),
          areaId: areaId,
          cat: regra.categoria || "Insumos de Sondagem",
          descricao: `${regra.nome}${dados.area ? " — " + dados.area : ""}`,
          valor,
          data: dados.data || hoje(),
          realizadoId: dados.id,
        };
      })
      .filter(Boolean);
    if(novos.length > 0) setter(a => [...novos, ...a]);
  }, [custosVarConfig, setCustosArea, resolveAreaId]);

  const lancar = () => {
    const validas = linhas.filter(l=>l.sid&&l.qtd&&l.data);
    if(validas.length === 0) return;
    if(!isRealizado && validas.some(l=>!l.pontoId)){ alert("Escolha o ponto (ou N/A) em todas as linhas."); return; }
    const novos = validas.map(l=>({...l, id:uid(), qtd:parseFloat(l.qtd), cliId:l.cliId||null,
      areaId:resolveAreaId(l.area,null), pontoId:(l.pontoId&&l.pontoId!=="NA")?l.pontoId:null}));
    setItens(p=>[...novos,...p]);
    setLinhas([emptyLinha()]);
    if(isRealizado) novos.forEach(item => dispararCustosVar(item));
  };

  const confirmarRealizacao = (dados) => {
    setItens(p=>[dados,...p]);
    setModalPlan(null);
    dispararCustosVar(dados);
  };

  const salvarEdicao = (dados) => {
    // Remove campos internos de renderização (ex.: _tipo) antes de persistir no Supabase
    const {_tipo, ...editandoLimpo} = editando;
    const atualizado = {...editandoLimpo, ...dados};
    setItens(p=>p.map(it=>it.id===editando.id?atualizado:it));
    if(isRealizado){
      // Remove custos variáveis antigos vinculados a este lançamento e regenera com os novos valores
      if(setCustosArea) setCustosArea(a=>a.filter(c=>c.realizadoId!==editando.id));
      dispararCustosVar(atualizado);
    }
    setEditando(null);
  };

  const del=id=>{
    if(!isRealizado && realizadoTodos && realizadoTodos.some(r=>r.planId===id)){
      alert("Este planejado já tem lançamentos em boletins e não pode ser excluído. Se não será mais executado, encerre-o em um boletim.");
      return;
    }
    setItens(p=>p.filter(l=>l.id!==id));
    // Remove custos variáveis vinculados a este lançamento
    if(setCustosArea) setCustosArea(a=>a.filter(c=>c.realizadoId!==id));
  };

  // No modo realizado: mescla planejados (pendentes) + realizados na mesma lista
  const planFilt=isRealizado&&!modoBoletim
    ?(cliAtivo?planejado.filter(l=>l.cliId===cliAtivo):planejado)
    :[];

  const realizadosFilt=cliAtivo?itens.filter(l=>l.cliId===cliAtivo):itens;

  // IDs de planejados já confirmados
  const planConfirmados=new Set(realizadosFilt.map(r=>r.planId).filter(Boolean));

  // Planejados ainda pendentes
  const planPendentes=planFilt.filter(p=>!planConfirmados.has(p.id));

  // Para o planejado puro (não-realizado), lista normal
  const listaFilt=realizadosFilt;

  // Todas as áreas (realizados + planejados pendentes)
  const areas=[...new Set([
    ...listaFilt.map(l=>l.area),
    ...(isRealizado?planPendentes.map(l=>l.area):[]),
  ].filter(Boolean))].sort();

  // Monta lista mesclada por mês
  const listaComPendentes=isRealizado
    ?[
        ...listaFilt.map(l=>({...l,_tipo:"realizado"})),
        ...planPendentes.map(l=>({...l,_tipo:"planejado"})),
      ]
    :listaFilt.map(l=>({...l,_tipo:"realizado"}));

  const listaFiltrada=listaComPendentes.filter(l=>{
    const areaOk=!filtroArea||l.area===filtroArea;
    const statusOk=filtroStatus==="todos"
      ||(filtroStatus==="pendentes"&&l._tipo==="planejado")
      ||(filtroStatus==="realizados"&&l._tipo==="realizado");
    return areaOk&&statusOk;
  });

  const porMes={};
  listaFiltrada.forEach(l=>{
    const m=(l.data||"").slice(0,7)||"?";
    if(!porMes[m])porMes[m]=[];
    porMes[m].push(l);
  });
  const meses=Object.keys(porMes).sort().reverse();

  const nPendentes=isRealizado?planPendentes.length:0;

  return(
    <div style={{display:"grid",gap:14}}>

      {/* Modal de confirmação */}
      {modalPlan&&(
        <ModalConfirmar
          plan={modalPlan}
          svcMap={svcMap}
          clientes={clientes}
          onConfirmar={confirmarRealizacao}
          onCancelar={()=>setModalPlan(null)}
        />
      )}

      {/* Modal de edição */}
      {editando&&(
        <ModalEditarLancamento
          item={editando}
          servicos={svcF}
          svcMap={svcMap}
          clientes={clientes}
          onSalvar={salvarEdicao}
          onCancelar={()=>setEditando(null)}
        />
      )}

      {modoBoletim&&(
        <div className="card" style={{padding:"12px 16px",fontSize:12,color:"#8b949e"}}>
          Os lançamentos de realizado são feitos pela aba <b style={{color:"#c9d1d9"}}>Boletins diários</b>. Aqui ficam a consulta, a edição e a exclusão de linhas.
        </div>
      )}
      {/* Formulário multi-linha */}
      {!modoBoletim&&<div className={`card ${ac}`} style={{padding:"16px 18px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div className="sl">LANÇAR — {label}</div>
          <button className="btn btn-ghost btn-xs" onClick={addLinha}>+ Linha</button>
        </div>

        <div style={{display:"grid",gap:8}}>
          {linhas.map((f,idx)=>(
            <div key={idx} style={{display:"grid",gridTemplateColumns:"120px 130px 120px 1fr 80px 140px 1fr auto",gap:8,alignItems:"end",padding:linhas.length>1?"8px 10px 0 10px":0,borderTop:linhas.length>1&&idx>0?"1px solid #21262d22":undefined}}>
              <div>
                {idx===0&&<div style={{fontSize:10,color:"#484f58",marginBottom:4}}>DATA</div>}
                <input type="date" className="inp" value={f.data} onChange={e=>setLinha(idx,"data",e.target.value)}/>
              </div>
              <div>
                {idx===0&&<div style={{fontSize:10,color:"#484f58",marginBottom:4}}>ÁREA</div>}
                <input className="inp" placeholder="Área A" value={f.area} onChange={e=>setLinha(idx,"area",e.target.value)} list={`alist${idx}`}/>
                <datalist id={`alist${idx}`}>{areas.map(a=><option key={a} value={a}/>)}</datalist>
              </div>
              <div>
                {idx===0&&<div style={{fontSize:10,color:"#484f58",marginBottom:4}}>PONTO *</div>}
                {(()=>{const aid=resolveAreaId(f.area,null);const ps=(pontos||[]).filter(p=>p.areaId===aid).sort((a,b)=>(a.codigo||"").localeCompare(b.codigo||""));
                  return <select className="inp" value={f.pontoId||""} onChange={e=>setLinha(idx,"pontoId",e.target.value)} style={!f.pontoId?{borderColor:"#d29922"}:undefined}>
                    <option value="">— Selecione —</option><option value="NA">N/A</option>
                    {ps.map(p=><option key={p.id} value={p.id}>{p.codigo}</option>)}
                  </select>;})()}
              </div>
              <div>
                {idx===0&&<div style={{fontSize:10,color:"#484f58",marginBottom:4}}>SERVIÇO</div>}
                <select className="inp" value={f.sid} onChange={e=>setLinha(idx,"sid",e.target.value)}>
                  {svcF.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
                </select>
              </div>
              <div>
                {idx===0&&<div style={{fontSize:10,color:"#484f58",marginBottom:4}}>QTDE</div>}
                <input type="number" className="inp" placeholder="0" min="0" step="0.5" value={f.qtd} onChange={e=>setLinha(idx,"qtd",e.target.value)}/>
              </div>
              <div>
                {idx===0&&<div style={{fontSize:10,color:"#484f58",marginBottom:4}}>CLIENTE</div>}
                <select className="inp" value={f.cliId} onChange={e=>setLinha(idx,"cliId",e.target.value)}>
                  <option value="">— Sem cliente —</option>
                  {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
                </select>
              </div>
              <div>
                {idx===0&&<div style={{fontSize:10,color:"#484f58",marginBottom:4}}>OBSERVAÇÃO</div>}
                <input className="inp" placeholder="Opcional" value={f.obs} onChange={e=>setLinha(idx,"obs",e.target.value)}/>
              </div>
              <div style={{display:"flex",gap:4}}>
                {linhas.length>1&&(
                  <button className="btn btn-danger btn-xs" style={{alignSelf:"flex-end"}} onClick={()=>remLinha(idx)} title="Remover linha">✕</button>
                )}
              </div>
            </div>
          ))}
        </div>

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:12}}>
          <span style={{fontSize:11,color:"#484f58"}}>
            {linhas.length>1?`${linhas.length} atividades a lançar`:""}
          </span>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={addLinha}>+ Adicionar linha</button>
            <button className={`btn ${bc}`} onClick={lancar}>
              {linhas.length>1?`↑ Lançar ${linhas.length} atividades`:"+ Lançar"}
            </button>
          </div>
        </div>
      </div>}

      {/* Filtros */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {isRealizado&&(
            <>
              {[
                {id:"todos",    l:`Todos ${listaComPendentes.length>0?`(${listaComPendentes.length})`:""}`},
                {id:"pendentes",l:`⧖ Aguardando${nPendentes>0?` (${nPendentes})`:""}`},
                {id:"realizados",l:"✓ Realizados"},
              ].map(f=>(
                <button key={f.id} className="btn btn-ghost btn-sm"
                  onClick={()=>setFiltroStatus(f.id)}
                  style={filtroStatus===f.id?{borderColor:f.id==="pendentes"?"#d29922":"#388bfd",color:f.id==="pendentes"?"#d29922":"#388bfd"}:{}}>
                  {f.l}
                </button>
              ))}
              {nPendentes>0&&<span style={{width:1,height:16,background:"#21262d"}}/>}
            </>
          )}
          {areas.length>0&&(
            <>
              <span style={{fontSize:11,color:"#484f58"}}>Área:</span>
              {["", ...areas].map(a=>(
                <button key={a||"__"} className="btn btn-ghost btn-sm"
                  onClick={()=>setFiltroArea(a)}
                  style={filtroArea===a?{borderColor:"#388bfd",color:"#388bfd"}:{}}>
                  {a||"Todas"}
                </button>
              ))}
            </>
          )}
        </div>
      </div>

      {/* Lista por mês */}
      {meses.map(mes=>{
        const rows=porMes[mes].sort((a,b)=>{
          // Planejados primeiro, depois por data desc
          if(a._tipo!==b._tipo) return a._tipo==="planejado"?-1:1;
          return (b.data||"").localeCompare(a.data||"");
        });
        const totReal=rows.filter(r=>r._tipo==="realizado").reduce((a,l)=>a+(svcMap[l.sid]?.valor||0)*l.qtd,0);
        const totPlan=rows.filter(r=>r._tipo==="planejado").reduce((a,l)=>a+(svcMap[l.sid]?.valor||0)*l.qtd,0);
        const nPend=rows.filter(r=>r._tipo==="planejado").length;
        const mts=rows.filter(l=>l._tipo==="realizado"&&svcMap[l.sid]?.unidade==="m").reduce((a,l)=>a+l.qtd,0);
        return(
          <div key={mes} className="card" style={{padding:"14px 18px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <span className="mono" style={{color:"#c9d1d9",fontWeight:600}}>{mes}</span>
                {mts>0&&<span className="badge bb">{fmtN(mts)} m</span>}
                {isRealizado&&nPend>0&&<span className="badge bo">{nPend} pendente{nPend!==1?"s":""}</span>}
              </div>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                {isRealizado&&totPlan>0&&<span className="mono" style={{fontSize:11,color:"#484f58"}}>Plan: R$ {fmt(totPlan)}</span>}
                <span className="mono" style={{color:"#d29922"}}>R$ {fmt(totReal)}</span>
              </div>
            </div>
            <table className="table">
              <thead>
                <tr>
                  <th>DATA</th><th>ÁREA</th><th>SERVIÇO</th><th>CLIENTE</th><th>QTDE</th>
                  <th>V.UNIT.</th><th>TOTAL</th><th>OBS</th><th/>
                </tr>
              </thead>
              <tbody>
                {rows.map(l=>{
                  const s=svcMap[l.sid]||{};
                  const cor=COR[l.sid]||"#8b949e";
                  const cli=clientes.find(c=>c.id===l.cliId);
                  const isPend=l._tipo==="planejado";

                  if(isPend){
                    // Linha "planejada" — clicável para confirmar
                    return(
                      <tr key={"p_"+l.id}
                        onClick={()=>setModalPlan(l)}
                        style={{cursor:"pointer",background:"#388bfd08",opacity:.85}}
                        title="Clique para confirmar a realização"
                      >
                        <td className="mono" style={{fontSize:11,color:"#388bfd66"}}>{l.data}</td>
                        <td><span className="badge bg" style={{opacity:.7}}>{l.area||"—"}</span></td>
                        <td>
                          <span style={{display:"inline-flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                            <span className="badge" style={{background:cor+"15",color:cor+"88",border:`1px dashed ${cor}44`}}>{s.nome}</span>
                            <span className="badge" style={{background:"#388bfd18",color:"#388bfd",border:"1px solid #388bfd44",fontSize:10}}>⧖ PLANEJADO</span>
                          </span>
                        </td>
                        <td>{cli?<span className="badge bb" style={{opacity:.6}}>{cli.nome}</span>:<span style={{color:"#30363d",fontSize:11}}>—</span>}</td>
                        <td className="mono" style={{color:"#388bfd77"}}>{fmtN(l.qtd)} {s.unidade}</td>
                        <td className="mono" style={{color:"#484f58"}}>{s.valor>0?`R$ ${fmt(s.valor)}`:"—"}</td>
                        <td className="mono" style={{color:"#484f5888"}}>{s.valor>0?`R$ ${fmt(s.valor*l.qtd)}`:"—"}</td>
                        <td style={{color:"#484f58",fontSize:11}}>{l.obs}</td>
                        <td>
                          <button className="btn btn-primary btn-xs"
                            onClick={e=>{e.stopPropagation();setModalPlan(l);}}
                            title="Confirmar realização"
                          >✓ Confirmar</button>
                        </td>
                      </tr>
                    );
                  }

                  // Linha realizada normal
                  return(
                    <tr key={l.id}>
                      <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{l.data}</td>
                      <td><span className="badge bg">{l.area||"—"}</span></td>
                      <td>
                        <span style={{display:"inline-flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                          <span className="badge" style={{background:cor+"22",color:cor,border:`1px solid ${cor}44`}}>{s.nome}</span>
                          <span className="badge bg mono" style={{fontSize:10,color:"#e6edf3"}} title="Ponto">{l.pontoId?(pontoMapL[l.pontoId]?.codigo||"ponto removido"):"N/A"}</span>
                          {isRealizado&&l.planId&&<span className="badge bgn" style={{fontSize:10}}>✓ do planejado</span>}
                          {isRealizado&&!l.planId&&<span className="badge bo" style={{fontSize:10}}>não planejado</span>}
                          {isRealizado&&l.boletimId&&<span className="badge bg" style={{fontSize:10}}>boletim {fmtDateBR((boletins.find(b=>b.id===l.boletimId)||{}).data||l.data)}</span>}
                          {isRealizado&&(l.encerra===true||l.encerra==="true")&&<span className="badge bgn" style={{fontSize:10}}>encerrou</span>}
                          {!isRealizado&&situacaoPlan&&(()=>{const r=rotuloSituacao(l,situacaoPlan);const x=situacaoPlan[l.id];return <span className={`badge ${r.cls}`} style={{fontSize:10}} title={x?`${fmtN(x.acum)} de ${fmtN(l.qtd)} ${s.unidade||""} em ${x.n} lançamento(s)`:"Sem boletim vinculado"}>{r.t}{x?` · ${fmtN(x.acum)}/${fmtN(l.qtd)}`:""}</span>;})()}
                        </span>
                      </td>
                      <td>{cli?<span className="badge bb">{cli.nome}</span>:<span style={{color:"#30363d",fontSize:11}}>—</span>}</td>
                      <td className="mono">{fmtN(l.qtd)} {s.unidade}</td>
                      <td className="mono" style={{color:"#484f58"}}>{s.valor>0?`R$ ${fmt(s.valor)}`:"—"}</td>
                      <td className="mono" style={{color:"#d29922"}}>{s.valor>0?`R$ ${fmt(s.valor*l.qtd)}`:"—"}</td>
                      <td style={{color:"#484f58",fontSize:11}}>{l.obs}</td>
                      <td>
                        <div style={{display:"flex",gap:4}}>
                          <button className="btn btn-ghost btn-xs" onClick={()=>{const {_tipo, ...limpo}=l; setEditando(limpo);}} title="Editar lançamento">✎</button>
                          <button className="btn btn-danger btn-xs" onClick={()=>del(l.id)} title="Excluir lançamento">✕</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      })}

      {listaFiltrada.length===0&&(
        <div className="card" style={{padding:36,textAlign:"center",color:"#484f58"}}>
          {isRealizado&&filtroStatus==="pendentes"
            ?"Nenhum planejamento pendente de confirmação"
            :`Nenhum lançamento${cliAtivo?" para este cliente":""}`
          }
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  BOLETIM DIÁRIO DE EXECUÇÃO — lançamento do realizado vinculado ao planejado
//  Tabela boletins (cabeçalho) 1—N realizado (linhas: boletimId, planId, encerra)
// ═══════════════════════════════════════════════════════════════════════════
function BoletinsExecucao({boletins,setBoletins,planejado,realizado,setRealizado,servicos,svcMap,clientes,cliAtivo,areas,pontos=[]}){
  const [aberto,setAberto]=useState(null);       // {bol, linhas} em edição
  const [confirmDel,setConfirmDel]=useState(null);
  const [salvando,setSalvando]=useState(false);
  const [erro,setErro]=useState("");

  const lista=useMemo(()=>{
    const bs=(boletins||[]).filter(b=>!cliAtivo||b.cliId===cliAtivo);
    return bs.map(b=>{
      const ls=realizado.filter(r=>r.boletimId===b.id);
      return {...b,
        nLinhas:ls.length,
        nEnc:ls.filter(r=>r.encerra===true||r.encerra==="true").length,
        valor:ls.reduce((a,r)=>a+(svcMap[r.sid]?.valor||0)*parseFloat(r.qtd||0),0)};
    }).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  },[boletins,realizado,cliAtivo,svcMap]);

  const novo=()=>{
    setErro("");
    setAberto({bol:{id:uid(),data:hoje(),cliId:cliAtivo||"",responsavel:"",obs:"",status:"aberto"},linhas:[],novo:true});
  };
  const abrir=b=>{
    setErro("");
    const linhas=realizado.filter(r=>r.boletimId===b.id).map(r=>({
      key:r.id,id:r.id,planId:r.planId||null,sid:r.sid,area:r.area||"",areaId:r.areaId||null,pontoId:r.pontoId||null,
      qtd:String(r.qtd??""),obs:r.obs||"",encerra:r.encerra===true||r.encerra==="true"}));
    const {nLinhas,nEnc,valor,...bol}=b;
    setAberto({bol:{...bol,cliId:bol.cliId||"",responsavel:bol.responsavel||"",obs:bol.obs||"",status:bol.status||"aberto"},linhas,novo:false});
  };

  const excluir=b=>{
    setRealizado(prev=>prev.filter(r=>r.boletimId!==b.id));
    setBoletins(prev=>prev.filter(x=>x.id!==b.id));
    setConfirmDel(null);
  };

  if(aberto) return(
    <EditorBoletim
      aberto={aberto} setAberto={setAberto}
      planejado={planejado} realizado={realizado} servicos={servicos} svcMap={svcMap}
      clientes={clientes} areas={areas} pontos={pontos} salvando={salvando} erro={erro}
      onSalvar={async(bol,linhas,status)=>{
        setErro("");
        const validas=linhas.filter(l=>l.sid&&parseFloat(String(l.qtd).replace(",","."))>0);
        if(!bol.data){setErro("Informe a data do boletim.");return;}
        if(validas.length!==linhas.length){setErro("Há linhas sem serviço ou sem quantidade maior que zero.");return;}
        const cab={id:bol.id,data:bol.data,cliId:bol.cliId||"",responsavel:bol.responsavel||"",obs:bol.obs||"",status};
        setSalvando(true);
        try{
          // grava o cabeçalho antes das linhas (FK realizado.boletimId → boletins.id)
          await sb.upsert("boletins",cab);
        }catch(e){ setErro("Não foi possível salvar o boletim: "+e.message); setSalvando(false); return; }
        setBoletins(prev=>prev.some(x=>x.id===cab.id)?prev.map(x=>x.id===cab.id?{...x,...cab}:x):[cab,...prev]);
        const novas=validas.map(l=>({
          id:l.id||uid(), boletimId:cab.id, data:cab.data, cliId:cab.cliId||null,
          sid:l.sid, area:l.area||"", areaId:l.areaId||null, planId:l.planId||null, pontoId:l.pontoId||null,
          qtd:parseFloat(String(l.qtd).replace(",",".")), obs:l.obs||"",
          encerra:!!(l.planId&&l.encerra),
        }));
        setRealizado(prev=>[...novas,...prev.filter(r=>r.boletimId!==cab.id)]);
        setSalvando(false);
        setAberto(null);
      }}
    />
  );

  return(
    <div style={{display:"grid",gap:14}}>
      {confirmDel&&(
        <div style={{position:"fixed",inset:0,zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",background:"#000a"}}>
          <div className="card" style={{width:460,padding:"20px 22px"}}>
            <div className="sl" style={{marginBottom:10}}>EXCLUIR BOLETIM</div>
            <div style={{fontSize:13,color:"#c9d1d9",marginBottom:16}}>
              O boletim de {fmtDateBR(confirmDel.data)} e as suas {confirmDel.nLinhas} linha(s) de realizado serão excluídos. Os itens que ele encerrava voltam a ficar em aberto.
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button className="btn btn-ghost" onClick={()=>setConfirmDel(null)}>Cancelar</button>
              <button className="btn btn-danger" onClick={()=>excluir(confirmDel)}>Excluir</button>
            </div>
          </div>
        </div>
      )}
      <div className="card" style={{padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div>
          <div className="sl">BOLETINS DIÁRIOS DE EXECUÇÃO</div>
          <div style={{fontSize:12,color:"#8b949e",marginTop:4}}>Cada boletim registra o que foi executado no dia e vincula ao planejado.</div>
        </div>
        <button className="btn btn-success" onClick={novo}>+ Novo boletim</button>
      </div>
      <div className="card" style={{padding:"6px 0",overflowX:"auto"}}>
        <table className="table">
          <thead><tr><th>DATA</th><th>CLIENTE</th><th>RESPONSÁVEL</th><th>LINHAS</th><th>ENCERRADAS</th><th>VALOR</th><th>STATUS</th><th/></tr></thead>
          <tbody>
            {lista.map(b=>{
              const cli=clientes.find(c=>c.id===b.cliId);
              return(
                <tr key={b.id} style={{cursor:"pointer"}} onClick={()=>abrir(b)}>
                  <td className="mono" style={{fontSize:12}}>{fmtDateBR(b.data)}</td>
                  <td>{cli?<span className="badge bb">{cli.nome}</span>:<span style={{color:"#8b949e"}}>—</span>}</td>
                  <td style={{fontSize:12}}>{b.responsavel||<span style={{color:"#8b949e"}}>—</span>}</td>
                  <td className="mono">{b.nLinhas}</td>
                  <td className="mono">{b.nEnc}</td>
                  <td className="mono" style={{color:"#d29922"}}>R$ {fmt(b.valor)}</td>
                  <td><span className={`badge ${b.status==="fechado"?"bgn":"bb"}`}>{b.status==="fechado"?"Fechado":"Aberto"}</span></td>
                  <td>
                    <div style={{display:"flex",gap:4}}>
                      <button className="btn btn-ghost btn-xs" onClick={e=>{e.stopPropagation();abrir(b);}}>Abrir</button>
                      <button className="btn btn-danger btn-xs" title="Excluir boletim" onClick={e=>{e.stopPropagation();setConfirmDel(b);}}>✕</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {lista.length===0&&<div style={{padding:36,textAlign:"center",color:"#8b949e"}}>Nenhum boletim{cliAtivo?" para este cliente":""}. Clique em “+ Novo boletim”.</div>}
      </div>
    </div>
  );
}

function EditorBoletim({aberto,setAberto,planejado,realizado,servicos,svcMap,clientes,areas,pontos=[],salvando,erro,onSalvar}){
  const pontoMap=useMemo(()=>Object.fromEntries((pontos||[]).map(p=>[p.id,p])),[pontos]);
  const nomePonto=id=>id?(pontoMap[id]?.codigo||"ponto removido"):"N/A";
  const [bol,setBol]=useState(aberto.bol);
  const [linhas,setLinhas]=useState(aberto.linhas);
  const [busca,setBusca]=useState("");
  const somenteLeitura=bol.status==="fechado";

  // situação considerando apenas os OUTROS boletins (o atual está em edição)
  const sitOutros=useMemo(()=>calcSituacaoPlan(realizado.filter(r=>r.boletimId!==bol.id)),[realizado,bol.id]);
  const noBoletim=useMemo(()=>new Set(linhas.filter(l=>l.planId).map(l=>l.planId)),[linhas]);

  const abertos=useMemo(()=>{
    const q=busca.trim().toUpperCase();
    return planejado
      .filter(p=>!bol.cliId||p.cliId===bol.cliId)
      .filter(p=>!(sitOutros[p.id]?.encerrada))
      .filter(p=>!q||(p.area||"").toUpperCase().includes(q)||(svcMap[p.sid]?.nome||"").toUpperCase().includes(q)||nomePonto(p.pontoId).toUpperCase().includes(q))
      .sort((a,b)=>(a.area||"").localeCompare(b.area||"")||nomePonto(a.pontoId).localeCompare(nomePonto(b.pontoId))||(a.data||"").localeCompare(b.data||""));
  },[planejado,bol.cliId,sitOutros,busca,svcMap,pontoMap]);
  // agrupamento Área › Ponto
  const grupos=useMemo(()=>{
    const g=[];let atual=null;
    abertos.forEach(p=>{
      const k=(p.area||"Sem área")+"|"+(p.pontoId||"NA");
      if(!atual||atual.k!==k){atual={k,area:p.area||"Sem área",ponto:p.pontoId?nomePonto(p.pontoId):"N/A — serviço da área",novaArea:!g.length||g[g.length-1].area!==(p.area||"Sem área"),itens:[]};g.push(atual);}
      atual.itens.push(p);
    });
    return g;
  },[abertos,pontoMap]);

  const togglePlan=p=>{
    if(somenteLeitura) return;
    if(noBoletim.has(p.id)) setLinhas(ls=>ls.filter(l=>l.planId!==p.id));
    else setLinhas(ls=>[...ls,{key:uid(),id:null,planId:p.id,sid:p.sid,area:p.area||"",areaId:p.areaId||null,pontoId:p.pontoId||null,qtd:"",obs:"",encerra:false}]);
  };
  const addNaoPlanejada=()=>setLinhas(ls=>[...ls,{key:uid(),id:null,planId:null,sid:servicos[0]?.id||"",area:"",areaId:null,pontoId:null,qtd:"",obs:"",encerra:false}]);
  const setL=(key,campo,v)=>setLinhas(ls=>ls.map(l=>l.key===key?{...l,[campo]:v}:l));
  const remL=key=>setLinhas(ls=>ls.filter(l=>l.key!==key));
  const planMap=useMemo(()=>Object.fromEntries(planejado.map(p=>[p.id,p])),[planejado]);
  const areasCli=useMemo(()=>(areas||[]).filter(a=>!bol.cliId||a.cliId===bol.cliId).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"")),[areas,bol.cliId]);

  const nEnc=linhas.filter(l=>l.planId&&l.encerra).length;
  const valorDia=linhas.reduce((a,l)=>a+(svcMap[l.sid]?.valor||0)*(parseFloat(String(l.qtd).replace(",","."))||0),0);

  return(
    <div style={{display:"grid",gap:14}}>
      <div className="card" style={{padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div>
          <div className="sl">{aberto.novo?"NOVO BOLETIM DIÁRIO":"BOLETIM DIÁRIO"}</div>
          <div style={{fontSize:12,color:"#8b949e",marginTop:4}}>{linhas.length} linha(s) · {nEnc} encerrada(s) · R$ {fmt(valorDia)}</div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-ghost" onClick={()=>setAberto(null)} disabled={salvando}>Voltar</button>
          {somenteLeitura
            ?<button className="btn btn-primary" onClick={()=>setBol(b=>({...b,status:"aberto"}))}>Reabrir para edição</button>
            :<>
              <button className="btn btn-ghost" disabled={salvando} onClick={()=>onSalvar(bol,linhas,"aberto")}>Salvar</button>
              <button className="btn btn-success" disabled={salvando} onClick={()=>onSalvar(bol,linhas,"fechado")}>{salvando?"Salvando…":"Salvar e fechar"}</button>
            </>}
        </div>
      </div>
      {erro&&<div className="card" style={{padding:"10px 14px",borderColor:"#f8514966",color:"#f85149",fontSize:12}}>{erro}</div>}

      <div className="card" style={{padding:"14px 18px",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10}}>
        <div><div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>DATA DO BOLETIM</div>
          <input type="date" className="inp" disabled={somenteLeitura} value={bol.data} onChange={e=>setBol(b=>({...b,data:e.target.value}))}/></div>
        <div><div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>CLIENTE</div>
          <select className="inp" disabled={somenteLeitura||linhas.length>0} value={bol.cliId} onChange={e=>setBol(b=>({...b,cliId:e.target.value}))} title={linhas.length>0?"Remova as linhas para trocar o cliente":""}>
            <option value="">— Sem cliente —</option>
            {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
          </select></div>
        <div><div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>RESPONSÁVEL / EQUIPE</div>
          <input className="inp" disabled={somenteLeitura} value={bol.responsavel} onChange={e=>setBol(b=>({...b,responsavel:e.target.value}))}/></div>
        <div><div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>OBSERVAÇÃO DO DIA</div>
          <input className="inp" disabled={somenteLeitura} value={bol.obs} onChange={e=>setBol(b=>({...b,obs:e.target.value}))}/></div>
      </div>

      <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-start"}}>
        {/* Planejado em aberto */}
        <div className="card" style={{flex:"1 1 320px",maxWidth:420,minWidth:0}}>
          <div style={{padding:"12px 14px",borderBottom:"1px solid #21262d"}}>
            <div className="sl">PLANEJADO EM ABERTO</div>
            <input className="inp" style={{marginTop:8}} placeholder="Filtrar por área ou serviço" value={busca} onChange={e=>setBusca(e.target.value)}/>
          </div>
          <div style={{display:"grid",gap:6,padding:10,maxHeight:560,overflowY:"auto"}}>
            {grupos.map(g=>(
              <div key={g.k} style={{display:"grid",gap:6}}>
                {g.novaArea&&<div style={{fontSize:12,fontWeight:600,color:"#e6edf3",marginTop:4}}>{g.area}</div>}
                <div className="mono" style={{fontSize:11,color:"#8b949e",paddingLeft:6}}>› {g.ponto}</div>
            {g.itens.map(p=>{
              const s=svcMap[p.sid]||{}; const x=sitOutros[p.id]; const on=noBoletim.has(p.id);
              const acum=x?.acum||0; const pct=Math.min(100,Math.round(acum/(parseFloat(p.qtd)||1)*100));
              return(
                <label key={p.id} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 10px",borderRadius:6,cursor:somenteLeitura?"default":"pointer",background:on?"#1f6feb14":"#010409",border:`1px solid ${on?"#388bfd":"#21262d"}`}}>
                  <input type="checkbox" checked={on} disabled={somenteLeitura} onChange={()=>togglePlan(p)} style={{marginTop:3,accentColor:"#388bfd"}}/>
                  <div style={{flex:1,minWidth:0,display:"grid",gap:4}}>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      <span className={`badge ${x?"bb":"bg"}`}>{x?"Em andamento":"Pendente"}</span>
                    </div>
                    <div style={{color:"#e6edf3",fontSize:12}}>{s.nome||p.sid}</div>
                    <div style={{height:3,background:"#21262d",borderRadius:2,overflow:"hidden"}}><div style={{height:3,width:pct+"%",background:"#388bfd"}}/></div>
                    <div className="mono" style={{fontSize:10,color:"#8b949e"}}>{fmtN(acum)} de {fmtN(p.qtd)} {s.unidade} · plan. {fmtDateBR(p.data)}</div>
                  </div>
                </label>
              );
            })}
              </div>
            ))}
            {abertos.length===0&&<div style={{padding:20,textAlign:"center",color:"#8b949e",fontSize:12}}>Nenhum planejado em aberto{bol.cliId?" para este cliente":""}.</div>}
          </div>
        </div>

        {/* Linhas do boletim */}
        <div className="card" style={{flex:"999 1 560px",minWidth:0}}>
          <div style={{padding:"12px 14px",borderBottom:"1px solid #21262d",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <div className="sl">EXECUTADO NESTE BOLETIM</div>
            {!somenteLeitura&&<button className="btn btn-ghost btn-sm" onClick={addNaoPlanejada}>+ Atividade não planejada</button>}
          </div>
          {linhas.length===0&&<div style={{padding:40,textAlign:"center",color:"#8b949e"}}>Marque itens do planejado à esquerda ou adicione uma atividade não planejada.</div>}
          {linhas.map(l=>{
            const p=l.planId?planMap[l.planId]:null; const s=svcMap[l.sid]||{};
            const q=parseFloat(String(l.qtd).replace(",","."))||0;
            const ant=p?(sitOutros[p.id]?.acum||0):0; const acum=ant+q; const plan=p?parseFloat(p.qtd||0):0; const saldo=plan-acum;
            let aviso="";
            if(p&&l.encerra&&saldo>0) aviso=`Será encerrada com ${fmtN(saldo)} ${s.unidade||""} não executados.`;
            else if(p&&saldo<0) aviso=`O acumulado excede o planejado em ${fmtN(-saldo)} ${s.unidade||""}.`;
            else if(p&&!l.encerra&&q>0&&saldo===0) aviso="O planejado foi atingido. Deseja marcar como encerrada?";
            return(
              <div key={l.key} style={{padding:"12px 14px",borderBottom:"1px solid #21262d",display:"grid",gap:8}}>
                <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
                  <div style={{flex:"1 1 220px",minWidth:0,display:"grid",gap:4}}>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {p?<span className="badge bb">vínculo: planejado</span>:<span className="badge bo">não planejado</span>}
                      {p&&p.area&&<span className="badge bg">{p.area}</span>}
                      {p&&<span className="badge bg mono" style={{color:"#e6edf3"}}>{nomePonto(p.pontoId)}</span>}
                    </div>
                    {p
                      ?<div style={{color:"#e6edf3",fontSize:12}}>{s.nome||l.sid}</div>
                      :<div style={{display:"grid",gridTemplateColumns:"minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr)",gap:6}}>
                        <select className="inp" aria-label="Serviço" disabled={somenteLeitura} value={l.sid} onChange={e=>setL(l.key,"sid",e.target.value)}>
                          {servicos.map(x=><option key={x.id} value={x.id}>{x.nome}</option>)}
                        </select>
                        <select className="inp" aria-label="Área" disabled={somenteLeitura} value={l.areaId||""} onChange={e=>{const a=(areas||[]).find(a=>a.id===e.target.value);setLinhas(ls=>ls.map(x=>x.key===l.key?{...x,areaId:a?a.id:null,area:a?a.nome:"",pontoId:null}:x));}}>
                          <option value="">{l.area&&!l.areaId?l.area:"— Sem área —"}</option>
                          {areasCli.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}
                        </select>
                        <select className="inp" aria-label="Ponto" disabled={somenteLeitura||!l.areaId} value={l.pontoId||""} onChange={e=>setL(l.key,"pontoId",e.target.value||null)}>
                          <option value="">N/A</option>
                          {(pontos||[]).filter(pt=>pt.areaId===l.areaId).sort((a,b)=>(a.codigo||"").localeCompare(b.codigo||"")).map(pt=><option key={pt.id} value={pt.id}>{pt.codigo}</option>)}
                        </select>
                      </div>}
                  </div>
                  <div style={{width:120}}>
                    <div style={{fontSize:10,color:"#3fb950",marginBottom:4}}>QTDE HOJE ({s.unidade||"—"})</div>
                    <input type="number" min="0" step="0.5" className="inp" disabled={somenteLeitura} style={{borderColor:"#3fb95066"}} value={l.qtd} onChange={e=>setL(l.key,"qtd",e.target.value)}/>
                  </div>
                  {p&&<div style={{width:130}}>
                    <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>ACUMULADO / PLANEJ.</div>
                    <div className="mono" style={{padding:"7px 0",fontSize:12}}>{fmtN(acum)} / {fmtN(plan)}</div>
                  </div>}
                  {p&&<div>
                    <div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>SITUAÇÃO DO ITEM</div>
                    <div style={{display:"flex",border:"1px solid #30363d",borderRadius:6,overflow:"hidden"}}>
                      <button type="button" disabled={somenteLeitura} aria-pressed={!l.encerra} onClick={()=>setL(l.key,"encerra",false)} style={{padding:"7px 12px",border:"none",cursor:"pointer",fontWeight:500,background:!l.encerra?"#1f6feb":"transparent",color:!l.encerra?"#fff":"#8b949e"}}>Continua</button>
                      <button type="button" disabled={somenteLeitura} aria-pressed={l.encerra} onClick={()=>setL(l.key,"encerra",true)} style={{padding:"7px 12px",border:"none",borderLeft:"1px solid #30363d",cursor:"pointer",fontWeight:500,background:l.encerra?"#238636":"transparent",color:l.encerra?"#fff":"#8b949e"}}>Encerrada</button>
                    </div>
                  </div>}
                  {!somenteLeitura&&<button className="btn btn-danger btn-xs" aria-label="Remover linha" onClick={()=>remL(l.key)} style={{marginBottom:6}}>✕</button>}
                </div>
                <input className="inp" disabled={somenteLeitura} placeholder="Observação da linha (opcional)" value={l.obs} onChange={e=>setL(l.key,"obs",e.target.value)}/>
                {aviso&&<div style={{padding:"7px 10px",borderRadius:6,background:"#d2992218",border:"1px solid #d2992255",color:"#e3b341",fontSize:12}}>{aviso}</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  LABORATÓRIO
// ═══════════════════════════════════════════════════════════════════════════
function Laboratorio({amostras,setAmostras,clientes,cliAtivo}){
  const [showF,setShowF]=useState(false);
  const [editId,setEditId]=useState(null);
  const [filtro,setFiltro]=useState("todos");
  const [saveMsg,setSaveMsg]=useState(null);
  // Modal para laudo quando muda para Em Análise
  const [modalLaudo,setModalLaudo]=useState(null); // {id, dataLaudo, prazoLaudo}
  const empty={area:"",ponto:"",prof:"",tipo:"Solo",lab:"",nfe:"",dataColeta:hoje(),dataEnvio:"",prazoLaudo:"",dataLaudo:"",status:"coletado",obs:"",cliId:cliAtivo||""};
  const [f,setF]=useState(empty);
  useEffect(()=>setF(x=>({...x,cliId:cliAtivo||""})),[cliAtivo]);

  const salvar=()=>{
    if(!f.area||!f.ponto){
      setSaveMsg({tipo:"err",txt:"Preencha Área e Ponto de Sondagem antes de salvar."});
      setTimeout(()=>setSaveMsg(null),4000);
      return;
    }
    if(editId){setAmostras(a=>a.map(x=>x.id===editId?{...f,id:editId}:x));setEditId(null);}
    else setAmostras(a=>[{...f,id:uid()},...a]);
    setF(empty);setShowF(false);
    setSaveMsg({tipo:"ok",txt:editId?"Amostra atualizada!":"Amostra cadastrada!"});
    setTimeout(()=>setSaveMsg(null),3000);
  };
  const editar=a=>{setF(a);setEditId(a.id);setShowF(true);};
  const del=id=>setAmostras(a=>a.filter(x=>x.id!==id));

  // Atualiza campo inline direto na tabela
  const updCampo=(id,campo,valor)=>setAmostras(a=>a.map(x=>x.id===id?{...x,[campo]:valor}:x));

  // Muda status com automações:
  // → enviado: preenche dataEnvio com hoje
  // → em_analise: abre modal para informar dataLaudo + prazoLaudo
  // → laudo_ok: preenche dataLaudo com hoje (se vazia)
  const updSt=(id,st)=>{
    const amo=amostras.find(x=>x.id===id);
    if(!amo) return;
    if(st==="enviado"){
      setAmostras(a=>a.map(x=>x.id===id?{...x,status:st,dataEnvio:x.dataEnvio||hoje()}:x));
    } else if(st==="em_analise"){
      // Abre modal para preencher laudo e prazo
      setModalLaudo({id, dataLaudo:amo.dataLaudo||hoje(), prazoLaudo:amo.prazoLaudo||""});
      setAmostras(a=>a.map(x=>x.id===id?{...x,status:st}:x));
    } else if(st==="laudo_ok"){
      setAmostras(a=>a.map(x=>x.id===id?{...x,status:st,dataLaudo:x.dataLaudo||hoje()}:x));
    } else {
      setAmostras(a=>a.map(x=>x.id===id?{...x,status:st}:x));
    }
  };

  const confirmarLaudo=()=>{
    if(!modalLaudo) return;
    setAmostras(a=>a.map(x=>x.id===modalLaudo.id?{...x,dataLaudo:modalLaudo.dataLaudo,prazoLaudo:modalLaudo.prazoLaudo}:x));
    setModalLaudo(null);
  };

  const amoFilt=cliAtivo?amostras.filter(a=>a.cliId===cliAtivo):amostras;
  const lista=filtro==="todos"?amoFilt:amoFilt.filter(a=>a.status===filtro);
  const porArea={};
  lista.forEach(a=>{const k=a.area||"Sem Área";if(!porArea[k])porArea[k]=[];porArea[k].push(a);});

  // Estilo para célula editável inline
  const inpInline={background:"transparent",border:"none",borderBottom:"1px solid #30363d",color:"#c9d1d9",fontSize:11,padding:"2px 4px",width:"100%",fontFamily:"'IBM Plex Mono',monospace",outline:"none"};
  const inpInlineFocus="border-bottom-color:#388bfd";

  return(
    <div style={{display:"grid",gap:16}}>

      {/* Modal Em Análise → preenche laudo + prazo */}
      {modalLaudo&&(
        <div style={{position:"fixed",inset:0,zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",background:"#000a"}}>
          <div className="card" style={{width:420,padding:"22px 24px",border:"1px solid #388bfd44",boxShadow:"0 8px 40px #000a"}}>
            <div className="sl" style={{marginBottom:12}}>⟳ EM ANÁLISE — REGISTRAR LAUDO</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              <div>
                <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>PRAZO DO LAUDO (dias a partir do envio)</div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <input type="number" className="inp" min="1" max="365" placeholder="Ex: 30"
                    value={modalLaudo.diasPrazo||""}
                    onChange={e=>setModalLaudo(x=>({...x,diasPrazo:e.target.value,
                      prazoLaudo:e.target.value?addDias(amostras.find(a=>a.id===x.id)?.dataEnvio,e.target.value):""
                    }))}
                    autoFocus style={{width:90}}/>
                  {modalLaudo.prazoLaudo&&<span className="mono" style={{fontSize:11,color:"#d29922"}}>{modalLaudo.prazoLaudo}</span>}
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>DATA RECEBIMENTO (estimada)</div>
                <input type="date" className="inp" value={modalLaudo.dataLaudo}
                  onChange={e=>setModalLaudo(x=>({...x,dataLaudo:e.target.value}))}/>
              </div>
            </div>
            <div style={{fontSize:11,color:"#484f58",marginBottom:14}}>
              Esses campos ficam visíveis na coluna LAUDO e PRAZO da tabela.
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button className="btn btn-ghost" onClick={()=>setModalLaudo(null)}>Pular</button>
              <button className="btn btn-primary" onClick={confirmarLaudo}>✓ Salvar</button>
            </div>
          </div>
        </div>
      )}

      {saveMsg&&(
        <div style={{padding:"10px 16px",borderRadius:6,background:saveMsg.tipo==="ok"?"#23863618":"#f8514918",border:`1px solid ${saveMsg.tipo==="ok"?"#23863644":"#f8514944"}`,color:saveMsg.tipo==="ok"?"#3fb950":"#f85149",fontSize:13,fontWeight:500}}>
          {saveMsg.tipo==="ok"?"✓":"⚠"} {saveMsg.txt}
        </div>
      )}

      {/* Pipeline */}
      <div className="card" style={{padding:"16px 18px"}}>
        <div className="sl" style={{marginBottom:14}}>PIPELINE LABORATORIAL</div>
        <div style={{display:"flex",alignItems:"center"}}>
          {ST_LAB.filter(s=>s.id!=="reprovado").map((s,i,arr)=>{
            const n=amoFilt.filter(a=>a.status===s.id).length;
            const past=amoFilt.some(a=>{const mi=ST_LAB.findIndex(x=>x.id===a.status);const si=ST_LAB.findIndex(x=>x.id===s.id);return mi>si;});
            return(
              <div key={s.id} style={{display:"flex",alignItems:"center",flex:1}}>
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,minWidth:90}}>
                  <div style={{width:36,height:36,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,background:past?"#238636":n>0?"#1f6feb":"#21262d",border:`2px solid ${past?"#2ea043":n>0?"#388bfd":"#30363d"}`,zIndex:1}}>{s.icon}</div>
                  <div style={{fontSize:11,color:"#8b949e",textAlign:"center"}}>{s.label}</div>
                  <div className="mono" style={{fontSize:18,color:n>0?"#3fb950":"#30363d",fontWeight:600}}>{n}</div>
                </div>
                {i<arr.length-1&&<div style={{flex:1,height:2,background:past?"#238636":"#21262d",marginTop:-28,zIndex:0}}/>}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {[{id:"todos",label:"Todas"},...ST_LAB].map(s=>(
            <button key={s.id} className="btn btn-ghost btn-sm" onClick={()=>setFiltro(s.id)} style={filtro===s.id?{borderColor:"#388bfd",color:"#388bfd"}:{}}>
              {s.label} {s.id!=="todos"&&<span className="badge bg" style={{marginLeft:4}}>{amoFilt.filter(a=>a.status===s.id).length}</span>}
            </button>
          ))}
        </div>
        <button className="btn btn-primary" onClick={()=>{setF({...empty,cliId:cliAtivo||""});setEditId(null);setShowF(true);}}>+ Nova Amostra</button>
      </div>

      {showF&&(
        <div className="card ca-blue" style={{padding:"16px 18px"}}>
          <div className="sl" style={{marginBottom:12}}>{editId?"EDITAR":"NOVA"} AMOSTRA</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
            {[
              {k:"area",      l:"ÁREA / SETOR",     t:"text",ph:"Área A"},
              {k:"ponto",     l:"PONTO SONDAGEM",   t:"text",ph:"SPT-03"},
              {k:"prof",      l:"PROFUNDIDADE",     t:"text",ph:"2,0–2,5 m"},
              {k:"tipo",      l:"TIPO",             t:"sel", opts:["Solo","Água","Sedimento","Biota","Gás"]},
              {k:"lab",       l:"LABORATÓRIO",      t:"text",ph:"Nome do laboratório"},
              {k:"nfe",       l:"NF-e / REMESSA",   t:"text",ph:"NF 001/2024"},
              {k:"status",    l:"STATUS",           t:"sel", opts:ST_LAB.map(s=>s.id),labels:ST_LAB.map(s=>s.label)},
              {k:"dataColeta",l:"DATA COLETA",      t:"date"},
              {k:"dataEnvio", l:"DATA ENVIO",       t:"date"},
              {k:"prazoLaudo",l:"PRAZO LAUDO (data calculada)", t:"date"},
              {k:"dataLaudo", l:"DATA LAUDO REC.",  t:"date"},
            ].map(fd=>(
              <div key={fd.k}>
                <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>{fd.l}</div>
                {fd.t==="sel"
                  ?<select className="inp" value={f[fd.k]} onChange={e=>setF(x=>({...x,[fd.k]:e.target.value}))}>{fd.opts.map((o,i)=><option key={o} value={o}>{fd.labels?fd.labels[i]:o}</option>)}</select>
                  :<input type={fd.t} className="inp" placeholder={fd.ph} value={f[fd.k]} onChange={e=>setF(x=>({...x,[fd.k]:e.target.value}))}/>
                }
              </div>
            ))}
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>CLIENTE</div>
              <select className="inp" value={f.cliId} onChange={e=>setF(x=>({...x,cliId:e.target.value}))}>
                <option value="">— Sem cliente —</option>
                {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>OBSERVAÇÕES</div>
              <input className="inp" placeholder="Obs" value={f.obs} onChange={e=>setF(x=>({...x,obs:e.target.value}))}/>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <button className="btn btn-primary" onClick={salvar}>✓ Salvar</button>
            <button className="btn btn-ghost" onClick={()=>{setShowF(false);setEditId(null);}}>Cancelar</button>
          </div>
        </div>
      )}

      {Object.keys(porArea).sort().map(area=>{
        const its=porArea[area];
        const ldOK=its.filter(a=>a.status==="laudo_ok").length;
        return(
          <div key={area} className="card" style={{padding:"14px 18px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontWeight:600,color:"#c9d1d9",fontSize:14}}>{area}</span>
                <span className="badge bg">{its.length} amostras</span>
                {ldOK>0&&<span className="badge bgn">{ldOK} laudos OK</span>}
              </div>
              <div style={{fontSize:10,color:"#484f58"}}>Clique nos campos para editar direto na tabela</div>
            </div>
            <div style={{overflowX:"auto"}}>
            <table className="table">
              <thead><tr><th>PONTO</th><th>PROF.</th><th>TIPO</th><th>LAB.</th><th>NF-e</th><th>COLETA</th><th>ENVIO</th><th>PRAZO</th><th>LAUDO REC.</th><th>⌀</th><th>STATUS</th><th>AÇÕES</th></tr></thead>
              <tbody>
                {its.map(a=>{
                  const tl=diffD(a.dataEnvio,a.dataLaudo);
                  const dp=a.prazoLaudo&&a.status!=="laudo_ok"?diffD(hoje(),a.prazoLaudo):null;
                  return(
                    <tr key={a.id}>
                      {/* PONTO — editável inline */}
                      <td><input style={{...inpInline,color:"#388bfd",fontWeight:600,width:64}} value={a.ponto||""} onChange={e=>updCampo(a.id,"ponto",e.target.value)} onBlur={e=>updCampo(a.id,"ponto",e.target.value)} placeholder="SD-01"/></td>
                      {/* PROF — editável inline */}
                      <td><input style={{...inpInline,width:56,color:"#8b949e"}} value={a.prof||""} onChange={e=>updCampo(a.id,"prof",e.target.value)} placeholder="—"/></td>
                      {/* TIPO — select inline */}
                      <td>
                        <select style={{background:"transparent",border:"none",borderBottom:"1px solid #30363d",color:"#8b949e",fontSize:11,cursor:"pointer",padding:"2px 2px"}} value={a.tipo||"Solo"} onChange={e=>updCampo(a.id,"tipo",e.target.value)}>
                          {["Solo","Água","Sedimento","Biota","Gás"].map(t=><option key={t}>{t}</option>)}
                        </select>
                      </td>
                      {/* LAB — editável inline */}
                      <td><input style={{...inpInline,width:80,color:"#8b949e"}} value={a.lab||""} onChange={e=>updCampo(a.id,"lab",e.target.value)} placeholder="Lab"/></td>
                      {/* NF-e — editável inline */}
                      <td><input style={{...inpInline,width:72,color:"#8b949e"}} value={a.nfe||""} onChange={e=>updCampo(a.id,"nfe",e.target.value)} placeholder="NF"/></td>
                      {/* COLETA — date inline */}
                      <td><input type="date" style={{...inpInline,width:108}} value={a.dataColeta||""} onChange={e=>updCampo(a.id,"dataColeta",e.target.value)}/></td>
                      {/* ENVIO — date inline (preenchido auto ao mudar p/ Enviado) */}
                      <td><input type="date" style={{...inpInline,width:108,color:a.dataEnvio?"#c9d1d9":"#484f58"}} value={a.dataEnvio||""} onChange={e=>updCampo(a.id,"dataEnvio",e.target.value)}/></td>
                      {/* PRAZO — entra em dias, calcula data automaticamente */}
                      <td>
                        {a.prazoLaudo
                          ?<span className={`badge ${dp===null?"bg":dp<0?"br":dp<5?"bo":"bgn"}`} style={{cursor:"default"}}>{a.prazoLaudo}{dp!==null?` (${dp}d)`:""}</span>
                          :<div style={{display:"flex",alignItems:"center",gap:4}}>
                            <input type="number" style={{...inpInline,width:44}} min="1" placeholder="dias"
                              onBlur={e=>{if(e.target.value)updCampo(a.id,"prazoLaudo",addDias(a.dataEnvio,e.target.value));}}
                              onKeyDown={e=>{if(e.key==="Enter"&&e.target.value)updCampo(a.id,"prazoLaudo",addDias(a.dataEnvio,e.target.value));}}
                            />
                            <span style={{fontSize:10,color:"#484f58"}}>d</span>
                          </div>
                        }
                      </td>
                      {/* LAUDO REC — date inline (preenchido auto ao mudar p/ Em Análise) */}

function Relatorios({relats,setRelats,amostras,clientes,cliAtivo}){
  const [showF,setShowF]=useState(false);
  const [editId,setEditId]=useState(null);
  const empty={titulo:"",area:"",resp:"",laudos:[],inicio:hoje(),prazo:"",entrega:"",status:"nao_iniciado",obs:"",cliId:cliAtivo||""};

    if(!f.titulo)return;
    if(editId){setRelats(r=>r.map(x=>x.id===editId?{...f,id:editId}:x));setEditId(null);}

            <div key={s.id} className="card" style={{padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>

              {k:"resp",   l:"RESPONSÁVEL",   t:"text",ph:"Nome"},

              {k:"entrega",l:"DATA ENTREGA",  t:"date"},
            ].map(fd=>(
              <div key={fd.k}>
                <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>{fd.l}</div>

}

//  MEDIÇÃO — ciclo do cliente com gráfico planejado × realizado
// ═══════════════════════════════════════════════════════════════════════════
function Medicao({realizado,planejado,svcMap,clienteAtivo,periodosMedicao,setPeriodosMedicao}){
  // Se tem cliente com diaCorte, usa ciclos; senão usa corte manual
  const [corteManual,setCorteManual]=useState(hoje);

  // ── Estado do modal de Boletim de Medição ─────────────────────────────
  const [bmModal,setBmModal]=useState(false);
  const [bmCicloIdx,setBmCicloIdx]=useState(null); // índice no array ciclos
  const [bmNumMedicao,setBmNumMedicao]=useState("");
  const [bmDataMedicao,setBmDataMedicao]=useState(hoje());
  const [bmPeriodo,setBmPeriodo]=useState("");
  const [bmGerando,setBmGerando]=useState(false);

  const planejadoPendente=planejado;

  const ciclos = useMemo(()=>{
    if(!clienteAtivo?.diaCorte) return null;
    // Gerar últimos 6 ciclos, aplicando período customizado (se o usuário tiver editado)
    const dia=parseInt(clienteAtivo.diaCorte)||1;
    const arr=[];
    for(let i=5;i>=0;i--){
      const ref=new Date();
      ref.setMonth(ref.getMonth()-i);
      const cBase=periodoCiclo(dia, ref.toISOString().slice(0,10));
      const c=aplicarOverrideCiclo(cBase, periodosMedicao, clienteAtivo.id);
      const real=realizado.filter(l=>l.data>=c.inicio&&l.data<=c.fim).reduce((a,l)=>a+(svcMap[l.sid]?.valor||0)*l.qtd,0);
      const plan=planejadoPendente.filter(l=>l.data>=c.inicio&&l.data<=c.fim).reduce((a,l)=>a+(svcMap[l.sid]?.valor||0)*l.qtd,0);
      arr.push({...c,real,plan,cicloLabel:`${c.inicio.slice(5).replace("-","/")} → ${c.fim.slice(5).replace("-","/")}/${c.fim.slice(0,4)}`});
    }
    return arr;
  },[clienteAtivo,realizado,planejadoPendente,svcMap,periodosMedicao]);

  const cicloAtual = ciclos?.[ciclos.length-1]||null;

  // ── Abre modal pré-preenchido para o ciclo selecionado ─────────────────
  const abrirBM=(cicloIdx)=>{
    const c=ciclos?.[cicloIdx]||cicloAtual;
    if(!c) return;
    setBmCicloIdx(cicloIdx);
    // Formata período: "21/05/2026 a 20/06/2026"
    const fmt2=(d)=>{const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`;};
    setBmPeriodo(`${fmt2(c.inicio)} a ${fmt2(c.fim)}`);
    setBmDataMedicao(c.fim);
    setBmModal(true);
  };

  // ── Gera o XLSX clonando a estrutura do BM original ────────────────────
  const gerarBM=()=>{
    setBmGerando(true);
    try{
      const c=ciclos?.[bmCicloIdx]||cicloAtual;
      if(!c){setBmGerando(false);return;}

      // Quantitativos do mês por bm-item: soma qtd realizada no período do ciclo
      const qtdMes={};
      realizado
        .filter(l=>l.data>=c.inicio&&l.data<=c.fim)
        .forEach(l=>{
          const svc=svcMap[l.sid];
          if(!svc||!svc.bm)return;
          qtdMes[svc.bm]=(qtdMes[svc.bm]||0)+l.qtd;
        });

      // Quantitativos acumulados ANTERIORES ao ciclo (tudo antes do inicio)
      const qtdAcumAntes={};
      realizado
        .filter(l=>l.data<c.inicio)
        .forEach(l=>{
          const svc=svcMap[l.sid];
          if(!svc||!svc.bm)return;

        {bm:2, desc:'Mobilização/ Desmobilização de Equipe para Sondagem/Investigação confirmatória (Belo Horizonte/MG; Betim/MG; Mario Campos/MG; São Joaquim de Bicas/MG;  Brumadinho/MG; Igarapé/MG; Juatuba/MG, , Esmeraldas/MG).',unid:82,pu:15900},

        {bm:4, desc:'Mobilização/ Desmobilização de Equipe para Sondagem/Investigação confirmatória (Pará de Minas/MG; Fortuna de Minas/MG; Paraopeba/MG; São José da Varginha/MG;',unid:5,pu:15900},

//  RELATÓRIO DE QUANTITATIVOS POR ÁREA
// ═══════════════════════════════════════════════════════════════════════════
function RelatorioQtd({realizado,planejado,svcMap,clientes,clienteAtivo,servicos}){
  const [dataIni,setDataIni]=useState(()=>new Date(new Date().getFullYear(),0,1).toISOString().slice(0,10));
  const [dataFim,setDataFim]=useState(hoje);
  const [modoData,setModoData]=useState("periodo"); // "periodo" | "ate"
  const [incPlanejado,setIncPlanejado]=useState(true);
  const [areaFiltro,setAreaFiltro]=useState(""); // "" = todas
  const printRef=useRef();

  // Dados filtrados pelo período
  const realFilt=useMemo(()=>{
    if(modoData==="ate") return realizado.filter(l=>l.data<=dataFim);
    return realizado.filter(l=>l.data>=dataIni&&l.data<=dataFim);
  },[realizado,dataIni,dataFim,modoData]);

  const planFilt=useMemo(()=>{
    if(!incPlanejado) return [];
    if(modoData==="ate") return planejado.filter(l=>l.data<=dataFim);
    return planejado.filter(l=>l.data>=dataIni&&l.data<=dataFim);
  },[planejado,dataIni,dataFim,modoData,incPlanejado]);

  // Áreas presentes
  const todasAreas=useMemo(()=>[...new Set([
    ...realFilt.map(l=>l.area).filter(Boolean),
    ...planFilt.map(l=>l.area).filter(Boolean),
  ])].sort(),[realFilt,planFilt]);

  const realParaCalc=areaFiltro?realFilt.filter(l=>l.area===areaFiltro):realFilt;
  const planParaCalc=areaFiltro?planFilt.filter(l=>l.area===areaFiltro):planFilt;

  // Agrupar por área → serviço
  const dados=useMemo(()=>{
    const areas={};
    const add=(lista,tipo)=>{
      lista.forEach(l=>{
        const area=l.area||"(Sem área)";
        const svc=svcMap[l.sid];
        if(!svc)return;
        if(!areas[area])areas[area]={area,itens:{}};
        if(!areas[area].itens[l.sid])areas[area].itens[l.sid]={sid:l.sid,svc,real:0,plan:0};
        areas[area].itens[l.sid][tipo]+=l.qtd;
      });
    };
    add(realParaCalc,"real");
    if(incPlanejado) add(planParaCalc,"plan");
    // Converter para array ordenado
    return Object.values(areas).sort((a,b)=>a.area.localeCompare(b.area)).map(a=>({
      ...a,
      itens:Object.values(a.itens).sort((x,y)=>x.svc.nome.localeCompare(y.svc.nome)),
    }));
  },[realParaCalc,planParaCalc,incPlanejado,svcMap]);

  // Totais globais
  const totais=useMemo(()=>({
    real: dados.reduce((s,a)=>s+a.itens.reduce((ss,i)=>ss+(svcMap[i.sid]?.valor||0)*i.real,0),0),
    plan: dados.reduce((s,a)=>s+a.itens.reduce((ss,i)=>ss+(svcMap[i.sid]?.valor||0)*i.plan,0),0),
  }),[dados,svcMap]);

  // Gerar HTML para impressão / download
  const gerarHTML=()=>{
    const periodoStr=modoData==="ate"
      ?`Acumulado até ${dataFim}`
      :`${dataIni} a ${dataFim}`;
    const cliStr=clienteAtivo?clienteAtivo.nome:"Todos os clientes";
    const areaStr=areaFiltro||"Todas";

    const linhasTabela=dados.map(grupo=>{
      const subtotalReal=grupo.itens.reduce((s,i)=>s+(svcMap[i.sid]?.valor||0)*i.real,0);
      const subtotalPlan=grupo.itens.reduce((s,i)=>s+(svcMap[i.sid]?.valor||0)*i.plan,0);
      const avanco=subtotalPlan>0?((subtotalReal/subtotalPlan)*100).toFixed(1):"-";
      const linhasItens=grupo.itens.map(i=>{
        const vr=(svcMap[i.sid]?.valor||0)*i.real;
        const vp=(svcMap[i.sid]?.valor||0)*i.plan;
        const avItem=vp>0?((vr/vp)*100).toFixed(1):"-";
        return `
          <tr>
            <td>${i.svc.nome}</td>
            <td class="un">${i.svc.unidade}</td>
            ${incPlanejado?`<td class="num">${Number(i.plan).toLocaleString("pt-BR",{maximumFractionDigits:2})}</td><td class="num">R$ ${Number(vp).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`:""}
            <td class="num">${Number(i.real).toLocaleString("pt-BR",{maximumFractionDigits:2})}</td>
            <td class="num">R$ ${Number(vr).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
            ${incPlanejado?`<td class="num av">${avItem}%</td>`:""}
          </tr>`;
      }).join("");
      const subtLine=`
        <tr class="subtotal">
          <td colspan="${incPlanejado?2:2}">Subtotal — ${grupo.area}</td>
          ${incPlanejado?`<td class="num"></td><td class="num">R$ ${Number(subtotalPlan).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>`:""}
          <td class="num"></td>
          <td class="num">R$ ${Number(subtotalReal).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
          ${incPlanejado?`<td class="num av">${avanco}%</td>`:""}
        </tr>`;
      return `<tr class="area-header"><td colspan="${incPlanejado?7:4}">${grupo.area}</td></tr>${linhasItens}${subtLine}`;
    }).join("");

    const colSpanTotal=incPlanejado?7:4;
    const totalLine=`
      <tr class="grand-total">
        <td colspan="${incPlanejado?4:3}">TOTAL GERAL</td>
        ${incPlanejado?`<td class="num">R$ ${Number(totais.plan).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>`:""}
        <td class="num">R$ ${Number(totais.real).toLocaleString("pt-BR",{minimumFractionDigits:2})}</td>
        ${incPlanejado?`<td class="num av">${totais.plan>0?((totais.real/totais.plan)*100).toFixed(1):"-"}%</td>`:""}
      </tr>`;

    const html=`<!DOCTYPE html>
