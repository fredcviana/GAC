            <div className="card" style={{padding:"14px 18px",borderTop:"2px solid #388bfd"}}>
              <div style={{fontSize:10,color:"#388bfd",marginBottom:4}}>PLANEJADO</div>
              <div className="mono" style={{fontSize:20,fontWeight:700,color:"#388bfd"}}>R$ {fmt(totalPlan)}</div>
              <div style={{fontSize:11,color:"#484f58",marginTop:4}}>{custosPlanCalc.length} ocorrências</div>
            </div>
            <div className="card" style={{padding:"14px 18px",borderTop:"2px solid #3fb950"}}>
              <div style={{fontSize:10,color:"#3fb950",marginBottom:4}}>CONFIRMADO (realizado no GAC)</div>
              <div className="mono" style={{fontSize:20,fontWeight:700,color:"#3fb950"}}>R$ {fmt(totalReal)}</div>
              <div style={{fontSize:11,color:"#484f58",marginTop:4}}>{custosRealCalc.length} ocorrências</div>
            </div>
          </div>
          {(custosPlanCalc.length>0||custosRealCalc.length>0)?(
            <div className="card" style={{padding:"14px 18px"}}>
              <table className="table">
                <thead>
                  <tr>
                    <th>TIPO</th><th>DATA</th><th>ÁREA</th><th>REGRA</th><th>CAT.</th>
                    <th style={{textAlign:"right"}}>QTD</th><th style={{textAlign:"right"}}>VALOR</th>
                  </tr>
                </thead>
                <tbody>
                  {[...custosPlanCalc,...custosRealCalc].sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(c=>(
                    <tr key={c._id}>
                      <td>
                        {c.tipo==="planejado"
                          ?<span className="badge" style={{background:"#388bfd22",color:"#388bfd",border:"1px solid #388bfd44",fontSize:10}}>Plan.</span>
                          :<span className="badge bgn" style={{fontSize:10}}>Real.</span>
                        }
                      </td>
                      <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{c.data||"—"}</td>
                      <td style={{color:"#c9d1d9",fontSize:12}}>{c.area}</td>
                      <td style={{color:"#d2a8ff",fontSize:12}}>{c.regra}</td>
                      <td><span className="badge bp" style={{fontSize:10}}>{c.cat}</span></td>
                      <td className="mono" style={{textAlign:"right",color:"#8b949e",fontSize:11}}>{c.qtd}</td>
                      <td className="mono" style={{textAlign:"right",color:c.tipo==="planejado"?"#388bfd":"#3fb950",fontWeight:600}}>R$ {fmt(c.valor)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ):(
            <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
              <div style={{fontSize:13,color:"#8b949e"}}>Nenhuma ocorrência para o ciclo {cicloSel.label}.</div>
            </div>
          )}
        </div>
      )}

      {viewMode==="config"&&(
        <div style={{display:"grid",gap:16}}>
          <div className="card ca-orange" style={{padding:"14px 18px"}}>
            <div className="sl" style={{marginBottom:6}}>COMO FUNCIONA</div>
            <div style={{fontSize:12,color:"#8b949e",lineHeight:1.8}}>
              Configure uma <strong style={{color:"#c9d1d9"}}>regra de custo variável</strong> por serviço.
              O sistema calcula <span style={{color:"#d29922"}}>Qtde × Valor/Unidade</span> automaticamente.
              Use a aba <strong style={{color:"#388bfd"}}>Planejado × Confirmado</strong> para ver os valores por mês.
            </div>
          </div>

          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <button className="btn btn-primary" onClick={()=>setForm(empty())}>+ Nova Regra</button>
          </div>

          {form&&(
            <div className="card ca-orange" style={{padding:"16px 18px"}}>
              <div className="sl" style={{marginBottom:12}}>{form.id?"EDITAR":"NOVA"} REGRA DE CUSTO VARIÁVEL</div>
              <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:12,alignItems:"end"}}>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>SERVIÇO QUE DISPARA *</div>
                  <select className="inp" value={form.sid} onChange={e=>{
                    const svc=svcMap[e.target.value];
                    setForm(x=>({...x,sid:e.target.value,nome:x.nome||(svc?`Custo por ${svc.unidade} — ${svc.nome.split("—")[0].trim()}`:"")}));
                  }}>
                    {servicos.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
                  </select>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>CATEGORIA</div>
                  <select className="inp" value={form.categoria} onChange={e=>setForm(x=>({...x,categoria:e.target.value}))}>
                    {CATS_CUSTO_VAR.map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>VALOR/{svcMap[form.sid]?.unidade||"UN"} (R$) *</div>
                  <input type="number" className="inp" placeholder="0,00" min="0" step="0.01"
                    value={form.valorPorUnidade} onChange={e=>setForm(x=>({...x,valorPorUnidade:e.target.value}))}/>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn btn-success" onClick={salvar} disabled={!form.sid||!form.nome||!form.valorPorUnidade}>✓</button>
                  <button className="btn btn-ghost" onClick={()=>setForm(null)}>✕</button>
                </div>
              </div>
              <div style={{marginTop:10}}>
                <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>NOME DA REGRA *</div>
                <input className="inp" placeholder="Ex: Custo Metro Perfurado Direct Push"
                  value={form.nome} onChange={e=>setForm(x=>({...x,nome:e.target.value}))}/>
              </div>
            </div>
          )}

          {custosVarConfig.length===0&&!form&&(
            <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
              <div style={{fontSize:28,marginBottom:10}}>⚙</div>
              <div style={{fontSize:13,color:"#8b949e",marginBottom:6}}>Nenhuma regra configurada</div>
              <button className="btn btn-primary btn-sm" onClick={()=>setForm(empty())}>+ Criar primeira regra</button>
            </div>
          )}

          {custosVarConfig.length>0&&(
            <div className="card" style={{padding:"14px 18px"}}>
              <div className="sl" style={{marginBottom:12}}>REGRAS CONFIGURADAS</div>
              <table className="table">
                <thead>
                  <tr>
                    <th>SERVIÇO</th><th>NOME DA REGRA</th><th>CATEGORIA</th>
                    <th style={{textAlign:"right"}}>VALOR/UN.</th>
                    <th style={{textAlign:"center"}}>ATIVO</th>
                    <th/>
                  </tr>
                </thead>
                <tbody>
                  {custosVarConfig.map(r=>{
                    const svc=svcMap[r.sid]||{};
                    const cor=COR[r.sid]||"#8b949e";
                    return(
                      <tr key={r.id} style={{opacity:r.ativo?1:.5}}>
                        <td>
                          <span className="badge" style={{background:cor+"22",color:cor,border:`1px solid ${cor}44`}}>{svc.nome||r.sid}</span>
                          <span style={{fontSize:10,color:"#484f58",marginLeft:6}}>{svc.unidade}/un</span>
                        </td>
                        <td style={{color:"#c9d1d9",fontWeight:500}}>{r.nome}</td>
                        <td><span className="badge bg">{r.categoria}</span></td>
                        <td className="mono" style={{textAlign:"right",color:"#d29922",fontWeight:600}}>
                          R$ {fmt(r.valorPorUnidade)}<span style={{fontSize:10,color:"#484f58"}}>/{svc.unidade}</span>
                        </td>
                        <td style={{textAlign:"center"}}>
                          <button onClick={()=>toggleAtivo(r.id)}
                            style={{background:"none",border:"none",cursor:"pointer",fontSize:18,lineHeight:1}}
                            title={r.ativo?"Desativar":"Ativar"}>
                            {r.ativo?"🟢":"⚪"}
                          </button>
                        </td>
                        <td>
                          {confirmDel===r.id?(
                            <div style={{display:"flex",gap:4}}>
                              <button className="btn btn-danger btn-xs" onClick={()=>del(r.id)}>✓</button>
                              <button className="btn btn-ghost btn-xs" onClick={()=>setConfirmDel(null)}>✕</button>
                            </div>
                          ):(
                            <div style={{display:"flex",gap:4}}>
                              <button className="btn btn-ghost btn-xs" onClick={()=>setForm({...r})}>✎</button>
                              <button className="btn btn-danger btn-xs" onClick={()=>setConfirmDel(r.id)}>✕</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}


// ── Custos Fixos por Ciclo de Medição ────────────────────────────────────
function CustosFixos({custosFixos, setCustosFixos, clientes, cliAtivo, periodosMedicao, setPeriodosMedicao}){
  const clienteAtivo = useMemo(()=>clientes.find(c=>c.id===cliAtivo)||null,[clientes,cliAtivo]);
  const diaCorte = clienteAtivo?.diaCorte || "1";
  const ciclos = useMemo(()=>ciclosRange(diaCorte,18,periodosMedicao,cliAtivo),[diaCorte,periodosMedicao,cliAtivo]);
  const cicloDefault = useMemo(()=>cicloAtualRef(diaCorte,periodosMedicao,cliAtivo),[diaCorte,periodosMedicao,cliAtivo]);
  const [cicloMesRef, setCicloMesRef] = useState(cicloDefault.mesRef);
  useEffect(()=>{ setCicloMesRef(cicloAtualRef(diaCorte,periodosMedicao,cliAtivo).mesRef); },[diaCorte]);
  const cicloSel = useMemo(()=>ciclos.find(c=>c.mesRef===cicloMesRef)||ciclos[0]||cicloDefault,[ciclos,cicloMesRef,cicloDefault]);
  const [form, setForm]  = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmReal, setConfirmReal] = useState(null);
  const [recorrModal, setRecorrModal] = useState(null);

  const emptyForm = ()=>({
    cat:CATS_CUSTO[0], descricao:"", valor:"", valorRealizado:"",
    cicloInicio: cicloSel.inicio, cicloFim: cicloSel.fim,
    mes: cicloSel.inicio.slice(0,7), mesRef: cicloSel.mesRef,
  });

  // Registros novos são vinculados por mesRef (estável mesmo se o período for editado depois).
  // Registros antigos (criados antes desta funcionalidade) caem no fallback por cicloInicio/mes.
  const doFiltro = useMemo(()=>custosFixos.filter(c=>{
    if(c.mesRef) return c.mesRef===cicloSel.mesRef;
    if(c.cicloInicio) return c.cicloInicio===cicloSel.inicio;
    return c.mes===cicloSel.inicio.slice(0,7);
  }),[custosFixos,cicloSel]);

  const valorEfetivo = c => parseFloat(c.valorRealizado||"") || parseFloat(c.valor||0);
  const totalCicloPlano     = useMemo(()=>doFiltro.reduce((s,c)=>s+parseFloat(c.valor||0),0),[doFiltro]);
  const totalCicloRealizado = useMemo(()=>doFiltro.reduce((s,c)=>s+valorEfetivo(c),0),[doFiltro]);
  const temDivergencia = doFiltro.some(c=>c.valorRealizado&&parseFloat(c.valorRealizado)!==parseFloat(c.valor||0));

  const porCat = useMemo(()=>{
    const r={}; CATS_CUSTO.forEach(k=>r[k]=0);
    doFiltro.forEach(c=>r[c.cat]=(r[c.cat]||0)+valorEfetivo(c));
    return r;
  },[doFiltro]);

  const salvar=()=>{
    if(!form.descricao||!form.valor) return;
    const item={...form, cicloInicio:cicloSel.inicio, cicloFim:cicloSel.fim, mes:cicloSel.inicio.slice(0,7), mesRef:cicloSel.mesRef};
    if(form.id){ setCustosFixos(a=>a.map(x=>x.id===form.id?{...item}:x)); }
    else        { setCustosFixos(a=>[{...item,id:uid()},...a]); }
    setForm(null);
  };
  const del=id=>{setCustosFixos(a=>a.filter(x=>x.id!==id));setConfirmDel(null);};

  const confirmarReal=(id, valor)=>{
    setCustosFixos(a=>a.map(x=>x.id===id?{...x,valorRealizado:String(valor)}:x));
    setConfirmReal(null);
  };

  const aplicarRecorrencia=(item, nMeses)=>{
    const dia=parseInt(diaCorte)||1;
    const [y,m,d]=item.cicloInicio.split("-").map(Number);
    const novos=[];
    for(let i=1;i<=nMeses;i++){
      const dataRef=new Date(y,m-1+i,dia);
      const cBase=periodoCiclo(dia, dataRef.toISOString().slice(0,10));
      const c=aplicarOverrideCiclo(cBase, periodosMedicao, cliAtivo);
      const jaExiste=custosFixos.some(x=>(x.mesRef?x.mesRef===c.mesRef:x.cicloInicio===c.inicio)&&x.descricao===item.descricao&&x.cat===item.cat);
      if(!jaExiste) novos.push({...item, id:uid(), cicloInicio:c.inicio, cicloFim:c.fim, mes:c.inicio.slice(0,7), mesRef:c.mesRef, valorRealizado:""});
    }
    if(novos.length) setCustosFixos(a=>[...a,...novos]);
    setRecorrModal(null);
  };

  return(
    <div style={{display:"grid",gap:16}}>
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:10,color:"#484f58",marginBottom:4,display:"flex",alignItems:"center",gap:6}}>
            <span>CICLO DE MEDIÇÃO</span>
            <EditorPeriodoCiclo ciclo={cicloSel} cliId={cliAtivo} periodosMedicao={periodosMedicao} setPeriodosMedicao={setPeriodosMedicao}/>
          </div>
          <select className="inp" style={{width:240}} value={cicloMesRef} onChange={e=>setCicloMesRef(e.target.value)}>
            {ciclos.map(c=><option key={c.mesRef} value={c.mesRef}>{c.label}{c.editado?" ✎":""}</option>)}
          </select>
          {clienteAtivo
            ?<div style={{fontSize:10,color:"#484f58",marginTop:3}}>Dia de corte: <span style={{color:"#d29922"}}>{diaCorte}</span> — {clienteAtivo.nome}</div>
            :<div style={{fontSize:10,color:"#f85149",marginTop:3}}>Selecione um cliente na barra lateral para ver os ciclos corretos</div>
          }
        </div>
        <div style={{marginTop:14}}>
          <button className="btn btn-primary" onClick={()=>setForm(emptyForm())}>+ Novo custo fixo</button>
        </div>
        {(totalCicloPlano>0||totalCicloRealizado>0)&&(
          <div style={{marginLeft:"auto",textAlign:"right"}}>
            <div style={{display:"flex",gap:16,justifyContent:"flex-end"}}>
              <div>
                <div style={{fontSize:10,color:"#388bfd"}}>PLANEJADO</div>
                <div className="mono" style={{fontSize:16,fontWeight:600,color:"#388bfd"}}>R$ {fmt(totalCicloPlano)}</div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#3fb950"}}>REALIZADO</div>
                <div className="mono" style={{fontSize:16,fontWeight:600,color:"#3fb950"}}>R$ {fmt(totalCicloRealizado)}</div>
              </div>
            </div>
          </div>
        )}
      </div>

      {totalCicloRealizado>0&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10}}>
          {CATS_CUSTO.filter(k=>porCat[k]>0).map(k=>{
            const c=CAT_COR[k]||CAT_COR["Outros"];
            const pct=totalCicloRealizado>0?(porCat[k]/totalCicloRealizado*100):0;
            return(
              <div key={k} className="card" style={{padding:"12px 14px",borderTop:`2px solid ${c.fg}`}}>
                <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>{k.toUpperCase()}</div>
                <div className="mono" style={{fontWeight:600,color:c.fg,fontSize:14}}>R$ {fmt(porCat[k])}</div>
                <div className="pt" style={{marginTop:6}}><div className="pf" style={{width:`${pct}%`,background:c.fg}}/></div>
              </div>
            );
          })}
        </div>
      )}

      {form&&(
        <div className="card ca-red" style={{padding:"16px 18px"}}>
          <div className="sl" style={{marginBottom:12}}>{form.id?"EDITAR":"NOVO"} CUSTO FIXO — {cicloSel.label}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:10,alignItems:"end"}}>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>CATEGORIA</div>
              <select className="inp" value={form.cat} onChange={e=>setForm(x=>({...x,cat:e.target.value}))}>
                {CATS_CUSTO.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>DESCRIÇÃO *</div>
              <input className="inp" placeholder="Ex: Salário equipe técnica" value={form.descricao} onChange={e=>setForm(x=>({...x,descricao:e.target.value}))}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#388bfd",marginBottom:4}}>VALOR PLANEJADO (R$) *</div>
              <input type="number" className="inp" style={{borderColor:"#388bfd55"}} placeholder="0,00" min="0" step="0.01" value={form.valor} onChange={e=>setForm(x=>({...x,valor:e.target.value}))}/>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button className="btn btn-success btn-sm" onClick={salvar} disabled={!form.descricao||!form.valor}>✓</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setForm(null)}>✕</button>
            </div>
          </div>
        </div>
      )}

      {recorrModal&&(
        <div style={{position:"fixed",inset:0,background:"#000a",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setRecorrModal(null)}>
          <div className="card" style={{padding:"24px 28px",minWidth:360,maxWidth:460}} onClick={e=>e.stopPropagation()}>
            <div className="sl" style={{marginBottom:6}}>CRIAR RECORRÊNCIA</div>
            <div style={{fontSize:12,color:"#8b949e",marginBottom:16}}>
              Replicar <strong style={{color:"#c9d1d9"}}>{recorrModal.item.descricao}</strong> (R$ {fmt(recorrModal.item.valor)}) para os próximos ciclos.
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:10,color:"#484f58",marginBottom:6}}>REPETIR POR QUANTOS MESES À FRENTE?</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                {[1,2,3,6,12].map(n=>(
                  <button key={n} className={`btn btn-sm ${recorrModal.meses===n?"btn-primary":"btn-ghost"}`}
                    onClick={()=>setRecorrModal(x=>({...x,meses:n}))}>{n}m</button>
                ))}
                <input type="number" className="inp" style={{width:80}} min="1" max="24"
                  value={recorrModal.meses}
                  onChange={e=>setRecorrModal(x=>({...x,meses:parseInt(e.target.value)||1}))}/>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-primary" onClick={()=>aplicarRecorrencia(recorrModal.item,recorrModal.meses)}>✓ Criar recorrência</button>
              <button className="btn btn-ghost" onClick={()=>setRecorrModal(null)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {doFiltro.length===0&&!form&&(
        <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
          <div style={{fontSize:28,marginBottom:10}}>$</div>
          <div style={{fontSize:13,color:"#8b949e",marginBottom:6}}>Nenhum custo fixo no ciclo {cicloSel.label}</div>
          <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={()=>setForm(emptyForm())}>+ Adicionar custo fixo</button>
        </div>
      )}

      {doFiltro.length>0&&(
        <div className="card" style={{padding:"14px 18px"}}>
          <table className="table">
            <thead>
              <tr>
                <th>CATEGORIA</th>
                <th>DESCRIÇÃO</th>
                <th style={{textAlign:"right",color:"#388bfd"}}>PLANEJADO</th>
                <th style={{textAlign:"right",color:"#3fb950"}}>REALIZADO</th>
                <th style={{textAlign:"right"}}>VARIAÇÃO</th>
                <th style={{textAlign:"center"}}>AÇÕES</th>
              </tr>
            </thead>
            <tbody>
              {doFiltro.sort((a,b)=>a.cat.localeCompare(b.cat)).map(c=>{
                const plan = parseFloat(c.valor||0);
                const real = valorEfetivo(c);
                const temReal = !!c.valorRealizado;
                const var_ = real - plan;
                const isConfirmando = confirmReal?.id===c.id;
                return(
                  <tr key={c.id}>
                    <td>{catBadge(c.cat)}</td>
                    <td style={{color:"#c9d1d9"}}>{c.descricao}</td>
                    <td className="mono" style={{textAlign:"right",color:"#388bfd"}}>R$ {fmt(plan)}</td>
                    <td style={{textAlign:"right"}}>
                      {isConfirmando?(
                        <div style={{display:"flex",gap:6,alignItems:"center",justifyContent:"flex-end"}}>
                          <input type="number" className="inp" style={{width:120,borderColor:"#3fb95077",textAlign:"right"}}
                            defaultValue={confirmReal.valor}
                            onChange={e=>setConfirmReal(x=>({...x,valor:e.target.value}))}
                            autoFocus
                            onKeyDown={e=>{ if(e.key==="Enter") confirmarReal(c.id,confirmReal.valor); if(e.key==="Escape") setConfirmReal(null); }}
                          />
                          <button className="btn btn-success btn-xs" onClick={()=>confirmarReal(c.id,confirmReal.valor)}>✓</button>
                          <button className="btn btn-ghost btn-xs" onClick={()=>setConfirmReal(null)}>✕</button>
                        </div>
                      ):(
                        temReal
                          ? <div style={{display:"flex",gap:6,alignItems:"center",justifyContent:"flex-end"}}>
                              <span className="mono" style={{color:"#3fb950",fontWeight:600}}>R$ {fmt(real)}</span>
                              <button className="btn btn-ghost btn-xs" onClick={()=>setConfirmReal({id:c.id,valor:String(real)})}>✎</button>
                            </div>
                          : <button className="btn btn-sm" style={{background:"#3fb95022",color:"#3fb950",border:"1px solid #3fb95044",fontSize:11}}
                              onClick={()=>setConfirmReal({id:c.id,valor:String(plan)})}>✓ Confirmar</button>
                      )}
                    </td>
                    <td className="mono" style={{textAlign:"right"}}>
                      {temReal&&var_!==0
                        ? <span className={`badge ${var_>0?"br":"bgn"}`}>{var_>0?"+":""}{fmt(var_)}</span>
                        : <span style={{color:"#30363d",fontSize:11}}>—</span>
                      }
                    </td>
                    <td style={{width:120,textAlign:"center"}}>
                      {confirmDel===c.id?(
                        <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                          <button className="btn btn-danger btn-xs" onClick={()=>del(c.id)}>✓</button>
                          <button className="btn btn-ghost btn-xs" onClick={()=>setConfirmDel(null)}>✕</button>
                        </div>
                      ):(
                        <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                          <button className="btn btn-ghost btn-xs" onClick={()=>setForm({...c})}>✎</button>
                          <button className="btn btn-ghost btn-xs" style={{color:"#d29922"}} title="Recorrência"
                            onClick={()=>setRecorrModal({item:c,meses:3})}>↻</button>
                          <button className="btn btn-danger btn-xs" onClick={()=>setConfirmDel(c.id)}>✕</button>
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
              <tr>
                <td colSpan={2} style={{fontWeight:600,color:"#8b949e",fontSize:11,textTransform:"uppercase"}}>Total</td>
                <td className="mono" style={{textAlign:"right",color:"#388bfd",fontWeight:600}}>R$ {fmt(totalCicloPlano)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,color:"#3fb950",fontSize:14}}>R$ {fmt(totalCicloRealizado)}</td>
                <td colSpan={2}/>
              </tr>
            </tbody>
          </table>
          <div style={{fontSize:11,color:"#484f58",marginTop:8}}>
            💡 Clique em <strong style={{color:"#3fb950"}}>✓ Confirmar</strong> na linha para registrar o realizado. Use <strong style={{color:"#d29922"}}>↻</strong> para criar recorrência.
          </div>
        </div>
      )}
    </div>
  );
}


// ── Custos Pontuais (não-recorrentes, opcionalmente vinculados a cliente) ──
function CustosPontuais({custosPontuais,setCustosPontuais,clientes,cliAtivo}){
  const [form, setForm] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [filtroMes, setFiltroMes] = useState("");
  const [filtroStatus, setFiltroStatus] = useState("");
  const [confirmReal, setConfirmReal] = useState(null);

  const custosFilt = useMemo(()=>{
    let list = cliAtivo ? custosPontuais.filter(c=>!c.cliId||c.cliId===cliAtivo) : custosPontuais;
    if(filtroMes) list = list.filter(c=>(c.data||"").slice(0,7)===filtroMes);
    if(filtroStatus) list = list.filter(c=>(c.status||"realizado")===filtroStatus);
    return list.sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  },[custosPontuais,cliAtivo,filtroMes,filtroStatus]);

  const totalPlan = useMemo(()=>custosFilt.filter(c=>(c.status||"realizado")==="planejado").reduce((s,c)=>s+parseFloat(c.valor||0),0),[custosFilt]);
  const totalReal = useMemo(()=>custosFilt.filter(c=>(c.status||"realizado")==="realizado").reduce((s,c)=>s+parseFloat(c.valor||0),0),[custosFilt]);

  const meses = useMemo(()=>{
    const s=new Set(custosPontuais.map(c=>(c.data||"").slice(0,7)).filter(Boolean));
    return [...s].sort().reverse();
  },[custosPontuais]);

  const emptyForm=()=>({
    cat: CATS_CUSTO[0], descricao: "", valor: "",
    data: hoje(), cliId: cliAtivo||"", obs: "", status: "planejado",
  });

  const salvar=()=>{
    if(!form.descricao||!form.valor) return;
    if(form.id){ setCustosPontuais(a=>a.map(x=>x.id===form.id?{...form}:x)); }
    else        { setCustosPontuais(a=>[{...form,id:uid()},...a]); }
    setForm(null);
  };
  const del=id=>{setCustosPontuais(a=>a.filter(x=>x.id!==id));setConfirmDel(null);};
  const confirmarRealizado=(id)=>{
    setCustosPontuais(a=>a.map(x=>x.id===id?{...x,status:"realizado"}:x));
    setConfirmReal(null);
  };

  return(
    <div style={{display:"grid",gap:16}}>
      <div className="card ca-teal" style={{padding:"14px 18px"}}>
        <div className="sl" style={{marginBottom:6}}>CUSTOS PONTUAIS — PLANEJADO & REALIZADO</div>
        <div style={{fontSize:12,color:"#8b949e",lineHeight:1.8}}>
          Planeje despesas <strong style={{color:"#388bfd"}}>futuras</strong> e confirme-as no mês de medição.
          Somente os <strong style={{color:"#3fb950"}}>Realizados</strong> entram no resultado efetivo.
        </div>
      </div>

      {(totalPlan>0||totalReal>0)&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="card" style={{padding:"14px 18px",borderTop:"2px solid #388bfd"}}>
            <div style={{fontSize:10,color:"#388bfd",marginBottom:4}}>PLANEJADO</div>
            <div className="mono" style={{fontSize:18,fontWeight:700,color:"#388bfd"}}>R$ {fmt(totalPlan)}</div>
          </div>
          <div className="card" style={{padding:"14px 18px",borderTop:"2px solid #3fb950"}}>
            <div style={{fontSize:10,color:"#3fb950",marginBottom:4}}>REALIZADO</div>
            <div className="mono" style={{fontSize:18,fontWeight:700,color:"#3fb950"}}>R$ {fmt(totalReal)}</div>
          </div>
        </div>
      )}

      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:160}}>
          <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>FILTRAR POR MÊS</div>
          <select className="inp" value={filtroMes} onChange={e=>setFiltroMes(e.target.value)}>
            <option value="">Todos os períodos</option>
            {meses.map(m=><option key={m} value={m}>{fmtMes(m)}</option>)}
          </select>
        </div>
        <div style={{minWidth:160}}>
          <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>STATUS</div>
          <select className="inp" value={filtroStatus} onChange={e=>setFiltroStatus(e.target.value)}>
            <option value="">Todos</option>
            <option value="planejado">Planejado</option>
            <option value="realizado">Realizado</option>
          </select>
        </div>
        <div style={{marginTop:14}}>
          <button className="btn btn-primary" onClick={()=>setForm(emptyForm())}>+ Novo custo pontual</button>
        </div>
      </div>

      {form&&(
        <div className="card ca-teal" style={{padding:"16px 18px"}}>
          <div className="sl" style={{marginBottom:12}}>{form.id?"EDITAR":"NOVO"} CUSTO PONTUAL</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10}}>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>CATEGORIA</div>
              <select className="inp" value={form.cat} onChange={e=>setForm(x=>({...x,cat:e.target.value}))}>
                {CATS_CUSTO.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div style={{gridColumn:"2/4"}}>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>DESCRIÇÃO *</div>
              <input className="inp" placeholder="Ex: Compra de equipamento" value={form.descricao} onChange={e=>setForm(x=>({...x,descricao:e.target.value}))}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>VALOR (R$) *</div>
              <input type="number" className="inp" placeholder="0,00" min="0" step="0.01" value={form.valor} onChange={e=>setForm(x=>({...x,valor:e.target.value}))}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>DATA *</div>
              <input type="date" className="inp" value={form.data} onChange={e=>setForm(x=>({...x,data:e.target.value}))}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>STATUS</div>
              <select className="inp" value={form.status||"planejado"} onChange={e=>setForm(x=>({...x,status:e.target.value}))}>
                <option value="planejado">Planejado</option>
                <option value="realizado">Realizado</option>
              </select>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>CLIENTE (opcional)</div>
              <select className="inp" value={form.cliId||""} onChange={e=>setForm(x=>({...x,cliId:e.target.value}))}>
                <option value="">— Sem vínculo —</option>
                {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </div>
            <div style={{gridColumn:"3/5"}}>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>OBSERVAÇÃO</div>
              <input className="inp" placeholder="Detalhe adicional (opcional)" value={form.obs||""} onChange={e=>setForm(x=>({...x,obs:e.target.value}))}/>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button className="btn btn-success" onClick={salvar} disabled={!form.descricao||!form.valor}>✓ Salvar</button>
            <button className="btn btn-ghost" onClick={()=>setForm(null)}>Cancelar</button>
          </div>
        </div>
      )}

      {custosFilt.length===0&&!form?(
        <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
          <div style={{fontSize:28,marginBottom:10}}>◎</div>
          <div style={{fontSize:13,color:"#8b949e",marginBottom:6}}>Nenhum custo pontual cadastrado</div>
          <button className="btn btn-primary btn-sm" onClick={()=>setForm(emptyForm())}>+ Adicionar custo pontual</button>
        </div>
      ):(
        custosFilt.length>0&&(
          <div className="card" style={{padding:"14px 18px"}}>
            <table className="table">
              <thead>
                <tr>
                  <th>STATUS</th>
                  <th>DATA</th>
                  <th>CATEGORIA</th>
                  <th>DESCRIÇÃO</th>
                  <th>CLIENTE</th>
                  <th style={{textAlign:"right"}}>VALOR</th>
                  <th/>
                </tr>
              </thead>
              <tbody>
                {custosFilt.map(c=>{
                  const cli=clientes.find(x=>x.id===c.cliId);
                  const isPlan=(c.status||"realizado")==="planejado";
                  return(
                    <tr key={c.id}>
                      <td>
                        {isPlan?(
                          <div style={{display:"flex",gap:4,alignItems:"center"}}>
                            <span className="badge" style={{background:"#388bfd22",color:"#388bfd",border:"1px solid #388bfd44",fontSize:10}}>Planejado</span>
                            {confirmReal===c.id?(
                              <div style={{display:"flex",gap:4}}>
                                <button className="btn btn-success btn-xs" onClick={()=>confirmarRealizado(c.id)}>✓</button>
                                <button className="btn btn-ghost btn-xs" onClick={()=>setConfirmReal(null)}>✕</button>
                              </div>
                            ):(
                              <button className="btn btn-xs" style={{background:"#3fb95022",color:"#3fb950",border:"1px solid #3fb95044",fontSize:10}}
                                onClick={()=>setConfirmReal(c.id)}>Confirmar</button>
                            )}
                          </div>
                        ):(
                          <span className="badge bgn" style={{fontSize:10}}>Realizado</span>
                        )}
                      </td>
                      <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{c.data||"—"}</td>
                      <td>{catBadge(c.cat)}</td>
                      <td style={{color:"#c9d1d9"}}>{c.descricao}</td>
                      <td>{cli?<span className="badge bb">{cli.nome}</span>:<span style={{color:"#30363d",fontSize:11}}>—</span>}</td>
                      <td className="mono" style={{textAlign:"right",color:isPlan?"#388bfd":"#f85149",fontWeight:600}}>R$ {fmt(c.valor)}</td>
                      <td style={{width:80}}>
                        {confirmDel===c.id?(
                          <div style={{display:"flex",gap:4}}>
                            <button className="btn btn-danger btn-xs" onClick={()=>del(c.id)}>✓</button>
                            <button className="btn btn-ghost btn-xs" onClick={()=>setConfirmDel(null)}>✕</button>
                          </div>
                        ):(
                          <div style={{display:"flex",gap:4}}>
                            <button className="btn btn-ghost btn-xs" onClick={()=>setForm({...c})}>✎</button>
                            <button className="btn btn-danger btn-xs" onClick={()=>setConfirmDel(c.id)}>✕</button>
                          </div>
                        )}
                      </td>
                    </tr>
                  );
                })}
                <tr>
                  <td colSpan={5} style={{fontWeight:600,color:"#8b949e",fontSize:11,textTransform:"uppercase"}}>Total</td>
                  <td style={{textAlign:"right",padding:"8px 12px"}}>
                    <div className="mono" style={{color:"#388bfd",fontSize:11}}>Plan: R$ {fmt(totalPlan)}</div>
                    <div className="mono" style={{color:"#3fb950",fontWeight:700}}>Real: R$ {fmt(totalReal)}</div>
                  </td>
                  <td/>
                </tr>
              </tbody>
            </table>
          </div>
        )
      )}
    </div>
  );
}


// ── Custos por Área ──────────────────────────────────────────────────────
function CustosPorArea({custosArea,setCustosArea,areas,clientes,cliAtivo,custosVarConfig,realizado,svcMap}){
  const areasFilt = useMemo(()=>cliAtivo?areas.filter(a=>a.cliId===cliAtivo):areas,[areas,cliAtivo]);
  const [areaId,setAreaId] = useState("_todas_");
  const [form,setForm]     = useState(null);
  const [confirmDel,setConfirmDel] = useState(null);

  const verTodas  = areaId === "_todas_";
  const areaAtual = useMemo(()=>areasFilt.find(a=>a.id===areaId)||null,[areasFilt,areaId]);

  // Custos manuais filtrados
  const custosFilt = useMemo(()=>{
    if(verTodas) return custosArea.filter(c=>c.areaId&&areasFilt.some(a=>a.id===c.areaId));
    return areaAtual?custosArea.filter(c=>c.areaId===areaAtual.id):[];
  },[custosArea,areasFilt,areaAtual,verTodas]);

  const totalManual = useMemo(()=>custosFilt.reduce((s,c)=>s+parseFloat(c.valor||0),0),[custosFilt]);

  // Custos variáveis calculados para a área (ou todas)
  const custosVar = useMemo(()=>{
    if(!Array.isArray(custosVarConfig)||!custosVarConfig.length) return [];
    const regrasAtivas = custosVarConfig.filter(r=>r.ativo===true||r.ativo===1||r.ativo==="true");
    if(!regrasAtivas.length) return [];
    const result=[];
    (realizado||[]).forEach(lanc=>{
      const area = areas.find(a=>a.id===lanc.areaId||(a.nome||"").toUpperCase()===(lanc.area||"").toUpperCase());
      if(!area) return;
      if(!verTodas && area.id!==areaAtual?.id) return;
      if(!areasFilt.some(a=>a.id===area.id)) return;
      regrasAtivas.filter(r=>String(r.sid)===String(lanc.sid)).forEach(regra=>{
        const valor=parseFloat(lanc.qtd||0)*parseFloat(regra.valorPorUnidade||regra.valor_por_unidade||0);
        if(valor>0) result.push({
          _id:`${lanc.id}_${regra.id}`,
          areaId:area.id, areaNome:area.nome,
          data:lanc.data, cat:regra.categoria||"Insumos de Sondagem",
          descricao:`${regra.nome} — ${lanc.area||area.nome}`, valor,
        });
      });
    });
    return result.sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  },[custosVarConfig,realizado,areas,areasFilt,areaAtual,verTodas]);

  const totalVar   = useMemo(()=>custosVar.reduce((s,c)=>s+c.valor,0),[custosVar]);
  const totalGeral = totalManual+totalVar;

  // Totais por área para a view consolidada
  const totaisPorArea = useMemo(()=>{
    const m={};
    areasFilt.forEach(a=>{
      const man=custosArea.filter(c=>c.areaId===a.id).reduce((s,c)=>s+parseFloat(c.valor||0),0);
      const vari=custosVar.filter(c=>c.areaId===a.id).reduce((s,c)=>s+c.valor,0);
      m[a.id]={man,vari,total:man+vari};
    });
    return m;
  },[custosArea,custosVar,areasFilt]);

  const custosOrfaos = useMemo(()=>custosArea.filter(c=>!c.areaId),[custosArea]);
  const totalOrfaos  = useMemo(()=>custosOrfaos.reduce((s,c)=>s+parseFloat(c.valor||0),0),[custosOrfaos]);

  const emptyForm=()=>({cat:CATS_CUSTO[0],descricao:"",valor:"",data:hoje(),areaId:areaAtual?.id||""});
  const salvar=()=>{
    if(!form.descricao||!form.valor||!areaAtual) return;
    const item={...form,areaId:areaAtual.id};
    if(form.id) setCustosArea(a=>a.map(x=>x.id===form.id?item:x));
    else         setCustosArea(a=>[{...item,id:uid()},...a]);
    setForm(null);
  };
  const del=id=>{setCustosArea(a=>a.filter(x=>x.id!==id));setConfirmDel(null);};

  return(
    <div style={{display:"grid",gap:16}}>
      {/* Seletor */}
      <div style={{display:"flex",alignItems:"flex-end",gap:12,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200}}>
          <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>ÁREA</div>
          <select className="inp" value={areaId} onChange={e=>{setAreaId(e.target.value);setForm(null);}}>
            <option value="_todas_">⊞ Todas as áreas</option>
            {areasFilt.length===0&&<option disabled>— Nenhuma área cadastrada —</option>}
            {areasFilt.map(a=>{
              const cli=clientes.find(c=>c.id===a.cliId);
              return <option key={a.id} value={a.id}>{a.nome}{cli?` (${cli.nome})`:""}</option>;
            })}
          </select>
        </div>
        {!verTodas&&areaAtual&&(
          <button className="btn btn-primary" onClick={()=>setForm(emptyForm())}>+ Novo custo</button>
        )}
        {totalGeral>0&&(
          <div style={{marginLeft:"auto",textAlign:"right"}}>
            <div style={{fontSize:10,color:"#484f58"}}>{verTodas?"TOTAL GERAL":"TOTAL DA ÁREA"}</div>
            <div className="mono" style={{fontSize:20,fontWeight:600,color:"#f85149"}}>R$ {fmt(totalGeral)}</div>
            {totalVar>0&&<div style={{fontSize:11,color:"#8957e5"}}>R$ {fmt(totalVar)} variáveis</div>}
          </div>
        )}
      </div>

      {areasFilt.length===0&&(
        <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
          <div style={{fontSize:13,color:"#8b949e"}}>Nenhuma área cadastrada. Crie áreas na aba <span style={{color:"#388bfd"}}>Áreas</span> primeiro.</div>
        </div>
      )}

      {/* VIEW CONSOLIDADA */}
      {verTodas&&areasFilt.length>0&&(
        <div style={{display:"grid",gap:12}}>
          {areasFilt.map(a=>{
            const t=totaisPorArea[a.id]||{man:0,vari:0,total:0};
            if(t.total===0) return null;
            const cli=clientes.find(c=>c.id===a.cliId);
            const custosM=custosArea.filter(c=>c.areaId===a.id).sort((x,y)=>(x.data||"").localeCompare(y.data||""));
            const custosV=custosVar.filter(c=>c.areaId===a.id);
            return(
              <div key={a.id} className="card" style={{padding:"14px 18px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontWeight:600,color:"#c9d1d9"}}>{a.nome}</span>
                    {cli&&<span className="badge bb">{cli.nome}</span>}
                    <button className="btn btn-ghost btn-xs" onClick={()=>setAreaId(a.id)}>Editar</button>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div className="mono" style={{color:"#f85149",fontWeight:700}}>R$ {fmt(t.total)}</div>
                    {t.vari>0&&<div style={{fontSize:11,color:"#8957e5"}}>R$ {fmt(t.vari)} variáveis</div>}
                  </div>
                </div>
                {custosV.length>0&&(
                  <table className="table" style={{marginBottom:8}}>
                    <thead><tr><th>DATA</th><th>CATEGORIA</th><th>DESCRIÇÃO</th><th style={{textAlign:"right",color:"#8957e5"}}>VARIÁVEL</th></tr></thead>
                    <tbody>
                      {custosV.map(c=>(
                        <tr key={c._id}>
                          <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{c.data||"—"}</td>
                          <td><span className="badge bp">{c.cat}</span></td>
                          <td style={{color:"#c9d1d9",fontSize:12}}>{c.descricao}</td>
                          <td className="mono" style={{textAlign:"right",color:"#8957e5",fontWeight:600}}>R$ {fmt(c.valor)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
                {custosM.length>0&&(
                  <table className="table">
                    <thead><tr><th>DATA</th><th>CATEGORIA</th><th>DESCRIÇÃO</th><th style={{textAlign:"right"}}>MANUAL</th></tr></thead>
                    <tbody>
                      {custosM.map(c=>(
                        <tr key={c.id}>
                          <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{c.data||"—"}</td>
                          <td>{catBadge(c.cat)}</td>
                          <td style={{color:"#c9d1d9",fontSize:12}}>{c.descricao}</td>
                          <td className="mono" style={{textAlign:"right",color:"#f85149",fontWeight:600}}>R$ {fmt(c.valor)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            );
          })}
          {areasFilt.every(a=>!(totaisPorArea[a.id]?.total>0))&&(
            <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>

            </div>
          )}

      )}

      {/* FORMULÁRIO área individual */}
      {!verTodas&&form&&areaAtual&&(
        <div className="card ca-red" style={{padding:"16px 18px"}}>
          <div className="sl" style={{marginBottom:12}}>{form.id?"EDITAR":"NOVO"} CUSTO — {areaAtual.nome}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr auto",gap:10,alignItems:"end"}}>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>CATEGORIA</div>
              <select className="inp" value={form.cat} onChange={e=>setForm(x=>({...x,cat:e.target.value}))}>
                {CATS_CUSTO.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>DESCRIÇÃO *</div>
              <input className="inp" placeholder="Ex: Frete equipamento" value={form.descricao} onChange={e=>setForm(x=>({...x,descricao:e.target.value}))}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>VALOR (R$) *</div>
              <input type="number" className="inp" placeholder="0,00" min="0" step="0.01" value={form.valor} onChange={e=>setForm(x=>({...x,valor:e.target.value}))}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>DATA</div>
              <input type="date" className="inp" value={form.data} onChange={e=>setForm(x=>({...x,data:e.target.value}))}/>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button className="btn btn-success btn-sm" onClick={salvar} disabled={!form.descricao||!form.valor}>✓</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setForm(null)}>✕</button>
            </div>
          </div>
        </div>
      )}

      {/* ÁREA INDIVIDUAL — variáveis */}
      {!verTodas&&custosVar.length>0&&(
        <div className="card" style={{padding:"14px 18px",borderTop:"2px solid #8957e5"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div className="sl" style={{color:"#8957e5"}}>CUSTOS VARIÁVEIS — calculados pelas regras</div>
            <div className="mono" style={{color:"#8957e5",fontWeight:700}}>R$ {fmt(totalVar)}</div>
          </div>
          <table className="table">
            <thead><tr><th>DATA</th><th>CATEGORIA</th><th>DESCRIÇÃO</th><th style={{textAlign:"right"}}>VALOR</th></tr></thead>
            <tbody>
              {custosVar.map(c=>(
                <tr key={c._id}>
                  <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{c.data||"—"}</td>
                  <td><span className="badge bp">{c.cat}</span></td>
                  <td style={{color:"#c9d1d9",fontSize:12}}>{c.descricao}</td>
                  <td className="mono" style={{textAlign:"right",color:"#8957e5",fontWeight:600}}>R$ {fmt(c.valor)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* ÁREA INDIVIDUAL — manuais */}
      {!verTodas&&areaAtual&&custosFilt.length===0&&custosVar.length===0&&!form&&(
        <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
          <div style={{fontSize:13,color:"#8b949e",marginBottom:8}}>Nenhum custo para <strong style={{color:"#c9d1d9"}}>{areaAtual.nome}</strong></div>
          <button className="btn btn-primary btn-sm" onClick={()=>setForm(emptyForm())}>+ Adicionar custo</button>
        </div>
      )}

      {!verTodas&&custosFilt.length>0&&(
        <div className="card" style={{padding:"14px 18px"}}>
          <div className="sl" style={{marginBottom:10}}>CUSTOS MANUAIS</div>
          <table className="table">
            <thead><tr><th>DATA</th><th>CATEGORIA</th><th>DESCRIÇÃO</th><th style={{textAlign:"right"}}>VALOR</th><th/></tr></thead>
            <tbody>
              {custosFilt.sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(c=>(
                <tr key={c.id}>
                  <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{c.data||"—"}</td>
                  <td>{catBadge(c.cat)}</td>
                  <td style={{color:"#c9d1d9"}}>{c.descricao}</td>
                  <td className="mono" style={{textAlign:"right",color:"#f85149",fontWeight:600}}>R$ {fmt(c.valor)}</td>
                  <td style={{width:80}}>
                    {confirmDel===c.id
                      ?<div style={{display:"flex",gap:4}}><button className="btn btn-danger btn-xs" onClick={()=>del(c.id)}>✓</button><button className="btn btn-ghost btn-xs" onClick={()=>setConfirmDel(null)}>✕</button></div>
                      :<div style={{display:"flex",gap:4}}><button className="btn btn-ghost btn-xs" onClick={()=>setForm({...c})}>✎</button><button className="btn btn-danger btn-xs" onClick={()=>setConfirmDel(c.id)}>✕</button></div>
                    }
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* Sem área vinculada */}
      {custosOrfaos.length>0&&(
        <div className="card ca-orange" style={{padding:"14px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
