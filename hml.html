//  IMPORTAR
// ═══════════════════════════════════════════════════════════════════════════
function Importar({setPlanejado,setAreas,areas,servicos,clientes,cliAtivo}){
  // ─── Estado ────────────────────────────────────────────────────────────
  const [modo,      setModo]      = useState("plan");   // "plan" | "csv"
  const [drag,      setDrag]      = useState(false);
  const [loading,   setLoading]   = useState(false);
  const [erro,      setErro]      = useState("");
  const [ok,        setOk]        = useState("");
  const [planData,  setPlanData]  = useState(null);  // dados extraídos do plano
  const [preview,   setPreview]   = useState([]);    // preview CSV
  const refPlan = useRef();
  const refCSV  = useRef();
  const svcMap  = Object.fromEntries(servicos.map(s=>[s.id,s]));

  // IDs fixos dos serviços obrigatórios
  const SVC = {
    mobBH:    servicos.find(s=>s.nome.includes("Inv. Confirmatória BH") || s.nome.includes("Confirmatória BH"))?.id || "V02",
    mobPerf:  servicos.find(s=>s.nome.includes("Perfuratriz"))?.id || "V05",
    gestLab:  servicos.find(s=>s.nome.includes("Laboratório") || s.nome.includes("Frascaria"))?.id || "V38",
    relFinal: servicos.find(s=>s.nome.includes("Investigação Confirmatória") && s.nome.includes("Relatório"))?.id
              || servicos.find(s=>s.nome.includes("Relatório"))?.id || "V07",
    dp:       "V13",  // Direct Push
    rot6:     "V11",  // Rotativa 6"
    amoSolo:  "V14",  // Amostragem Solo
    amoAgua:  "V18",  // Amostragem Água
  };

  useEffect(()=>{
    // Carrega mammoth para leitura de DOCX
    if(!window.mammoth){
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
      document.head.appendChild(s);
    }
    // Carrega pdf.js para leitura de PDF
    if(!window.pdfjsLib){
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload=()=>{ if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; };
      document.head.appendChild(s);
    }
    // Carrega XLSX para CSV/Excel
    if(!window.XLSX){
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      document.head.appendChild(s);
    }
  },[]);

  // ─── Extrai texto bruto de um DOCX (mammoth) ──────────────────────────
  const extrairTextoDocx = async (buf) => {
    if(!window.mammoth) throw new Error("Aguarde 2s e tente novamente (carregando leitor DOCX).");
    const result = await window.mammoth.extractRawText({arrayBuffer: buf});
    return result.value;
  };

  // ─── Extrai texto bruto de um PDF (pdf.js) ────────────────────────────
  // Importante: NÃO forçamos espaço entre todo item de texto (isso quebrava
  // códigos como "SD-01" em "SD -01", pois o PDF às vezes desenha o hífen
  // como um glifo separado). Usamos o flag hasEOL do pdf.js para quebrar
  // linha apenas quando o próprio PDF indica fim de linha.
  const extrairTextoPdf = async (buf) => {
    if(!window.pdfjsLib) throw new Error("Aguarde 2s e tente novamente (carregando leitor PDF).");
    const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
    let txt = "";
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      let linha = "";
      content.items.forEach(it=>{
        linha += it.str;
        if(it.hasEOL){ txt += linha + "\n"; linha = ""; }
      });
      if(linha) txt += linha + "\n";
      txt += "\n"; // separador entre páginas
    }
    return txt;
  };

  // ─── Parser do Plano de Investigação (DOCX ou PDF) ─────────────────────
  const parsePlanDocx = async (file) => {
    setLoading(true); setErro(""); setPlanData(null); setOk("");
    try {
      const ext = (file.name.split(".").pop()||"").toLowerCase();
      if(ext!=="docx" && ext!=="pdf") throw new Error("Use um arquivo .docx ou .pdf");
      const buf = await file.arrayBuffer();
      const txt = ext==="pdf" ? await extrairTextoPdf(buf) : await extrairTextoDocx(buf);

      // ── Extrai nome da área ────────────────────────────────────────────
      // Prioriza códigos de área conhecidos (RP-xx, AS-xx, AC-xx, DIR-xx, ETAF-xx),
      // que são o sinal mais confiável. O padrão genérico "Investigação Ambiental
      // <palavra>" fica como fallback, pois em PDFs com cabeçalho em colunas
      // (ex.: "Investigação Ambiental" numa coluna e "Folha"/"Revisão" na coluna
      // ao lado) o texto extraído às vezes intercala essas células e a palavra
      // capturada acaba sendo do cabeçalho da tabela, não o código da área.
      const PALAVRAS_IGNORAR_AREA = /^(FOLHA|P[ÁA]GINA|REVIS[ÃA]O|VERS[ÃA]O|DATA|DOCUMENTO|N[ºO°]?|CONTRATO)$/i;
      const codigoMatch = txt.match(/\b(RP[-\s]?\d+|AS[-\s]?\d+|AC[-\s]?\d+|DIR[-\s]?\w+|ETAF[-\s]?\w*)\b/i);
      let nomeArea = codigoMatch ? codigoMatch[1].replace(/\s+/g,"-").toUpperCase() : null;
      if(!nomeArea){
        const areaMatch = txt.match(/(?:Investigação Ambiental|INVESTIGAÇÃO AMBIENTAL|área\s+(?:suspeita|de\s+investigação)?)\s*([\w-]+)/i);
        const candidato = (areaMatch?.[1]||"").trim();
        if(candidato && !PALAVRAS_IGNORAR_AREA.test(candidato)) nomeArea = candidato.toUpperCase();
      }
      if(!nomeArea) nomeArea = file.name.replace(/\.(docx|pdf)$/i,"").trim().toUpperCase();

      // ── Extrai pontos de sondagem ──────────────────────────────────────
      // Tolerante a espaços espúrios ao redor do hífen (comum em PDFs, onde o
      // hífen às vezes é extraído como um glifo separado — ex.: "SD - 01").
      const pontosRaw = [...txt.matchAll(/\b(S[DPT]\s*-?\s*\d+|SB\s*-?\s*\d+|P[TMG]\s*-?\s*\d+)\b/gi)]
        .map(m=>m[1].replace(/\s+/g,"").toUpperCase());
      const pontosNomes = [...new Set(pontosRaw)];

      // ── Cada ponto vira um item individual, com solo e água marcados por
      // padrão (o usuário confirma/ajusta antes de criar a área) ──────────
      const pontosDetalhe = pontosNomes.map(nome=>({nome, solo:true, soloQtd:1, agua:true, aguaQtd:1}));

      // ── Helper: DD/MM/AAAA → YYYY-MM-DD ───────────────────────────────
      const parseBR = str => {
        if(!str) return null;
        const m = str.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        return m ? `${m[3]}-${m[2]}-${m[1]}` : null;
      };

      // ── Extrai datas do cronograma por palavra-chave ───────────────────
      // Cada linha do cronograma tem: "Atividade | DD/MM/AAAA | DD/MM/AAAA"
      // Captura início e término de cada item.
      const cronLinha = (chave) => {
        const re = new RegExp(
          chave + '[^\n]{0,150}?(\d{2}\/\d{2}\/\d{4})[^\n]{0,80}?(\d{2}\/\d{2}\/\d{4})?',
          'i'
        );
        const m = txt.match(re);
        return { inicio: parseBR(m?.[1]), termino: parseBR(m?.[2]) };
      };

      // Itens do cronograma relevantes
      const cronPlan      = cronLinha('Planejamento\s+das\s+atividades?');
      const cronFrascaria = cronLinha('Prepara[çc][aã]o\s+das?\s+Frascarias?');
      const cronSondagem  = cronLinha('Execu[çc][aã]o\s+das?\s+Sondagens?');
      const cronAnalise   = cronLinha('An[aá]lises?\s+[Qq]u[ií]micas?');
      const cronRelatorio = cronLinha('Elabora[çc][aã]o\s+do\s+Relat[oó]rio');

      // Mapeamento para cada serviço:
      // dataInicio   → Mobilização (início do planejamento)
      // dataSondagem → Direct Push + Rotativa 6" (execução das sondagens)
      // dataLab      → Gestão de Laboratório (preparação das frascarias)
      // dataRelatorio→ Relatório Final (elaboração do relatório)
      const dataInicio    = cronPlan.inicio     || cronSondagem.inicio || hoje();
      const dataSondagem  = cronSondagem.inicio || cronPlan.inicio     || hoje();
      const dataLab       = cronFrascaria.inicio || dataInicio;
      const dataRelatorio = cronRelatorio.inicio || null;

      const desc = txt.substring(0,500).replace(/\s+/g," ").trim();

      setPlanData({
        nomeArea, pontosDetalhe,
        dataInicio, dataSondagem, dataLab, dataRelatorio,
        // Guardamos os detalhes do cronograma para exibição
        cronograma: {
          planejamento: cronPlan,
          frascaria:    cronFrascaria,
          sondagem:     cronSondagem,
          analise:      cronAnalise,
          relatorio:    cronRelatorio,
        },
        descricao: desc,
        cliId: cliAtivo||"",
      });
    } catch(e) {
      setErro("Erro ao ler documento: " + e.message);
    } finally {
      setLoading(false);
    }
  };

  // ─── Gera área a partir dos dados extraídos ────────────────────────────
  const gerarDoPlan = () => {
    if(!planData) return;
    const { nomeArea, pontosDetalhe, dataInicio, dataSondagem, dataLab, descricao, cliId, dataRelatorio } = planData;

    const itens = [];

    // Linhas fixas — cada uma com sua data correta do cronograma
    itens.push({ sid: SVC.mobBH,    qtd: 1, data: dataInicio,              obs: "Mobilização Inv. Confirmatória" });
    itens.push({ sid: SVC.mobPerf,  qtd: 1, data: dataSondagem||dataInicio, obs: "Mobilização Perfuratriz" });
    itens.push({ sid: SVC.gestLab,  qtd: 1, data: dataLab||dataInicio,      obs: "Gestão de Laboratório + Frascaria" });
    itens.push({ sid: SVC.relFinal, qtd: 1, data: dataRelatorio||dataInicio, obs: "Relatório Final de Investigação" });

    // Cada ponto é lançado individualmente: Direct Push + Rotativa sempre,
    // e amostra de Solo / Água conforme marcado pelo usuário para aquele ponto.
    (pontosDetalhe||[]).forEach(pt => {
      itens.push({ sid: SVC.dp,   qtd: 1, data: dataSondagem||dataInicio, obs: `Direct Push — ${pt.nome}` });
      itens.push({ sid: SVC.rot6, qtd: 1, data: dataSondagem||dataInicio, obs: `Rotativa 6" — ${pt.nome}` });
      if(pt.solo && parseFloat(pt.soloQtd||0)>0){
        itens.push({ sid: SVC.amoSolo, qtd: parseFloat(pt.soloQtd)||1, data: dataSondagem||dataInicio, obs: `Amostragem de Solo — ${pt.nome}` });
      }
      if(pt.agua && parseFloat(pt.aguaQtd||0)>0){
        itens.push({ sid: SVC.amoAgua, qtd: parseFloat(pt.aguaQtd)||1, data: dataSondagem||dataInicio, obs: `Amostragem de Água — ${pt.nome}` });
      }
    });

    // Cria nova área — planejado é gerado pela aba Áreas
    const novaArea = {
      id:        uid(),
      nome:      nomeArea,
      descricao: descricao.substring(0, 120) + "…",
      cliId:     cliId || "",
      itens:     itens,
    };

    setAreas(a => [novaArea, ...a]);
    setOk(`✓ Área "${nomeArea}" criada com ${itens.length} serviços. Acesse a aba Áreas para gerar o planejado.`);
    setPlanData(null);
  };


  // ─── Parser CSV/Excel ─────────────────────────────────────────────────
  const processCSV = text => {
    try{
      const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!l.startsWith("#"));
      if(!lines.length){setErro("Arquivo vazio.");return;}
      const header=lines[0].toLowerCase().split(",").map(h=>h.trim().replace(/['"]/g,""));
      const col=k=>header.indexOf(k);
      if(col("data")<0||col("servico_id")<0||col("quantidade")<0){setErro('Colunas obrigatórias: "data","servico_id","quantidade"');return;}
      const svcIds=new Set(servicos.map(s=>s.id));
      const rows=[];const skip=[];
      lines.slice(1).forEach((line,i)=>{
        const c=line.split(",").map(x=>x.trim().replace(/^["']|["']$/g,""));
        const sid=(c[col("servico_id")]||"").toUpperCase();
        const qtd=parseFloat((c[col("quantidade")]||"").replace(",","."));
        if(!sid||isNaN(qtd)||qtd<=0){skip.push(`L${i+2}`);return;}
        if(!svcIds.has(sid)){skip.push(`L${i+2}: "${sid}" desconhecido`);return;}
        rows.push({id:uid(),data:c[col("data")]||hoje(),area:col("area")>=0?c[col("area")]:"",sid,qtd,
          cliId:col("cli_id")>=0?c[col("cli_id")]:(cliAtivo||""),
          obs:col("observacao")>=0?c[col("observacao")]:""});
      });
      if(!rows.length){setErro("Nenhuma linha válida. "+skip.slice(0,5).join("; "));return;}
      setPreview(rows);setErro(skip.length?`⚠ ${skip.length} linhas ignoradas`:"");setOk("");
    }catch(e){setErro("Erro: "+e.message);}
  };

  const lerCSV = file => {
    if(!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    if(["csv","txt"].includes(ext)){ const r=new FileReader(); r.onload=e=>processCSV(e.target.result); r.readAsText(file,"UTF-8"); }
    else if(["xlsx","xls"].includes(ext)){
      if(!window.XLSX){setErro("Carregando leitor Excel, tente em 2s.");return;}
      file.arrayBuffer().then(buf=>{const wb=window.XLSX.read(buf,{type:"array"});processCSV(window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]));});
    } else setErro("Use .csv ou .xlsx");
  };

  const importarCSV = () => { setPlanejado(p=>[...preview,...p]); setOk(`✓ ${preview.length} lançamentos importados!`); setPreview([]); };

  const downloadTemplate = () => {
    const ids=servicos.map(s=>`# ${s.id} = ${s.nome}`).join("\n");
    const blob=new Blob([`# HBR GAC — Template\n# Serviços:\n${ids}\n#\ndata,area,servico_id,quantidade,cli_id,observacao\n2024-06-10,Área A,V13,12,,Ponto SD-01\n`],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="template_planejamento.csv";a.click();
  };

  // ─── RENDER ────────────────────────────────────────────────────────────
  return(
    <div style={{display:"grid",gap:16,maxWidth:1000}}>

      {/* Seletor de modo */}
      <div style={{display:"flex",gap:0,borderBottom:"1px solid #21262d"}}>
        <button className={`tab-btn${modo==="plan"?" active":""}`} onClick={()=>{setModo("plan");setErro("");setOk("");setPlanData(null);}}>
          📄 Plano de Investigação (DOCX/PDF)
        </button>
        <button className={`tab-btn${modo==="csv"?" active":""}`} onClick={()=>{setModo("csv");setErro("");setOk("");setPreview([]);}}>
          📊 Planilha CSV / Excel
        </button>
      </div>

      {/* ── MODO PLANO DE INVESTIGAÇÃO ── */}
      {modo==="plan"&&(
        <div style={{display:"grid",gap:16}}>
          <div className="card ca-blue" style={{padding:"18px 20px"}}>
            <div className="sl" style={{marginBottom:8}}>IMPORTAR PLANO DE INVESTIGAÇÃO</div>
            <div style={{fontSize:12,color:"#8b949e",lineHeight:1.8}}>
              Sobe o <strong style={{color:"#c9d1d9"}}>DOCX ou PDF do Plano de Investigação Confirmatória</strong> e o sistema lê automaticamente os pontos, amostras e cronograma,
              criando a <strong style={{color:"#c9d1d9"}}>Área</strong> e os <strong style={{color:"#c9d1d9"}}>lançamentos no Planejado</strong> com as linhas obrigatórias:
              Mobilização, Perfuratriz, Gestão de Lab, Relatório Final, Direct Push e Rotativa 6" por ponto, e amostras conforme exigência.
            </div>
          </div>

          {/* Drop zone DOCX */}
          <div
            className={`drag-zone${drag?" dov":""}`}
            onClick={()=>refPlan.current?.click()}
            onDragOver={e=>{e.preventDefault();setDrag(true);}}
            onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);parsePlanDocx(e.dataTransfer.files[0]);}}>
            <div style={{fontSize:36,marginBottom:10}}>{loading?"⟳":"📄"}</div>
            <div style={{color:"#c9d1d9",fontWeight:600,marginBottom:4}}>{loading?"Lendo documento…":"Arraste o DOCX ou PDF do Plano de Investigação"}</div>
            <div style={{fontSize:12,color:"#484f58"}}>Formatos .docx ou .pdf — Plano de Investigação Confirmatória</div>
            <input ref={refPlan} type="file" accept=".docx,.pdf" style={{display:"none"}} onChange={e=>parsePlanDocx(e.target.files[0])}/>
          </div>

          {/* Dados extraídos + formulário de revisão */}
          {planData&&(
            <div className="card ca-green fi" style={{padding:"20px 22px"}}>
              <div className="sl" style={{marginBottom:16}}>DADOS EXTRAÍDOS — REVISE ANTES DE CONFIRMAR</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>NOME DA ÁREA</div>
                  <input className="inp" value={planData.nomeArea} onChange={e=>setPlanData(x=>({...x,nomeArea:e.target.value}))}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>CLIENTE</div>
                  <select className="inp" value={planData.cliId} onChange={e=>setPlanData(x=>({...x,cliId:e.target.value}))}>
                    <option value="">— Sem cliente —</option>
                    {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
                  </select>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>DATA INÍCIO <span style={{color:"#388bfd"}}>Mobilização</span></div>
                  <input type="date" className="inp" value={planData.dataInicio} onChange={e=>setPlanData(x=>({...x,dataInicio:e.target.value}))}/>
                  <div style={{fontSize:10,color:"#484f58",marginTop:3}}>Planejamento das atividades</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>DATA <span style={{color:"#388bfd"}}>Sondagens</span> (Direct Push / Rotativa)</div>
                  <input type="date" className="inp" value={planData.dataSondagem||""} onChange={e=>setPlanData(x=>({...x,dataSondagem:e.target.value}))}/>
                  <div style={{fontSize:10,color:"#484f58",marginTop:3}}>Execução das sondagens</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>DATA <span style={{color:"#388bfd"}}>Gestão de Lab</span> (Frascaria)</div>
                  <input type="date" className="inp" value={planData.dataLab||""} onChange={e=>setPlanData(x=>({...x,dataLab:e.target.value}))}/>
                  <div style={{fontSize:10,color:"#484f58",marginTop:3}}>Preparação das frascarias</div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>DATA <span style={{color:"#388bfd"}}>Relatório Final</span></div>
                  <input type="date" className="inp" value={planData.dataRelatorio||""} onChange={e=>setPlanData(x=>({...x,dataRelatorio:e.target.value}))}/>
                  <div style={{fontSize:10,color:"#484f58",marginTop:3}}>Elaboração do relatório técnico</div>
                </div>
              </div>

              {/* Cronograma extraído do documento */}
              {planData.cronograma&&(
                <div style={{background:"#010409",border:"1px solid #21262d",borderRadius:6,padding:"12px 14px",marginBottom:14}}>
                  <div style={{fontSize:10,color:"#484f58",marginBottom:10}}>CRONOGRAMA EXTRAÍDO DO DOCUMENTO</div>
                  <table style={{width:"100%",borderCollapse:"collapse"}}>
                    <thead>
                      <tr>
                        <th style={{textAlign:"left",padding:"4px 8px",color:"#484f58",fontWeight:600,textTransform:"uppercase",fontSize:10,borderBottom:"1px solid #21262d"}}>ATIVIDADE</th>
                        <th style={{textAlign:"center",padding:"4px 8px",color:"#484f58",fontWeight:600,textTransform:"uppercase",fontSize:10,borderBottom:"1px solid #21262d"}}>INÍCIO</th>
                        <th style={{textAlign:"center",padding:"4px 8px",color:"#484f58",fontWeight:600,textTransform:"uppercase",fontSize:10,borderBottom:"1px solid #21262d"}}>TÉRMINO</th>
                        <th style={{textAlign:"left",padding:"4px 8px",color:"#484f58",fontWeight:600,textTransform:"uppercase",fontSize:10,borderBottom:"1px solid #21262d"}}>USA EM</th>
                      </tr>
                    </thead>
                    <tbody>
                      {[
                        {key:"planejamento",label:"Planejamento das atividades", usa:"Mobilização"},
                        {key:"frascaria",   label:"Preparação das frascarias",  usa:"Gestão de Laboratório"},
                        {key:"sondagem",    label:"Execução das sondagens",     usa:"Direct Push + Rotativa"},
                        {key:"analise",     label:"Análises químicas",          usa:"—"},
                        {key:"relatorio",   label:"Elaboração do relatório",    usa:"Relatório Final"},
                      ].map(({key,label,usa})=>{
                        const c=planData.cronograma[key]||{};
                        return(
                          <tr key={key} style={{borderBottom:"1px solid #161b22"}}>
                            <td style={{padding:"6px 8px",color:"#c9d1d9",fontSize:12}}>{label}</td>
                            <td style={{padding:"6px 8px",textAlign:"center"}}>
                              {c.inicio?<span className="mono" style={{color:"#3fb950",fontSize:11}}>{c.inicio}</span>:<span style={{color:"#30363d",fontSize:11}}>—</span>}
                            </td>
                            <td style={{padding:"6px 8px",textAlign:"center"}}>
                              {c.termino?<span className="mono" style={{color:"#8b949e",fontSize:11}}>{c.termino}</span>:<span style={{color:"#30363d",fontSize:11}}>—</span>}
                            </td>
                            <td style={{padding:"6px 8px",fontSize:11,color:c.inicio?"#388bfd":"#484f58"}}>{usa}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}

              {/* Pontos extraídos — cada um lançado individualmente, com solo/água configuráveis */}
              <div style={{marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                  <div style={{fontSize:10,color:"#484f58"}}>PONTOS DE SONDAGEM — MARQUE AS AMOSTRAS DE CADA PONTO</div>
                  <button className="btn btn-ghost btn-xs" onClick={()=>{const n=prompt("Código do novo ponto (ex: SD-06):");if(n)setPlanData(x=>({...x,pontosDetalhe:[...x.pontosDetalhe,{nome:n.trim().toUpperCase(),solo:true,soloQtd:1,agua:true,aguaQtd:1}]}));}}>+ Ponto</button>
                </div>
                {planData.pontosDetalhe.length===0?(
                  <div style={{fontSize:12,color:"#f85149",padding:"10px 0"}}>Nenhum ponto identificado automaticamente. Adicione manualmente com "+ Ponto".</div>
                ):(
                  <table className="table">
                    <thead>
                      <tr>
                        <th>PONTO</th>
                        <th style={{textAlign:"center"}}>SOLO?</th>
                        <th style={{textAlign:"center",width:80}}>QTD SOLO</th>
                        <th style={{textAlign:"center"}}>ÁGUA?</th>
                        <th style={{textAlign:"center",width:80}}>QTD ÁGUA</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      {planData.pontosDetalhe.map((pt,i)=>(
                        <tr key={i}>
                          <td className="mono" style={{fontSize:12,color:"#c9d1d9"}}>{pt.nome}</td>
                          <td style={{textAlign:"center"}}>
                            <input type="checkbox" checked={!!pt.solo} onChange={e=>setPlanData(x=>({...x,pontosDetalhe:x.pontosDetalhe.map((p,j)=>j===i?{...p,solo:e.target.checked}:p)}))}/>
                          </td>
                          <td style={{textAlign:"center"}}>
                            <input type="number" className="inp" min="0" disabled={!pt.solo} value={pt.soloQtd} style={{width:64,textAlign:"center",padding:"4px 6px"}}
                              onChange={e=>setPlanData(x=>({...x,pontosDetalhe:x.pontosDetalhe.map((p,j)=>j===i?{...p,soloQtd:parseFloat(e.target.value)||0}:p)}))}/>
                          </td>
                          <td style={{textAlign:"center"}}>
                            <input type="checkbox" checked={!!pt.agua} onChange={e=>setPlanData(x=>({...x,pontosDetalhe:x.pontosDetalhe.map((p,j)=>j===i?{...p,agua:e.target.checked}:p)}))}/>
                          </td>
                          <td style={{textAlign:"center"}}>
                            <input type="number" className="inp" min="0" disabled={!pt.agua} value={pt.aguaQtd} style={{width:64,textAlign:"center",padding:"4px 6px"}}
                              onChange={e=>setPlanData(x=>({...x,pontosDetalhe:x.pontosDetalhe.map((p,j)=>j===i?{...p,aguaQtd:parseFloat(e.target.value)||0}:p)}))}/>
                          </td>
                          <td style={{textAlign:"right"}}>
                            <button className="btn btn-xs btn-ghost" style={{color:"#f85149"}} onClick={()=>setPlanData(x=>({...x,pontosDetalhe:x.pontosDetalhe.filter((_,j)=>j!==i)}))}>✕</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
                <div style={{fontSize:11,color:"#484f58",marginTop:8}}>
                  Cada ponto gera 1 linha de <strong>Direct Push</strong> + 1 de <strong>Rotativa 6"</strong>, além de <strong>Amostragem de Solo</strong> e/ou <strong>Amostragem de Água</strong> conforme marcado.
                </div>
              </div>

              {/* Preview das linhas que serão criadas */}
              <div style={{background:"#010409",border:"1px solid #21262d",borderRadius:6,padding:"12px 14px",marginBottom:16}}>
                <div style={{fontSize:10,color:"#484f58",marginBottom:10}}>LINHAS QUE SERÃO CRIADAS</div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {[
                    {sid:SVC.mobBH,    label:"Mobilização Inv. Confirmatória BH/Betim", qtd:1},
                    {sid:SVC.mobPerf,  label:"Mobilização de Perfuratriz",               qtd:1},
                    {sid:SVC.gestLab,  label:"Gestão de Laboratório + Frascaria",        qtd:1},
                    {sid:SVC.relFinal, label:"Relatório Final de Investigação",           qtd:1},
                    ...planData.pontosDetalhe.flatMap(pt=>[
                      {sid:SVC.dp,   label:`Direct Push — ${pt.nome}`,   qtd:1},
                      {sid:SVC.rot6, label:`Rotativa 6" — ${pt.nome}`,   qtd:1},
                      ...(pt.solo&&parseFloat(pt.soloQtd||0)>0?[{sid:SVC.amoSolo, label:`Amostragem de Solo — ${pt.nome}`, qtd:parseFloat(pt.soloQtd)}]:[]),
                      ...(pt.agua&&parseFloat(pt.aguaQtd||0)>0?[{sid:SVC.amoAgua, label:`Amostragem de Água — ${pt.nome}`, qtd:parseFloat(pt.aguaQtd)}]:[]),
                    ]),
                  ].map((l,i)=>{
                    const svc=svcMap[l.sid]||{};
                    const cor=COR[l.sid]||"#8b949e";
                    const val=(svc.valor||0)*l.qtd;
                    return(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 0",borderBottom:"1px solid #161b22"}}>
                        <span className="badge" style={{background:cor+"22",color:cor,border:`1px solid ${cor}44`,fontSize:10,minWidth:48,textAlign:"center"}}>{l.sid}</span>
                        <span style={{flex:1,fontSize:12,color:"#c9d1d9"}}>{l.label}</span>
                        <span className="mono" style={{fontSize:11,color:"#484f58"}}>× {l.qtd}</span>
                        {val>0&&<span className="mono" style={{fontSize:11,color:"#d29922"}}>R$ {fmt(val)}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>

              <button className="btn btn-success" style={{width:"100%",justifyContent:"center",padding:"11px 0",fontSize:14}} onClick={gerarDoPlan}>
                ◫ Criar Área
              </button>
            </div>
          )}
        </div>
      )}

      {/* ── MODO CSV / EXCEL ── */}
      {modo==="csv"&&(
        <div style={{display:"grid",gap:16}}>
          <div className="card ca-blue" style={{padding:"18px 20px"}}>
            <div className="sl" style={{marginBottom:8}}>IMPORTAR PLANILHA</div>
            <div style={{fontSize:12,color:"#8b949e",lineHeight:1.7,marginBottom:14}}>
              CSV ou Excel com colunas: <span className="mono" style={{color:"#d29922",fontSize:11}}>data, area, servico_id, quantidade, cli_id, observacao</span>
            </div>
            <button className="btn btn-ghost" onClick={downloadTemplate}>↓ Baixar Template CSV</button>
          </div>
          <div
            className={`drag-zone${drag?" dov":""}`}
            onClick={()=>refCSV.current?.click()}
            onDragOver={e=>{e.preventDefault();setDrag(true);}}
            onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);lerCSV(e.dataTransfer.files[0]);}}>
            <div style={{fontSize:36,color:"#388bfd",marginBottom:10}}>↑</div>
            <div style={{color:"#c9d1d9",fontWeight:600,marginBottom:4}}>Arraste o arquivo aqui</div>
            <div style={{fontSize:12,color:"#484f58"}}>CSV ou .xlsx</div>
            <input ref={refCSV} type="file" accept=".csv,.xlsx,.xls,.txt" style={{display:"none"}} onChange={e=>lerCSV(e.target.files[0])}/>
          </div>
          {preview.length>0&&(

// Meses disponíveis com base nos dados (últimos 24 meses)
const mesesRange = () => {
  const meses = [];
  const d = new Date();
  for(let i=0;i<24;i++){
    const m = new Date(d.getFullYear(), d.getMonth()-i, 1);
    meses.push(`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}`);
  }
  return meses;
};
const fmtMes = ym => {
  if(!ym) return "—";
  const [y,m] = ym.split("-");
  return new Date(+y,+m-1,1).toLocaleDateString("pt-BR",{month:"short",year:"numeric"});
};
const mesAtual = () => hoje().slice(0,7);

// ── Helpers de ciclo de medição ───────────────────────────────────────────
// Gera lista dos últimos `n` ciclos de medição para um dado diaCorte, aplicando
// qualquer período customizado (overrides) que o usuário tenha definido manualmente.
function ciclosRange(diaCorte, n=18, overrides=[], cliId="") {
  const dia = parseInt(diaCorte)||1;
  const ciclos = [];
  const ref = new Date();
  // Avança 1 ciclo além do atual para ter o próximo como opção
  for(let i = -1; i < n; i++){
    const refDate = new Date(ref.getFullYear(), ref.getMonth() - i, dia);
    const c = periodoCiclo(dia, refDate.toISOString().slice(0,10));
    // Evitar duplicatas (identidade estável = mesRef, não o inicio que pode ter sido editado)
    if(!ciclos.find(x=>x.mesRef===c.mesRef)){
      ciclos.push(aplicarOverrideCiclo(c, overrides, cliId));
    }
  }
  return ciclos.sort((a,b)=>b.mesRef.localeCompare(a.mesRef));
}

// Ciclo atual para um diaCorte
function cicloAtualRef(diaCorte, overrides=[], cliId="") {
  const c = periodoCiclo(diaCorte||"1");
  return aplicarOverrideCiclo(c, overrides, cliId);
}

// Formata label curto de um ciclo
const fmtCicloLabel = (inicio, fim) => {
  if(!inicio||!fim) return "—";
  const [ay,am,ad] = inicio.split("-");
  const [by,bm,bd] = fim.split("-");
  const mesNome = d => new Date(+d[0],+d[1]-1,1).toLocaleDateString("pt-BR",{month:"short"});
  return `${ad}/${mesNome([ay,am])} → ${bd}/${mesNome([by,bm])}/${by}`;
};

// ── Editor de período customizado de um ciclo de medição ─────────────────
// Permite sobrescrever manualmente o início/fim de um ciclo específico (ex.: quando
// o período de medição daquele mês não seguiu o dia de corte padrão do cliente).
// A alteração é salva em `periodos_medicao` (Supabase) e passa a valer em todo o
// sistema — Custos, Medição e o modal de geração do Boletim de Medição.
function EditorPeriodoCiclo({ciclo, cliId, periodosMedicao, setPeriodosMedicao, compact}){
  const [open, setOpen] = useState(false);
  const [ini, setIni] = useState(ciclo.inicio);
  const [fim, setFim] = useState(ciclo.fim);

  useEffect(()=>{ setIni(ciclo.inicio); setFim(ciclo.fim); },[ciclo.inicio, ciclo.fim]);

  if(!setPeriodosMedicao) return null;

  const salvar = () => {
    if(!ini||!fim||ini>fim) return;
    setPeriodosMedicao(list=>{
      const arr = list||[];
      const existe = arr.find(o=>o.mesRef===ciclo.mesRef && (o.cliId||"")===(cliId||""));
      if(existe) return arr.map(o=>o===existe?{...o,inicio:ini,fim:fim}:o);
      return [...arr,{id:uid(),cliId:cliId||"",mesRef:ciclo.mesRef,inicio:ini,fim:fim}];
    });
    setOpen(false);
  };

  const restaurar = () => {
    setPeriodosMedicao(list=>(list||[]).filter(o=>!(o.mesRef===ciclo.mesRef && (o.cliId||"")===(cliId||""))));
    setOpen(false);
  };

  return(
    <span style={{position:"relative",display:"inline-block"}}>
      <button
        type="button"
        onClick={e=>{e.stopPropagation();setOpen(v=>!v);}}
        title="Editar período deste ciclo"
        style={{background:"none",border:"none",cursor:"pointer",color:ciclo.editado?"#d29922":"#484f58",fontSize:compact?11:12,padding:"0 4px"}}>
        ✎{ciclo.editado?" editado":""}
      </button>
      {open&&(
        <div style={{position:"absolute",top:"120%",left:0,zIndex:50,background:"#161b22",border:"1px solid #30363d",borderRadius:8,padding:14,minWidth:240,boxShadow:"0 8px 24px #000a"}} onClick={e=>e.stopPropagation()}>
          <div style={{fontSize:10,color:"#484f58",marginBottom:8}}>PERÍODO CUSTOMIZADO — {ciclo.mesRef}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <div>
              <div style={{fontSize:9,color:"#484f58",marginBottom:3}}>INÍCIO</div>
              <input className="inp" type="date" value={ini} onChange={e=>setIni(e.target.value)} style={{width:"100%",fontSize:12}}/>
            </div>
            <div>
              <div style={{fontSize:9,color:"#484f58",marginBottom:3}}>FIM</div>
              <input className="inp" type="date" value={fim} onChange={e=>setFim(e.target.value)} style={{width:"100%",fontSize:12}}/>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-success btn-xs" style={{flex:1}} onClick={salvar}>Salvar</button>
            {ciclo.editado&&<button className="btn btn-ghost btn-xs" onClick={restaurar}>Restaurar padrão</button>}
            <button className="btn btn-ghost btn-xs" onClick={()=>setOpen(false)}>Cancelar</button>
          </div>
        </div>
      )}
    </span>
  );
}

// ── Custos Variáveis — Configuração de regras por serviço ────────────────
const CATS_CUSTO_VAR = ["Metro Perfurado","Insumos de Sondagem","Terceiros","Outros"];

function CustosVariaveis({custosVarConfig,setCustosVarConfig,servicos,svcMap,areas,planejado,realizado,clientes,cliAtivo,periodosMedicao,setPeriodosMedicao}){
  const [form, setForm] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [viewMode, setViewMode] = useState("config");

  // Ciclo de medição — usa cliente ativo se disponível
  const clienteAtivo = useMemo(()=>clientes.find(c=>c.id===cliAtivo)||null,[clientes,cliAtivo]);
  const diaCorte = clienteAtivo?.diaCorte||"1";
  const ciclos = useMemo(()=>ciclosRange(diaCorte,18,periodosMedicao,cliAtivo),[diaCorte,periodosMedicao,cliAtivo]);
  const cicloDefault = useMemo(()=>cicloAtualRef(diaCorte,periodosMedicao,cliAtivo),[diaCorte,periodosMedicao,cliAtivo]);
  const [cicloMesRef, setCicloMesRef] = useState(cicloDefault.mesRef);
  useEffect(()=>{ setCicloMesRef(cicloAtualRef(diaCorte,periodosMedicao,cliAtivo).mesRef); },[diaCorte]);
  const cicloSel = useMemo(()=>ciclos.find(c=>c.mesRef===cicloMesRef)||ciclos[0]||cicloDefault,[ciclos,cicloMesRef,cicloDefault]);

  const custosPlanCalc = useMemo(()=>{
    if(!Array.isArray(custosVarConfig)||!custosVarConfig.length) return [];
    const regrasAtivas = custosVarConfig.filter(r=>r.ativo===true||r.ativo===1||r.ativo==="true");
    if(!regrasAtivas.length) return [];
    const result=[];
    (planejado||[]).filter(l=>(!cliAtivo||l.cliId===cliAtivo)&&l.data&&l.data>=cicloSel.inicio&&l.data<=cicloSel.fim).forEach(lanc=>{
      regrasAtivas.filter(r=>String(r.sid)===String(lanc.sid)).forEach(regra=>{
        const valor=parseFloat(lanc.qtd||0)*parseFloat(regra.valorPorUnidade||regra.valor_por_unidade||0);
        if(valor>0) result.push({_id:`plan_${lanc.id}_${regra.id}`,tipo:"planejado",data:lanc.data,area:lanc.area||"—",cat:regra.categoria||"Outros",descricao:`${regra.nome} — ${lanc.area||""}`,valor,qtd:parseFloat(lanc.qtd||0),regra:regra.nome});
      });
    });
    return result;
  },[custosVarConfig,planejado,cliAtivo,cicloSel]);

  const custosRealCalc = useMemo(()=>{
    if(!Array.isArray(custosVarConfig)||!custosVarConfig.length) return [];
    const regrasAtivas = custosVarConfig.filter(r=>r.ativo===true||r.ativo===1||r.ativo==="true");
    if(!regrasAtivas.length) return [];
    const result=[];
    (realizado||[]).filter(l=>(!cliAtivo||l.cliId===cliAtivo)&&l.data&&l.data>=cicloSel.inicio&&l.data<=cicloSel.fim).forEach(lanc=>{
      regrasAtivas.filter(r=>String(r.sid)===String(lanc.sid)).forEach(regra=>{
        const valor=parseFloat(lanc.qtd||0)*parseFloat(regra.valorPorUnidade||regra.valor_por_unidade||0);
        if(valor>0) result.push({_id:`real_${lanc.id}_${regra.id}`,tipo:"confirmado",data:lanc.data,area:lanc.area||"—",cat:regra.categoria||"Outros",descricao:`${regra.nome} — ${lanc.area||""}`,valor,qtd:parseFloat(lanc.qtd||0),regra:regra.nome});
      });
    });
    return result;
  },[custosVarConfig,realizado,cliAtivo,cicloSel]);

  const totalPlan=useMemo(()=>custosPlanCalc.reduce((s,c)=>s+c.valor,0),[custosPlanCalc]);
  const totalReal=useMemo(()=>custosRealCalc.reduce((s,c)=>s+c.valor,0),[custosRealCalc]);

  const empty=()=>({sid:servicos[0]?.id||"",nome:"",categoria:"Metro Perfurado",valorPorUnidade:"",ativo:true});

  const salvar=()=>{
    if(!form.sid||!form.nome||!form.valorPorUnidade) return;
    if(form.id){ setCustosVarConfig(a=>a.map(x=>x.id===form.id?{...form}:x)); }
    else        { setCustosVarConfig(a=>[{...form,id:uid()},...a]); }
    setForm(null);
  };
  const del=id=>{ setCustosVarConfig(a=>a.filter(x=>x.id!==id)); setConfirmDel(null); };
  const toggleAtivo=id=>{ setCustosVarConfig(a=>a.map(x=>x.id===id?{...x,ativo:!x.ativo}:x)); };

  return(
    <div style={{display:"grid",gap:16}}>
      <div style={{display:"flex",gap:0,borderBottom:"1px solid #21262d"}}>
        <button className={`tab-btn${viewMode==="config"?" active":""}`} onClick={()=>setViewMode("config")}>⚙ Configuração</button>
        <button className={`tab-btn${viewMode==="preview"?" active":""}`} onClick={()=>setViewMode("preview")}>📊 Planejado × Confirmado</button>
      </div>

      {viewMode==="preview"&&(
        <div style={{display:"grid",gap:16}}>
          <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4,display:"flex",alignItems:"center",gap:6}}>
                <span>CICLO DE MEDIÇÃO</span>
