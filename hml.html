              <div className="sl" style={{marginBottom:2}}>SEM ÁREA VINCULADA</div>
              <div style={{fontSize:11,color:"#484f58"}}>Área não identificada no lançamento.</div>
            </div>
            <div className="mono" style={{color:"#f85149",fontWeight:700,fontSize:16}}>R$ {fmt(totalOrfaos)}</div>
          </div>
          <table className="table">
            <thead><tr><th>DATA</th><th>CATEGORIA</th><th>DESCRIÇÃO</th><th style={{textAlign:"right"}}>VALOR</th><th/></tr></thead>
            <tbody>
              {custosOrfaos.sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(c=>(
                <tr key={c.id}>
                  <td className="mono" style={{fontSize:11,color:"#8b949e"}}>{c.data||"—"}</td>
                  <td>{catBadge(c.cat)}</td>
                  <td style={{color:"#c9d1d9"}}>{c.descricao}</td>
                  <td className="mono" style={{textAlign:"right",color:"#f85149",fontWeight:600}}>R$ {fmt(c.valor)}</td>
                  <td style={{width:120}}>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                      <select style={{background:"#0d1117",border:"1px solid #30363d",color:"#484f58",borderRadius:4,padding:"2px 6px",fontSize:10,cursor:"pointer"}}
                        value="" onChange={e=>{ if(!e.target.value) return; setCustosArea(a=>a.map(x=>x.id===c.id?{...x,areaId:e.target.value}:x)); }}>
                        <option value="">Vincular área…</option>
                        {areas.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}
                      </select>
                      <button className="btn btn-danger btn-xs" onClick={()=>setCustosArea(a=>a.filter(x=>x.id!==c.id))}>✕</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── Gráfico Resultado Histórico ──────────────────────────────────────────
function GraficoResultado({dadosMeses, altura=220, eixoMin=null, eixoMax=null, eixoTicks=5}){
  if(!dadosMeses||!dadosMeses.length) return(
    <div style={{height:altura,display:"flex",alignItems:"center",justifyContent:"center",color:"#484f58",fontSize:12}}>
      Sem dados para o gráfico
    </div>
  );
  // Converte para percentual de margem: margem/receita*100
  const pctReal = d => d.receitaReal>0  ? (d.margemReal/d.receitaReal*100)   : null;
  const pctPlan = d => d.receitaPlan>0  ? (d.margemPlan/d.receitaPlan*100)   : null;

  const allVals = dadosMeses.flatMap(d=>[pctReal(d),pctPlan(d)].filter(v=>v!==null));
  if(!allVals.length) return(
    <div style={{height:altura,display:"flex",alignItems:"center",justifyContent:"center",color:"#484f58",fontSize:12}}>
      Sem dados suficientes para o gráfico
    </div>
  );
  // Se o usuário definir manualmente min/max do eixo, respeita; senão calcula automaticamente
  const maxVal = eixoMax!==null && eixoMax!=="" && !isNaN(eixoMax) ? parseFloat(eixoMax) : (Math.max(...allVals, 0) * 1.15 || 10);
  const minVal = eixoMin!==null && eixoMin!=="" && !isNaN(eixoMin) ? parseFloat(eixoMin) : (Math.min(...allVals, 0) * 1.15);
  const range  = (maxVal - minVal) || 1;
  const W=700, H=altura, PAD={top:24,right:32,bottom:52,left:58};
  const plotW=W-PAD.left-PAD.right;
  const plotH=H-PAD.top-PAD.bottom;
  const n=dadosMeses.length;
  const xAt=i=>PAD.left+(i/(Math.max(n-1,1)))*plotW;
  const yAt=v=>PAD.top+plotH*(1-(v-minVal)/range);
  const ticks=parseInt(eixoTicks)>0?parseInt(eixoTicks):5;
  const gridLines=Array.from({length:ticks+1},(_,i)=>minVal+i*(range/ticks));

  const mkPath=(pts)=>{
    const valid=pts.filter(p=>p.v!==null);
    if(valid.length<2) return null;
    return valid.map((p,i)=>`${i===0?"M":"L"}${xAt(p.i).toFixed(1)},${yAt(p.v).toFixed(1)}`).join(" ");
  };
  const pathReal = mkPath(dadosMeses.map((d,i)=>({i,v:pctReal(d)})));
  const pathPlan = mkPath(dadosMeses.map((d,i)=>({i,v:pctPlan(d)})));

  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:altura,overflow:"visible"}}>
      {/* Grid lines */}
      {gridLines.map((v,i)=>(
        <g key={i}>
          <line x1={PAD.left} y1={yAt(v)} x2={W-PAD.right} y2={yAt(v)}
            stroke={Math.abs(v)<0.1?"#3fb95044":"#21262d"} strokeWidth={Math.abs(v)<0.1?"1.5":"1"}/>
          <text x={PAD.left-6} y={yAt(v)+4} textAnchor="end" fontSize="10" fill="#484f58" fontFamily="IBM Plex Mono">
            {v.toFixed(0)}%
          </text>
        </g>
      ))}

      {/* Zero line */}
      {minVal<0&&maxVal>0&&(
        <line x1={PAD.left} y1={yAt(0)} x2={W-PAD.right} y2={yAt(0)} stroke="#484f58" strokeWidth="1" strokeDasharray="4 3"/>
      )}

      {/* Shaded area under realizado */}
      {pathReal&&(
        <path d={`${pathReal} L${xAt(n-1).toFixed(1)},${yAt(0).toFixed(1)} L${xAt(0).toFixed(1)},${yAt(0).toFixed(1)} Z`}
          fill="#3fb950" opacity="0.07"/>
      )}

      {/* Planejado line (dashed) */}
      {pathPlan&&(
        <path d={pathPlan} fill="none" stroke="#388bfd" strokeWidth="2" strokeDasharray="6 3" opacity="0.8"/>
      )}

      {/* Realizado line (solid) */}
      {pathReal&&(
        <path d={pathReal} fill="none" stroke="#3fb950" strokeWidth="2.5"/>
      )}

      {/* Data points + labels */}
      {dadosMeses.map((d,i)=>{
        const vReal=pctReal(d);
        const vPlan=pctPlan(d);
        const isAtual=d.m===hoje().slice(0,7);
        return(
          <g key={d.m}>
            {vReal!==null&&(
              <circle cx={xAt(i)} cy={yAt(vReal)} r={isAtual?5:3.5}
                fill={vReal>=0?"#3fb950":"#f85149"} stroke="#0d1117" strokeWidth="1.5"/>
            )}
            {vPlan!==null&&(
              <circle cx={xAt(i)} cy={yAt(vPlan)} r={isAtual?4:2.5}
                fill="#388bfd" stroke="#0d1117" strokeWidth="1.5" opacity="0.85"/>
            )}
            {/* Label for current period */}
            {isAtual&&vReal!==null&&(
              <text x={xAt(i)} y={yAt(vReal)-10} textAnchor="middle" fontSize="11"
                fill={vReal>=0?"#3fb950":"#f85149"} fontFamily="IBM Plex Mono" fontWeight="700">
                {vReal.toFixed(1)}%
              </text>
            )}
            {/* X label */}
            <text x={xAt(i)} y={H-PAD.bottom+14} textAnchor="middle" fontSize="10"
              fill={isAtual?"#c9d1d9":"#484f58"} fontFamily="IBM Plex Mono">
              {d.m.slice(5)}
            </text>
            {/* Current month highlight */}
            {isAtual&&<line x1={xAt(i)} y1={PAD.top} x2={xAt(i)} y2={PAD.top+plotH} stroke="#388bfd" strokeWidth="1" opacity="0.15"/>}
          </g>
        );
      })}

      {/* Legend */}
      <g transform={`translate(${PAD.left},${H-10})`}>
        <line x1="0" y1="-4" x2="18" y2="-4" stroke="#3fb950" strokeWidth="2.5"/>
        <circle cx="9" cy="-4" r="3" fill="#3fb950"/>
        <text x="22" y="0" fontSize="10" fill="#8b949e" fontFamily="IBM Plex Sans">% Margem Realizada</text>
        <line x1="158" y1="-4" x2="176" y2="-4" stroke="#388bfd" strokeWidth="2" strokeDasharray="6 3" opacity="0.8"/>
        <circle cx="167" cy="-4" r="2.5" fill="#388bfd" opacity="0.85"/>
        <text x="180" y="0" fontSize="10" fill="#8b949e" fontFamily="IBM Plex Sans">% Margem Planejada</text>
      </g>
    </svg>
  );
}

// ── Resultado (Receita − Custos = Margem) — por ciclo de medição ─────────
function Resultado({custosFixos,custosArea,custosPontuais,areas,realizado,planejado,svcMap,clientes,cliAtivo,custosVarConfig,periodosMedicao,setPeriodosMedicao}){
  const clienteAtivo = useMemo(()=>clientes.find(c=>c.id===cliAtivo)||null,[clientes,cliAtivo]);
  const diaCorte = clienteAtivo?.diaCorte||"1";
  const ciclos = useMemo(()=>ciclosRange(diaCorte,18,periodosMedicao,cliAtivo),[diaCorte,periodosMedicao,cliAtivo]);
  const cicloDefault = useMemo(()=>cicloAtualRef(diaCorte,periodosMedicao,cliAtivo),[diaCorte,periodosMedicao,cliAtivo]);
  const [cicloMesRef,setCicloMesRef] = useState(cicloDefault.mesRef);
  useEffect(()=>{ setCicloMesRef(cicloAtualRef(diaCorte,periodosMedicao,cliAtivo).mesRef); },[diaCorte]);
  const cicloSel = useMemo(()=>ciclos.find(c=>c.mesRef===cicloMesRef)||ciclos[0]||cicloDefault,[ciclos,cicloMesRef,cicloDefault]);

  // ── Eixo do gráfico % Margem — por padrão automático, mas editável pelo usuário
  const [eixoMin, setEixoMin] = useState("");
  const [eixoMax, setEixoMax] = useState("");
  const [eixoTicks, setEixoTicks] = useState("5");
  const [eixoAberto, setEixoAberto] = useState(false);

  const receitaPorCli = useMemo(()=>{
    const r={};
    realizado.filter(l=>l.data&&l.data>=cicloSel.inicio&&l.data<=cicloSel.fim&&(!cliAtivo||l.cliId===cliAtivo))
      .forEach(l=>{ r[l.cliId]=(r[l.cliId]||0)+(svcMap[l.sid]?.valor||0)*parseFloat(l.qtd||0); });
    return r;
  },[realizado,svcMap,cicloSel,cliAtivo]);
  const receitaTotal = useMemo(()=>Object.values(receitaPorCli).reduce((s,v)=>s+v,0),[receitaPorCli]);

  const receitaPlanTotal = useMemo(()=>{
    let tot=0;
    (planejado||[]).filter(l=>l.data&&l.data>=cicloSel.inicio&&l.data<=cicloSel.fim&&(!cliAtivo||l.cliId===cliAtivo))
      .forEach(l=>{ tot+=(svcMap[l.sid]?.valor||0)*parseFloat(l.qtd||0); });
    return tot;
  },[planejado,svcMap,cicloSel,cliAtivo]);

  const fixosCiclo = useMemo(()=>custosFixos.filter(c=>c.mesRef?c.mesRef===cicloSel.mesRef:(c.cicloInicio?c.cicloInicio===cicloSel.inicio:c.mes===cicloSel.inicio.slice(0,7))),[custosFixos,cicloSel]);
  const totalFixoReal = useMemo(()=>fixosCiclo.reduce((s,c)=>s+(parseFloat(c.valorRealizado||"")||parseFloat(c.valor||0)),0),[fixosCiclo]);
  const totalFixoPlan = useMemo(()=>fixosCiclo.reduce((s,c)=>s+parseFloat(c.valor||0),0),[fixosCiclo]);

  const custosAreaCiclo = useMemo(()=>custosArea.filter(c=>c.data&&c.data>=cicloSel.inicio&&c.data<=cicloSel.fim),[custosArea,cicloSel]);

  const custosVarCiclo = useMemo(()=>{
    if(!Array.isArray(custosVarConfig)||!custosVarConfig.length) return [];
    const regrasAtivas = custosVarConfig.filter(r=>r.ativo===true||r.ativo===1||r.ativo==="true");
    if(!regrasAtivas.length) return [];
    const result=[];
    realizado.filter(l=>l.data&&l.data>=cicloSel.inicio&&l.data<=cicloSel.fim&&(!cliAtivo||l.cliId===cliAtivo))
      .forEach(lanc=>{
        regrasAtivas.filter(r=>String(r.sid)===String(lanc.sid)).forEach(regra=>{
          const valor=parseFloat(lanc.qtd||0)*parseFloat(regra.valorPorUnidade||regra.valor_por_unidade||0);
          if(valor>0){
            let areaId=lanc.areaId||null;
            if(!areaId&&lanc.area){ const a=areas.find(a=>(a.nome||"").toUpperCase()===(lanc.area||"").toUpperCase()); if(a) areaId=a.id; }
            result.push({areaId,cliId:lanc.cliId,valor});
          }
        });
      });
    return result;
  },[custosVarConfig,realizado,cicloSel,cliAtivo,areas]);
  const totalVar = useMemo(()=>custosVarCiclo.reduce((s,c)=>s+c.valor,0),[custosVarCiclo]);

  // Custos pontuais: só realizados entram no efetivo
  const cpCiclo = useMemo(()=>(custosPontuais||[]).filter(c=>c.data&&c.data>=cicloSel.inicio&&c.data<=cicloSel.fim),[custosPontuais,cicloSel]);
  const cpReal  = useMemo(()=>cpCiclo.filter(c=>(c.status||"realizado")==="realizado"),[cpCiclo]);
  const cpPlan  = useMemo(()=>cpCiclo.filter(c=>(c.status||"realizado")==="planejado"),[cpCiclo]);
  const totalCPReal = useMemo(()=>cpReal.reduce((s,c)=>s+parseFloat(c.valor||0),0),[cpReal]);
  const totalCPPlan = useMemo(()=>cpPlan.reduce((s,c)=>s+parseFloat(c.valor||0),0),[cpPlan]);

  const custoDiretoPorCli = useMemo(()=>{
    const r={};
    const add=(cid,v)=>{ if(!cid) return; if(cliAtivo&&cid!==cliAtivo) return; r[cid]=(r[cid]||0)+v; };
    custosAreaCiclo.forEach(c=>{
      if(c.areaId){ const area=areas.find(a=>a.id===c.areaId); if(area?.cliId) add(area.cliId,parseFloat(c.valor||0)); }
      else if(cliAtivo) add(cliAtivo,parseFloat(c.valor||0));
    });
    custosVarCiclo.forEach(c=>{
      if(c.areaId){ const area=areas.find(a=>a.id===c.areaId); add(area?.cliId||c.cliId,c.valor); }
      else add(c.cliId,c.valor);
    });
    cpReal.forEach(c=>{ if(c.cliId) add(c.cliId,parseFloat(c.valor||0)); });
    return r;
  },[custosAreaCiclo,custosVarCiclo,cpReal,areas,cliAtivo]);

  const pontualSemCli = useMemo(()=>cpReal.filter(c=>!c.cliId).reduce((s,c)=>s+parseFloat(c.valor||0),0),[cpReal]);
  const cliIds = useMemo(()=>[...new Set([...Object.keys(receitaPorCli),...Object.keys(custoDiretoPorCli)])],[receitaPorCli,custoDiretoPorCli]);
  const baseFixaRateio = totalFixoReal+pontualSemCli;
  const custoFixoRateado = cliId=>receitaTotal===0?baseFixaRateio/Math.max(cliIds.length,1):baseFixaRateio*(receitaPorCli[cliId]||0)/receitaTotal;

  const rows = cliIds.map(cliId=>{
    const cli=clientes.find(c=>c.id===cliId);
    const receita=receitaPorCli[cliId]||0;
    const fixoRat=custoFixoRateado(cliId);
    const direto=custoDiretoPorCli[cliId]||0;
    const custo=fixoRat+direto;
    const margem=receita-custo;
    return {cliId,cli,receita,fixoRat,direto,custo,margem,pct:receita>0?margem/receita*100:null};
  }).sort((a,b)=>b.receita-a.receita);

  const totReceita=rows.reduce((s,r)=>s+r.receita,0);
  const totCusto=rows.reduce((s,r)=>s+r.custo,0);
  const totMargem=totReceita-totCusto;
  const totCustoPlan=totalFixoPlan+custosAreaCiclo.reduce((s,c)=>s+parseFloat(c.valor||0),0)+totalCPPlan;
  const totMargPlan=receitaPlanTotal-totCustoPlan;

  // Dados históricos para gráfico
  const dadosMeses = useMemo(()=>{
    const dia=parseInt(diaCorte)||1;
    const result=[];
    for(let i=7;i>=0;i--){
      const refDate=new Date(new Date().getFullYear(),new Date().getMonth()-i,dia);
      const cBase=periodoCiclo(dia,refDate.toISOString().slice(0,10));
      const c=aplicarOverrideCiclo(cBase,periodosMedicao,cliAtivo);
      let recR=0,recP=0;
      realizado.filter(l=>l.data&&l.data>=c.inicio&&l.data<=c.fim&&(!cliAtivo||l.cliId===cliAtivo))
        .forEach(l=>{ recR+=(svcMap[l.sid]?.valor||0)*parseFloat(l.qtd||0); });
      (planejado||[]).filter(l=>l.data&&l.data>=c.inicio&&l.data<=c.fim&&(!cliAtivo||l.cliId===cliAtivo))
        .forEach(l=>{ recP+=(svcMap[l.sid]?.valor||0)*parseFloat(l.qtd||0); });
      const fixosC=custosFixos.filter(x=>x.mesRef?x.mesRef===c.mesRef:(x.cicloInicio?x.cicloInicio===c.inicio:x.mes===c.inicio.slice(0,7)));
      const fixR=fixosC.reduce((s,x)=>s+(parseFloat(x.valorRealizado||"")||parseFloat(x.valor||0)),0);
      const fixP=fixosC.reduce((s,x)=>s+parseFloat(x.valor||0),0);
      const areaC=custosArea.filter(x=>x.data&&x.data>=c.inicio&&x.data<=c.fim).reduce((s,x)=>s+parseFloat(x.valor||0),0);
      const pontR=(custosPontuais||[]).filter(x=>x.data&&x.data>=c.inicio&&x.data<=c.fim&&(x.status||"realizado")==="realizado").reduce((s,x)=>s+parseFloat(x.valor||0),0);
      const custoR=fixR+areaC+pontR;
      const custoP=fixP+areaC;
      result.push({m:c.mesRef,receitaReal:recR,receitaPlan:recP,custoReal:custoR,margemReal:recR-custoR,margemPlan:recP-custoP});
    }
    return result.filter(d=>d.receitaReal>0||d.receitaPlan>0);
  },[custosFixos,custosArea,custosPontuais,realizado,planejado,diaCorte,cliAtivo,svcMap,periodosMedicao]);

  return(
    <div style={{display:"grid",gap:16}}>
      <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:10,color:"#484f58",marginBottom:4,display:"flex",alignItems:"center",gap:6}}>
            <span>CICLO DE MEDIÇÃO</span>
            <EditorPeriodoCiclo ciclo={cicloSel} cliId={cliAtivo} periodosMedicao={periodosMedicao} setPeriodosMedicao={setPeriodosMedicao}/>
          </div>
          <select className="inp" style={{width:240}} value={cicloMesRef} onChange={e=>setCicloMesRef(e.target.value)}>
            {ciclos.map(c=><option key={c.mesRef} value={c.mesRef}>{c.label}{c.editado?" ✎":""}</option>)}
          </select>
          {clienteAtivo
            ?<div style={{fontSize:10,color:"#484f58",marginTop:3}}>Dia de corte: <span style={{color:"#d29922"}}>{diaCorte}</span> — {clienteAtivo.nome}</div>
            :<div style={{fontSize:10,color:"#f85149",marginTop:3}}>Selecione um cliente para usar o ciclo correto</div>
          }
        </div>
      </div>

      {/* Cards Planejado vs Realizado */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div className="card" style={{padding:"14px 18px",borderTop:"2px solid #388bfd"}}>
          <div style={{fontSize:10,color:"#388bfd",marginBottom:8}}>PLANEJADO — {cicloSel.label}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            <div>
              <div style={{fontSize:10,color:"#484f58"}}>RECEITA</div>
              <div className="mono" style={{fontSize:13,fontWeight:700,color:"#388bfd88"}}>R$ {fmt(receitaPlanTotal)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58"}}>CUSTO EST.</div>
              <div className="mono" style={{fontSize:13,fontWeight:700,color:"#f8514988"}}>R$ {fmt(totCustoPlan)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58"}}>MARGEM EST.</div>
              <div className="mono" style={{fontSize:13,fontWeight:700,color:totMargPlan>=0?"#3fb95088":"#f8514988"}}>R$ {fmt(totMargPlan)}</div>
              {receitaPlanTotal>0&&(
                <div className="mono" style={{fontSize:11,color:totMargPlan>=0?"#3fb95066":"#f8514966",marginTop:2}}>
                  {((totMargPlan/receitaPlanTotal)*100).toFixed(1)}%
                </div>
              )}
            </div>
          </div>
        </div>
        <div className="card" style={{padding:"14px 18px",borderTop:"2px solid #3fb950"}}>
          <div style={{fontSize:10,color:"#3fb950",marginBottom:8}}>REALIZADO — {cicloSel.label}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            <div>
              <div style={{fontSize:10,color:"#484f58"}}>RECEITA</div>
              <div className="mono" style={{fontSize:13,fontWeight:700,color:"#3fb950"}}>R$ {fmt(totReceita)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58"}}>CUSTO</div>
              <div className="mono" style={{fontSize:13,fontWeight:700,color:"#f85149"}}>R$ {fmt(totCusto)}</div>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58"}}>MARGEM</div>
              <div className="mono" style={{fontSize:13,fontWeight:700,color:totMargem>=0?"#3fb950":"#f85149"}}>R$ {fmt(totMargem)}</div>
              {totReceita>0&&(
                <div className="mono" style={{fontSize:11,color:totMargem>=0?"#3fb950":"#f85149",marginTop:2}}>
                  {((totMargem/totReceita)*100).toFixed(1)}%
                </div>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* Gráfico histórico */}
      {dadosMeses.length>0&&(
        <div className="card" style={{padding:"16px 18px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:12}}>
            <div className="sl">% MARGEM — PLANEJADO × REALIZADO (histórico de ciclos)</div>
            <button className="btn btn-ghost btn-xs" onClick={()=>setEixoAberto(v=>!v)}>⚙ Editar eixos</button>
          </div>

          {eixoAberto&&(
            <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end",marginBottom:14,padding:"12px 14px",background:"#161b22",borderRadius:8}}>
              <div>
                <div style={{fontSize:9,color:"#484f58",marginBottom:3}}>MÍN. (%)</div>
                <input className="inp" type="number" placeholder="auto" value={eixoMin} onChange={e=>setEixoMin(e.target.value)} style={{width:90,fontSize:12}}/>
              </div>
              <div>
                <div style={{fontSize:9,color:"#484f58",marginBottom:3}}>MÁX. (%)</div>
                <input className="inp" type="number" placeholder="auto" value={eixoMax} onChange={e=>setEixoMax(e.target.value)} style={{width:90,fontSize:12}}/>
              </div>
              <div>
                <div style={{fontSize:9,color:"#484f58",marginBottom:3}}>Nº DE FAIXAS</div>
                <input className="inp" type="number" min="2" max="12" value={eixoTicks} onChange={e=>setEixoTicks(e.target.value)} style={{width:70,fontSize:12}}/>
              </div>
              <button className="btn btn-ghost btn-xs" onClick={()=>{setEixoMin("");setEixoMax("");setEixoTicks("5");}}>Restaurar automático</button>
            </div>
          )}

          <GraficoResultado dadosMeses={dadosMeses} altura={220} eixoMin={eixoMin} eixoMax={eixoMax} eixoTicks={eixoTicks}/>
        </div>
      )}

      {/* KPI Cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        <div className="card ca-green" style={{padding:"14px 18px"}}>
          <div className="sl" style={{marginBottom:6}}>RECEITA</div>
          <div className="mono" style={{fontSize:18,fontWeight:700,color:"#3fb950"}}>R$ {fmt(totReceita)}</div>
          {receitaPlanTotal>0&&<div style={{fontSize:11,color:"#388bfd88",marginTop:2}}>Plan: R$ {fmt(receitaPlanTotal)}</div>}
        </div>
        <div className="card ca-red" style={{padding:"14px 18px"}}>
          <div className="sl" style={{marginBottom:6}}>CUSTO FIXO</div>
          <div className="mono" style={{fontSize:18,fontWeight:700,color:"#f85149"}}>R$ {fmt(totalFixoReal)}</div>
          {totalFixoPlan!==totalFixoReal&&<div style={{fontSize:11,color:"#388bfd88",marginTop:2}}>Plan: R$ {fmt(totalFixoPlan)}</div>}
        </div>
        <div className="card ca-orange" style={{padding:"14px 18px"}}>
          <div className="sl" style={{marginBottom:6}}>CUSTO DIRETO</div>
          <div className="mono" style={{fontSize:18,fontWeight:700,color:"#d29922"}}>R$ {fmt(rows.reduce((s,r)=>s+r.direto,0))}</div>
          {totalVar>0&&<div style={{fontSize:11,color:"#8957e5",marginTop:2}}>R$ {fmt(totalVar)} variáveis</div>}
          {totalCPPlan>0&&<div style={{fontSize:11,color:"#388bfd88",marginTop:1}}>R$ {fmt(totalCPPlan)} pont. plan.</div>}
        </div>
        <div className={`card ${totMargem>=0?"ca-green":"ca-red"}`} style={{padding:"14px 18px"}}>
          <div className="sl" style={{marginBottom:6}}>MARGEM</div>
          <div className="mono" style={{fontSize:18,fontWeight:700,color:totMargem>=0?"#3fb950":"#f85149"}}>R$ {fmt(totMargem)}</div>
          <div style={{fontSize:11,color:"#484f58",marginTop:2}}>{totReceita>0?`${((totMargem/totReceita)*100).toFixed(1)}%`:"—"}</div>
        </div>
      </div>

      {rows.length===0?(
        <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
          <div style={{fontSize:13,color:"#8b949e"}}>Nenhum lançamento realizado no ciclo {cicloSel.label}.</div>
        </div>
      ):(
        <div className="card" style={{padding:"14px 18px"}}>
          <div className="sl" style={{marginBottom:12}}>RESULTADO POR CLIENTE — CICLO {cicloSel.label}</div>
          <table className="table">
            <thead>
              <tr>
                <th>CLIENTE</th>
                <th style={{textAlign:"right"}}>RECEITA</th>
                <th style={{textAlign:"right"}}>C. FIXO RATEADO</th>
                <th style={{textAlign:"right"}}>C. DIRETO</th>
                <th style={{textAlign:"right"}}>CUSTO TOTAL</th>
                <th style={{textAlign:"right"}}>MARGEM</th>
                <th style={{textAlign:"right"}}>%</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r=>{
                const corM=r.margem>=0?"#3fb950":"#f85149";
                return(
                  <tr key={r.cliId}>
                    <td style={{fontWeight:500,color:"#c9d1d9"}}>{r.cli?.nome||r.cliId}</td>
                    <td className="mono" style={{textAlign:"right",color:"#3fb950"}}>R$ {fmt(r.receita)}</td>
                    <td className="mono" style={{textAlign:"right",color:"#f85149",fontSize:11}}>R$ {fmt(r.fixoRat)}</td>
                    <td className="mono" style={{textAlign:"right",color:"#d29922",fontSize:11}}>R$ {fmt(r.direto)}</td>
                    <td className="mono" style={{textAlign:"right",color:"#f85149",fontWeight:600}}>R$ {fmt(r.custo)}</td>
                    <td className="mono" style={{textAlign:"right",color:corM,fontWeight:700}}>R$ {fmt(r.margem)}</td>
                    <td style={{textAlign:"right"}}>
                      <span className={`badge ${r.margem>=0?"bgn":"br"}`}>{r.pct!==null?`${r.pct.toFixed(1)}%`:"—"}</span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{borderTop:"2px solid #21262d"}}>
                <td style={{fontWeight:700,color:"#8b949e",fontSize:11,textTransform:"uppercase",padding:"10px 12px"}}>Total</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,color:"#3fb950",padding:"10px 12px"}}>R$ {fmt(totReceita)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,color:"#f85149",padding:"10px 12px"}}>R$ {fmt(totalFixoReal)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,color:"#d29922",padding:"10px 12px"}}>R$ {fmt(rows.reduce((s,r)=>s+r.direto,0))}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,color:"#f85149",padding:"10px 12px"}}>R$ {fmt(totCusto)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,color:totMargem>=0?"#3fb950":"#f85149",padding:"10px 12px",fontSize:15}}>R$ {fmt(totMargem)}</td>
                <td style={{textAlign:"right",padding:"10px 12px"}}>
                  <span className={`badge ${totMargem>=0?"bgn":"br"}`} style={{fontSize:12}}>{totReceita>0?`${((totMargem/totReceita)*100).toFixed(1)}%`:"—"}</span>
                </td>
              </tr>
            </tfoot>
          </table>
          <div style={{fontSize:11,color:"#484f58",marginTop:12,lineHeight:1.7}}>
            * Custo fixo rateado proporcionalmente à receita de cada cliente no ciclo.<br/>
            * Custos pontuais <strong style={{color:"#388bfd88"}}>planejados</strong> não entram no resultado efetivo até confirmação.
          </div>
        </div>
      )}
    </div>
  );
}




//  Cada área tem: nome, cliente, lista de serviços (sid+qtd+data) →
//  ao "Gerar Planejado" cria entradas na tabela planejado automaticamente.
// ═══════════════════════════════════════════════════════════════════════════
function CadastroAreas({areas,setAreas,planejado,setPlanejado,realizado=[],pontos=[],setPontos,servicos,svcMap,clientes,cliAtivo}){
  // Área › Ponto › Serviço. Os serviços da área SÃO os lançamentos do planejado (areaId + pontoId).
  // pontoId vazio no banco = "N/A — serviço da área".
  const [view,setView]=useState("lista");          // "lista" | "form"
  const [f,setF]=useState(null);                    // {id,nome,descricao,cliId,novo}
  const [pts,setPts]=useState([]);                  // [{id,codigo,tipo,coordenadas,obs}]
  const [svs,setSvs]=useState([]);                  // [{key,id,pontoSel,sid,qtd,data,obs}]
  const [incluidos,setIncluidos]=useState(new Set());
  const [erro,setErro]=useState("");
  const [salvando,setSalvando]=useState(false);
  const [msg,setMsg]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);

  const areasFilt=useMemo(()=>cliAtivo?areas.filter(a=>a.cliId===cliAtivo):areas,[areas,cliAtivo]);
  const realPorPlan=useMemo(()=>{const m={};realizado.forEach(r=>{if(r.planId)m[r.planId]=(m[r.planId]||0)+1;});return m;},[realizado]);
  const sit=useMemo(()=>calcSituacaoPlan(realizado),[realizado]);

  const stats=useCallback(area=>{
    const pl=planejado.filter(p=>p.areaId===area.id);
    const total=pl.reduce((s,p)=>s+(svcMap[p.sid]?.valor||0)*parseFloat(p.qtd||0),0);
    const enc=pl.filter(p=>sit[p.id]?.encerrada).length;
    return {nPontos:pontos.filter(p=>p.areaId===area.id).length,nServ:pl.length,total,enc};
  },[planejado,pontos,svcMap,sit]);

  // itens antigos (lista JSON da área) que não têm lançamento correspondente no planejado
  const legado=useMemo(()=>{
    if(!f||f.novo) return [];
    const area=areas.find(a=>a.id===f.id); const itens=Array.isArray(area?.itens)?area.itens:[];
    const pl=planejado.filter(p=>p.areaId===f.id);
    return itens.map((it,idx)=>({...it,idx})).filter(it=>!pl.some(p=>p.sid===it.sid&&p.data===it.data&&parseFloat(p.qtd)===parseFloat(it.qtd)));
  },[f,areas,planejado]);

  const abrirNova=()=>{
    setErro("");setIncluidos(new Set());
    setF({id:uid(),nome:"",descricao:"",cliId:cliAtivo||"",novo:true});setPts([]);setSvs([]);setView("form");
  };
  const abrir=area=>{
    setErro("");setIncluidos(new Set());
    setF({id:area.id,nome:area.nome||"",descricao:area.descricao||"",cliId:area.cliId||"",novo:false});
    setPts(pontos.filter(p=>p.areaId===area.id).map(p=>({id:p.id,codigo:p.codigo||"",tipo:p.tipo||"",coordenadas:p.coordenadas||"",obs:p.obs||""})).sort((a,b)=>a.codigo.localeCompare(b.codigo)));
    setSvs(planejado.filter(p=>p.areaId===area.id).sort((a,b)=>(a.data||"").localeCompare(b.data||"")).map(p=>({key:p.id,id:p.id,pontoSel:p.pontoId||"NA",sid:p.sid,qtd:String(p.qtd??""),data:p.data||"",obs:p.obs||""})));
    setView("form");
  };

  const addPonto=()=>setPts(x=>[...x,{id:uid(),codigo:"",tipo:"",coordenadas:"",obs:""}]);
  const setP=(id,c,v)=>setPts(x=>x.map(p=>p.id===id?{...p,[c]:v}:p));
  const remPonto=p=>{
    setErro("");
    if(svs.some(s=>s.pontoSel===p.id)){setErro(`O ponto ${p.codigo||"(sem código)"} tem serviços vinculados. Troque o ponto desses serviços antes de removê-lo.`);return;}
    if(realizado.some(r=>r.pontoId===p.id)){setErro(`O ponto ${p.codigo} já tem lançamentos em boletins e não pode ser removido.`);return;}
    setPts(x=>x.filter(y=>y.id!==p.id));
  };
  const addServ=(base)=>setSvs(x=>[...x,{key:uid(),id:null,pontoSel:"",sid:base?.sid||servicos[0]?.id||"",qtd:base?String(base.qtd??""):"",data:base?.data||hoje(),obs:base?.obs||""}]);
  const setS=(key,c,v)=>setSvs(x=>x.map(s=>s.key===key?{...s,[c]:v}:s));
  const remServ=s=>{
    setErro("");
    if(s.id&&realPorPlan[s.id]){setErro("Este serviço já tem lançamentos em boletins e não pode ser removido. Se não será mais executado, encerre-o em um boletim.");return;}
    setSvs(x=>x.filter(y=>y.key!==s.key));
  };

  const salvar=async()=>{
    setErro("");
    if(!f.nome.trim()){setErro("Informe o nome da área.");return;}
    const cods=pts.map(p=>p.codigo.trim().toUpperCase());
    if(cods.some(c=>!c)){setErro("Todo ponto precisa de um código.");return;}
    if(new Set(cods).size!==cods.length){setErro("Há pontos com o mesmo código nesta área.");return;}
    const semPonto=svs.filter(s=>!s.pontoSel).length;
    if(semPonto){setErro(`${semPonto} serviço(s) sem ponto. Escolha um ponto ou “N/A — serviço da área”.`);return;}
    if(svs.some(s=>!s.sid||!(parseFloat(String(s.qtd).replace(",","."))>0)||!s.data)){setErro("Todo serviço precisa de serviço, quantidade maior que zero e data.");return;}

    const areaAtual=areas.find(a=>a.id===f.id);
    const areaRow={id:f.id,nome:f.nome.trim(),descricao:f.descricao||"",cliId:f.cliId||null,itens:Array.isArray(areaAtual?.itens)?areaAtual.itens:[]};
    const ptsRows=pts.map(p=>({id:p.id,areaId:f.id,codigo:p.codigo.trim(),tipo:p.tipo||"",coordenadas:p.coordenadas||"",obs:p.obs||""}));
    const planRows=svs.map(s=>({id:s.id||uid(),areaId:f.id,area:areaRow.nome,cliId:f.cliId||null,sid:s.sid,
      qtd:parseFloat(String(s.qtd).replace(",",".")),data:s.data,obs:s.obs||"",pontoId:s.pontoSel==="NA"?null:s.pontoSel}));
    setSalvando(true);
    try{
      // ordem obrigatória por causa das chaves estrangeiras: área → pontos → planejado
      await sb.upsert("areas",areaRow);
      if(ptsRows.length) await sb.upsert("pontos",ptsRows);
    }catch(e){setErro("Não foi possível salvar: "+e.message);setSalvando(false);return;}
    setAreas(a=>a.some(x=>x.id===f.id)?a.map(x=>x.id===f.id?{...x,...areaRow}:x):[areaRow,...a]);
    setPontos(p=>[...p.filter(x=>x.areaId!==f.id),...ptsRows]);
    setPlanejado(p=>[...p.filter(x=>x.areaId!==f.id),...planRows]);
    setSalvando(false);
    setMsg(f.novo?"Área cadastrada.":"Área atualizada. O planejado já reflete os serviços.");setTimeout(()=>setMsg(null),3500);
    setView("lista");setF(null);
  };

  const excluir=(area,manterPlan)=>{
    setPontos(p=>p.filter(x=>x.areaId!==area.id));
    if(manterPlan) setPlanejado(p=>p.map(x=>x.areaId===area.id&&x.pontoId?{...x,pontoId:null}:x));
    else setPlanejado(p=>p.filter(x=>x.areaId!==area.id));
    setAreas(a=>a.filter(x=>x.id!==area.id));
    setConfirmDel(null);
  };

  const th={padding:"6px 10px",textAlign:"left",fontSize:10,fontWeight:600,color:"#8b949e",borderBottom:"1px solid #21262d"};
  const td={padding:"6px 10px",borderBottom:"1px solid #161b22"};

  // ── FORMULÁRIO ───────────────────────────────────────────────────────────
  if(view==="form"&&f){
    const total=svs.reduce((s,x)=>s+(svcMap[x.sid]?.valor||0)*(parseFloat(String(x.qtd).replace(",","."))||0),0);
    const ptsOrd=[...pts].sort((a,b)=>a.codigo.localeCompare(b.codigo));
    return(
      <div style={{display:"grid",gap:16,maxWidth:1200}}>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setView("lista");setF(null);}} disabled={salvando}>← Voltar</button>
          <h2 style={{color:"#c9d1d9",fontSize:16,fontWeight:600,flex:1}}>{f.novo?"Nova área":"Editar área"}</h2>
          <button className="btn btn-success" onClick={salvar} disabled={salvando}>{salvando?"Salvando…":"✓ Salvar área"}</button>
        </div>
        {erro&&<div className="card" style={{padding:"10px 14px",borderColor:"#f8514966",color:"#f85149",fontSize:12}}>{erro}</div>}

        <div className="card ca-purple" style={{padding:"16px 18px"}}>
          <div className="sl" style={{marginBottom:12}}>IDENTIFICAÇÃO DA ÁREA</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
            <div><div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>NOME DA ÁREA *</div>
              <input className="inp" value={f.nome} onChange={e=>setF(x=>({...x,nome:e.target.value}))}/></div>
            <div><div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>CLIENTE</div>
              <select className="inp" value={f.cliId} onChange={e=>setF(x=>({...x,cliId:e.target.value}))}>
                <option value="">— Sem cliente —</option>
                {clientes.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}
              </select></div>
            <div><div style={{fontSize:10,color:"#8b949e",marginBottom:4}}>DESCRIÇÃO / OBSERVAÇÕES</div>
              <input className="inp" value={f.descricao} onChange={e=>setF(x=>({...x,descricao:e.target.value}))}/></div>
          </div>
        </div>

        {/* 1 · Pontos */}
        <div className="card ca-blue" style={{padding:"16px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8,flexWrap:"wrap"}}>
            <div><div className="sl">1 · PONTOS DA ÁREA</div><div style={{fontSize:11,color:"#8b949e",marginTop:3}}>Código único na área (ex.: PM-01, SD-03)</div></div>
            <button className="btn btn-primary btn-sm" onClick={addPonto}>+ Ponto</button>
          </div>
          {pts.length===0
            ?<div style={{padding:"18px 0",textAlign:"center",color:"#8b949e",fontSize:12}}>Nenhum ponto. Serviços sem ponto podem ser cadastrados como N/A.</div>
            :<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",minWidth:760}}>
              <thead><tr><th style={{...th,width:140}}>CÓDIGO *</th><th style={th}>TIPO</th><th style={th}>COORDENADAS</th><th style={th}>OBSERVAÇÃO</th><th style={{...th,width:90}}>SERVIÇOS</th><th style={{...th,width:40}}/></tr></thead>
              <tbody>{pts.map(p=>(
                <tr key={p.id}>
                  <td style={td}><input className="inp mono" aria-label="Código do ponto" value={p.codigo} onChange={e=>setP(p.id,"codigo",e.target.value)}/></td>
                  <td style={td}><input className="inp" aria-label="Tipo" placeholder="Poço, sondagem…" value={p.tipo} onChange={e=>setP(p.id,"tipo",e.target.value)}/></td>
                  <td style={td}><input className="inp mono" aria-label="Coordenadas" placeholder="Opcional" value={p.coordenadas} onChange={e=>setP(p.id,"coordenadas",e.target.value)}/></td>
                  <td style={td}><input className="inp" aria-label="Observação" value={p.obs} onChange={e=>setP(p.id,"obs",e.target.value)}/></td>
                  <td style={td}><span className="badge bg">{svs.filter(s=>s.pontoSel===p.id).length}</span></td>
                  <td style={td}><button className="btn btn-danger btn-xs" aria-label="Remover ponto" onClick={()=>remPonto(p)}>✕</button></td>
                </tr>))}</tbody>
            </table></div>}
        </div>

        {/* 2 · Serviços (= planejado) */}
        <div className="card" style={{padding:"16px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8,flexWrap:"wrap"}}>
            <div><div className="sl">2 · SERVIÇOS PLANEJADOS</div><div style={{fontSize:11,color:"#8b949e",marginTop:3}}>Ao salvar, o GAC → Planejado é atualizado mantendo os vínculos com os boletins</div></div>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              {total>0&&<span className="mono" style={{fontSize:12,color:"#d29922"}}>R$ {fmt(total)}</span>}
              <button className="btn btn-ghost btn-sm" onClick={()=>addServ()}>+ Serviço</button>
            </div>
          </div>
          {svs.length===0
            ?<div style={{padding:"18px 0",textAlign:"center",color:"#8b949e",fontSize:12}}>Nenhum serviço planejado nesta área.</div>
            :<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}>
              <thead><tr><th style={{...th,width:200}}>PONTO *</th><th style={th}>SERVIÇO</th><th style={{...th,width:110}}>QTDE</th><th style={{...th,width:150}}>DATA</th><th style={th}>OBS</th><th style={{...th,width:130}}>SITUAÇÃO</th><th style={{...th,width:40}}/></tr></thead>
              <tbody>{svs.map(s=>{
                const svc=svcMap[s.sid]||{};
                const r=s.id?rotuloSituacao({id:s.id,qtd:s.qtd},sit):{t:"Novo",cls:"bg"};
                return(
                <tr key={s.key}>
                  <td style={td}>
                    <select className="inp" aria-label="Ponto" value={s.pontoSel} onChange={e=>setS(s.key,"pontoSel",e.target.value)} style={!s.pontoSel?{borderColor:"#d29922"}:undefined}>
                      <option value="">— Selecione —</option>
                      <option value="NA">N/A — serviço da área</option>
                      {ptsOrd.map(p=><option key={p.id} value={p.id}>{p.codigo||"(sem código)"}</option>)}
                    </select>
                  </td>
                  <td style={td}><select className="inp" aria-label="Serviço" value={s.sid} onChange={e=>setS(s.key,"sid",e.target.value)} disabled={!!(s.id&&realPorPlan[s.id])}>{servicos.map(x=><option key={x.id} value={x.id}>{x.nome}</option>)}</select></td>
                  <td style={td}><div style={{display:"flex",gap:4,alignItems:"center"}}><input type="number" min="0" step="0.5" className="inp" aria-label="Quantidade" value={s.qtd} onChange={e=>setS(s.key,"qtd",e.target.value)}/><span style={{fontSize:10,color:"#8b949e"}}>{svc.unidade}</span></div></td>
                  <td style={td}><input type="date" className="inp" aria-label="Data" value={s.data} onChange={e=>setS(s.key,"data",e.target.value)}/></td>
                  <td style={td}><input className="inp" aria-label="Observação" value={s.obs} onChange={e=>setS(s.key,"obs",e.target.value)}/></td>
                  <td style={td}><span className={`badge ${r.cls}`}>{r.t}</span></td>
                  <td style={td}><button className="btn btn-danger btn-xs" aria-label="Remover serviço" onClick={()=>remServ(s)}>✕</button></td>
                </tr>);})}</tbody>
            </table></div>}
        </div>

        {legado.length>0&&(
          <div className="card" style={{padding:"14px 18px",borderColor:"#d2992255"}}>
            <div className="sl" style={{color:"#e3b341"}}>SERVIÇOS DO CADASTRO ANTIGO QUE NÃO ESTÃO NO PLANEJADO ({legado.length})</div>
            <div style={{fontSize:11,color:"#8b949e",margin:"4px 0 10px"}}>Itens da lista antiga da área sem lançamento correspondente no planejado. Inclua os que ainda valem; os demais são ignorados.</div>
            <table className="table"><thead><tr><th>SERVIÇO</th><th>QTDE</th><th>DATA</th><th>OBS</th><th/></tr></thead>
              <tbody>{legado.map(it=>(
                <tr key={it.idx}>
                  <td>{svcMap[it.sid]?.nome||it.sid}</td><td className="mono">{fmtN(it.qtd)} {svcMap[it.sid]?.unidade}</td>
                  <td className="mono" style={{fontSize:11}}>{fmtDateBR(it.data)}</td><td style={{fontSize:11,color:"#8b949e"}}>{it.obs||"—"}</td>
                  <td>{incluidos.has(it.idx)?<span className="badge bgn">incluído</span>:<button className="btn btn-ghost btn-xs" onClick={()=>{addServ(it);setIncluidos(s=>new Set([...s,it.idx]));}}>+ Incluir</button>}</td>
                </tr>))}</tbody></table>
          </div>
        )}
      </div>
    );
  }

  // ── LISTA ────────────────────────────────────────────────────────────────
  return(
    <div style={{display:"grid",gap:16}}>
      {msg&&<div style={{padding:"10px 16px",borderRadius:6,background:"#23863618",border:"1px solid #23863644",color:"#3fb950",fontSize:13}}>✓ {msg}</div>}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div>
          <h2 style={{fontSize:16,fontWeight:600,color:"#c9d1d9",marginBottom:4}}>Cadastro de Áreas</h2>
          <p style={{fontSize:12,color:"#8b949e"}}>Área › Ponto › Serviço. Os serviços cadastrados aqui são o <span style={{color:"#388bfd"}}>GAC → Planejado</span>.</p>
        </div>
        <button className="btn btn-primary" onClick={abrirNova}>+ Nova área</button>
      </div>
      {areasFilt.length===0&&<div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#8b949e"}}>Nenhuma área cadastrada.</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:14}}>
        {areasFilt.map(area=>{
          const s=stats(area); const cli=clientes.find(c=>c.id===area.cliId);
          const plA=planejado.filter(p=>p.areaId===area.id); const nVinc=plA.filter(p=>realPorPlan[p.id]).length;
          return(
            <div key={area.id} className="card ca-purple" style={{padding:"16px 18px",cursor:"pointer"}} onClick={()=>abrir(area)}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,marginBottom:10}}>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:14,color:"#c9d1d9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{area.nome}</div>
                  {cli&&<div style={{fontSize:11,color:"#8957e5",marginTop:2}}>{cli.nome}</div>}
                  {area.descricao&&<div style={{fontSize:11,color:"#8b949e",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{area.descricao}</div>}
                </div>
                <button className="btn btn-danger btn-xs" aria-label="Excluir área" onClick={e=>{e.stopPropagation();setConfirmDel(area.id);}}>✕</button>
              </div>
              {confirmDel===area.id&&(
                <div style={{marginBottom:10,padding:"10px 12px",background:"#f8514918",border:"1px solid #f8514944",borderRadius:4}} onClick={e=>e.stopPropagation()}>
                  <div style={{fontSize:12,color:"#f85149",fontWeight:600,marginBottom:6}}>Excluir “{area.nome}”?</div>
                  <div style={{fontSize:11,color:"#c9d1d9",marginBottom:8}}>
                    {s.nPontos} ponto(s) serão excluídos. {plA.length} serviço(s) no planejado.
                    {nVinc>0&&<> {nVinc} deles têm boletins e por isso o planejado precisa ser mantido.</>}
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {nVinc===0&&<button className="btn btn-danger btn-xs" onClick={()=>excluir(area,false)}>Excluir área e planejado</button>}
                    {plA.length>0&&<button className="btn btn-ghost btn-xs" style={{borderColor:"#d29922",color:"#d29922"}} onClick={()=>excluir(area,true)}>Excluir só a área (manter planejado)</button>}
                    {plA.length===0&&<button className="btn btn-danger btn-xs" onClick={()=>excluir(area,false)}>Excluir área</button>}
                    <button className="btn btn-ghost btn-xs" onClick={()=>setConfirmDel(null)}>Cancelar</button>
                  </div>
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:6}}>
                {[["PONTOS",s.nPontos,"#388bfd"],["SERVIÇOS",s.nServ,"#8957e5"],["ENCERRADOS",`${s.enc}/${s.nServ}`,"#3fb950"],["VALOR",s.total>=1000?`${(s.total/1000).toFixed(0)}k`:s.total.toFixed(0),"#d29922"]].map(([l,v,c])=>(
                  <div key={l} style={{padding:"8px 6px",background:"#161b22",borderRadius:4,textAlign:"center"}}>
                    <div style={{fontSize:9,color:"#8b949e",marginBottom:2}}>{l}</div>
                    <div className="mono" style={{fontWeight:600,color:c,fontSize:12}}>{v}</div>
                  </div>))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════════════════
//  REPORT SEMANAL — 3 modelos: Gerente / Líder / Cliente
// ═══════════════════════════════════════════════════════════════════════════
const LOGO_HBR = window.LOGO_HBR;

// Retorna seg e sex da semana atual
function semanaAtual() {
  const hoje = new Date();
  const dow = hoje.getDay(); // 0=dom
  const seg = new Date(hoje); seg.setDate(hoje.getDate() - (dow===0?6:dow-1));
  const sex = new Date(seg);  sex.setDate(seg.getDate()+4);
  const fmt = d => d.toISOString().slice(0,10);
  return { ini: fmt(seg), fim: fmt(sex) };
}

function fmtDateBR(d){ if(!d) return "—"; const [y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; }

function ReportSemanal({realizado,planejado,amostras,relats,custosFixos,custosArea,areas,servicos,svcMap,clientes,clienteAtivo,profile,relSemanal,setRelSemanal}){
  const sem = semanaAtual();
  const [ini, setIni]         = useState(sem.ini);
  const [fim, setFim]         = useState(sem.fim);
  const [modelo, setModelo]   = useState(profile==="analista"?"lider":profile||"gerente");
  const [subView, setSubView] = useState("preview"); // "preview"|"historico"
  const [obsExtra, setObsExtra] = useState("");
  const [editando, setEditando] = useState({}); // campos editáveis por área
  const [salvando, setSalvando] = useState(false);
  const printRef = useRef();

  // ── Dados filtrados ──────────────────────────────────────────────────
  const cliId = clienteAtivo?.id||null;
  const realSem  = useMemo(()=> realizado.filter(l=>l.data>=ini&&l.data<=fim&&(!cliId||l.cliId===cliId)),[realizado,ini,fim,cliId]);
  const planSem  = useMemo(()=> planejado.filter(l=>l.data>=ini&&l.data<=fim&&(!cliId||l.cliId===cliId)),[planejado,ini,fim,cliId]);
  const amoFiltAll = useMemo(()=> amostras.filter(a=>(!cliId||a.cliId===cliId)),[amostras,cliId]);
  const relFiltAll = useMemo(()=> relats.filter(r=>(!cliId||r.cliId===cliId)),[relats,cliId]);

  const planProx = useMemo(()=>{
    const d=new Date(fim); d.setDate(d.getDate()+1);
    const p7=new Date(d); p7.setDate(d.getDate()+6);
    const fmtD=x=>x.toISOString().slice(0,10);
    return planejado.filter(l=>l.data>=fmtD(d)&&l.data<=fmtD(p7)&&(!cliId||l.cliId===cliId));
  },[planejado,fim,cliId]);

  // ── Financeiro ───────────────────────────────────────────────────────
  const totReal     = realSem.reduce((s,l)=>s+(svcMap[l.sid]?.valor||0)*l.qtd,0);
  const totPlan     = planSem.reduce((s,l)=>s+(svcMap[l.sid]?.valor||0)*l.qtd,0);
  const totRealAcum = realizado.filter(l=>l.data<=fim&&(!cliId||l.cliId===cliId)).reduce((s,l)=>s+(svcMap[l.sid]?.valor||0)*l.qtd,0);
  const totCustFixo = custosFixos.filter(c=>c.mes===ini.slice(0,7)).reduce((s,c)=>s+parseFloat(c.valor||0),0);
  const totCustDir  = custosArea.filter(c=>c.data>=ini&&c.data<=fim).reduce((s,c)=>s+parseFloat(c.valor||0),0);
  const margem      = totReal - totCustDir - totCustFixo*(totReal/(realizado.filter(l=>l.data>=ini.slice(0,7)+"-01"&&l.data<=fim).reduce((s,l)=>s+(svcMap[l.sid]?.valor||0)*l.qtd,0)||1));

  // ── Progresso por área (dividido em Sondagem / Lab / Relatório) ──────
  const SVC_SOND = ["V13","V11","V09","V10","V02","V05","V38"]; // sondagem
  const SVC_AMO  = ["V14","V18","V19","V26"];                   // amostras

  const areasMap = useMemo(()=>{
    const m={};
    const add=(lista,tipo)=>lista.forEach(l=>{
      const a=l.area||"(Sem área)";
      if(!m[a]) m[a]={area:a,real:[],plan:[]};
      m[a][tipo].push(l);
    });
    add(realSem,"real"); add(planSem,"plan");
    return Object.values(m).sort((a,b)=>a.area.localeCompare(b.area));
  },[realSem,planSem]);

  // Busca descrição da área no cadastro
  const areaDesc = useCallback(nomeArea=>{
    const found = areas.find(a=>
      a.nome===nomeArea ||
      a.nome?.toUpperCase()===nomeArea?.toUpperCase() ||
      a.nome?.toUpperCase().includes(nomeArea?.toUpperCase()) ||
      nomeArea?.toUpperCase().includes(a.nome?.toUpperCase())
    );
    // Usa descricao do cadastro, ou fallback para o primeiro obs dos itens
    return found?.descricao || (found?.itens?.[0]?.obs?.split("—")?.[0]?.trim()) || "";
  },[areas]);

  // Laudos críticos ≤7 dias
  const laudosCrit = useMemo(()=>{
    const lim=new Date(); lim.setDate(lim.getDate()+7);
    return amoFiltAll.filter(a=>a.prazoLaudo&&a.status!=="laudo_ok"&&a.status!=="reprovado"&&new Date(a.prazoLaudo)<=lim)
      .sort((a,b)=>a.prazoLaudo.localeCompare(b.prazoLaudo));
  },[amoFiltAll]);

  // Próxima semana por área
  const proxAreas = useMemo(()=>{
    const m={};
    planProx.forEach(l=>{const a=l.area||"(Sem área)";if(!m[a])m[a]=[];m[a].push(l);});
    return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
  },[planProx]);

  // ── Campo editável inline ────────────────────────────────────────────
  const getEdit = (chave, fallback) => editando[chave]!==undefined ? editando[chave] : fallback;
  const setEdit = (chave, val) => setEditando(e=>({...e,[chave]:val}));

  // ── Salvar no histórico ──────────────────────────────────────────────
  const salvarHistorico = ()=>{
    setSalvando(true);
    const snap = {
      id: uid(),
      modelo,
      ini, fim,
      cliente: clienteAtivo?.nome||"Todos",
      geradoEm: hoje(),
      obsExtra,
      editando,
      totReal, totPlan, totRealAcum,
      areasSnap: areasMap.map(({area,real,plan})=>({area,nReal:real.length,nPlan:plan.length})),
    };
    setRelSemanal(a=>[snap,...a]);
    setSalvando(false);
    setSubView("historico");
  };


  const periodoStr = `${fmtDateBR(ini)} a ${fmtDateBR(fim)}`;
  const tituloModelo = modelo==="gerente"?"Gerencial":modelo==="lider"?"Operacional":"Cliente";

  // ── BLOCO: Progresso por Área (dividido) ────────────────────────────
  const BlocoArea = ({area,real,plan,isHTML=false})=>{
    const desc = getEdit(`desc_${area}`, areaDesc(area));
    // Sondagem
    const mRealSond = real.filter(l=>SVC_SOND.includes(l.sid)).reduce((s,l)=>s+l.qtd,0);
    const mPlanSond = plan.filter(l=>SVC_SOND.includes(l.sid)).reduce((s,l)=>s+l.qtd,0);
    const vRealSond = real.filter(l=>SVC_SOND.includes(l.sid)).reduce((s,l)=>s+(svcMap[l.sid]?.valor||0)*l.qtd,0);
    // Laboratório (amostras desta área na semana)
    const amoArea   = amoFiltAll.filter(a=>(a.area||"")===area);
    const amoColet  = amoArea.filter(a=>a.dataColeta>=ini&&a.dataColeta<=fim).length;
    const amoEnv    = amoArea.filter(a=>["enviado","em_analise","laudo_ok"].includes(a.status)).length;
    const amoOK     = amoArea.filter(a=>a.status==="laudo_ok").length;
    // Relatórios desta área
    const relArea   = relFiltAll.filter(r=>(r.area||"")===area||(r.titulo||"").includes(area));
    const pct = (mPlanSond+mRealSond)>0?Math.round(mRealSond/(mPlanSond+mRealSond)*100):mRealSond>0?100:0;
    const corPct = pct>=100?"#1e8449":pct>0?"#d35400":"#888";

    if(isHTML) return (
      '<div class="area-block">' +
      '<div class="area-title">'+area+'</div>' +
      (desc?'<div class="area-desc">'+desc+'</div>':'<div class="area-desc">Investigação Confirmatória — '+area+'</div>') +
      '<h3>Sondagem</h3>' +
      '<table><thead><tr><th>SERVIÇO</th><th>QTDE REAL.</th><th>QTDE PLAN.</th><th>UNID.</th>'+(modelo!=="cliente"?'<th>VALOR</th>':'')+'</tr></thead><tbody>' +
      [...new Set([...real,...plan].filter(l=>SVC_SOND.includes(l.sid)).map(l=>l.sid))].map(sid=>{
        const s=svcMap[sid]||{}; const r=real.filter(l=>l.sid===sid).reduce((a,l)=>a+l.qtd,0); const p=plan.filter(l=>l.sid===sid).reduce((a,l)=>a+l.qtd,0);
        return '<tr><td>'+(s.nome||sid)+'</td><td><b>'+(r>0?fmtN(r):'—')+'</b></td><td>'+(p>0?fmtN(p):'—')+'</td><td>'+(s.unidade||'')+'</td>'+(modelo!=="cliente"?'<td>R$ '+fmt((s.valor||0)*r)+'</td>':'')+'</tr>';
      }).join('') +
      '</tbody></table>' +
      '<div class="prog-bar"><div class="prog-fill" style="width:'+Math.min(pct,100)+'%;background:'+corPct+'"></div></div>' +
      '<div style="font-size:9px;color:'+corPct+';margin-top:2px">'+pct+'% executado em sondagem</div>' +
      (amoArea.length>0||amoColet>0 ?
        '<h3>Laboratório</h3>' +
        '<table><thead><tr><th>STATUS</th><th>QTD</th></tr></thead><tbody>' +
        [["Coletadas na semana",amoColet],["Enviadas/Em análise",amoEnv],["Laudos OK",amoOK]].filter(([,n])=>n>0).map(([l,n])=>'<tr><td>'+l+'</td><td><b>'+n+'</b></td></tr>').join('') +
        '</tbody></table>'
        : '') +
      (relArea.length>0 ?
        '<h3>Relatórios</h3>' +
        '<table><thead><tr><th>TÍTULO</th><th>STATUS</th><th>PRAZO</th></tr></thead><tbody>' +
        relArea.map(r=>{const s=ST_REL.find(x=>x.id===r.status);const cls=r.status==="aprovado"?"teal":r.status==="revisao_cliente"?"purple":r.status==="entregue"?"green":r.status==="em_elaboracao"?"orange":"";return'<tr><td>'+r.titulo+'</td><td><span class="badge '+cls+'">'+(s?.label||r.status)+'</span></td><td>'+(fmtDateBR(r.prazo)||'—')+'</td></tr>';}).join('') +
        '</tbody></table>'
        : '') +
      '</div>'
    )
    // Tela
    return(
      <div key={area} style={{border:"1px solid #21262d",borderRadius:6,padding:"14px 16px",marginBottom:10}}>
        {/* Cabeçalho da área */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <div style={{flex:1}}>
            <span style={{fontWeight:700,color:"#c9d1d9",fontSize:14}}>{area}</span>
            {/* Descrição editável */}
            <div style={{marginTop:4}}>
              <input
                style={{background:"transparent",border:"none",borderBottom:"1px dashed #30363d",color:desc?"#8b949e":"#30363d",fontSize:11,width:"100%",outline:"none",padding:"1px 2px"}}
                placeholder="Clique para adicionar descrição…"
                value={desc}
                onFocus={e=>{if(!desc)setEdit(`desc_${area}`, areaDesc(area)||"");}}
                onChange={e=>setEdit(`desc_${area}`,e.target.value)}
              />
              {!desc&&areaDesc(area)&&<div style={{fontSize:10,color:"#388bfd",marginTop:1,cursor:"pointer"}} onClick={()=>setEdit(`desc_${area}`,areaDesc(area))}>{'↖ usar: "'+areaDesc(area).slice(0,60)+(areaDesc(area).length>60?'…':'')+'"'}</div>}
            </div>
          </div>
          <span className={`badge ${pct>=100?"bgn":pct>0?"bo":"bg"}`} style={{marginLeft:12,flexShrink:0}}>{pct}%</span>
        </div>

        {/* 3 colunas: Sondagem / Lab / Relatórios */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
          {/* Sondagem */}
          <div>
            <div style={{fontSize:10,fontWeight:600,color:"#388bfd",textTransform:"uppercase",marginBottom:6,borderBottom:"1px solid #21262d",paddingBottom:3}}>⛏ Sondagem</div>
            {[...new Set([...real,...plan].filter(l=>SVC_SOND.includes(l.sid)).map(l=>l.sid))].map(sid=>{
              const s=svcMap[sid]||{}; const r=real.filter(l=>l.sid===sid).reduce((a,l)=>a+l.qtd,0); const p=plan.filter(l=>l.sid===sid).reduce((a,l)=>a+l.qtd,0);
              return r>0||p>0?(
                <div key={sid} style={{fontSize:11,marginBottom:4,display:"flex",justifyContent:"space-between"}}>
                  <span style={{color:"#8b949e",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:4}}>{s.nome?.split("—")[0]||sid}</span>
                  <span className="mono" style={{color:"#3fb950",flexShrink:0}}>{r>0?fmtN(r):""}{s.unidade?` ${s.unidade}`:""}{p>0?<span style={{color:"#484f58"}}> /{fmtN(p)}</span>:null}</span>
                </div>
              ):null;
            })}
            {mRealSond===0&&mPlanSond===0&&<div style={{fontSize:11,color:"#484f58"}}>Sem atividade</div>}
            <div style={{height:3,background:"#21262d",borderRadius:2,marginTop:6}}>
              <div style={{width:`${Math.min(pct,100)}%`,height:"100%",background:pct>=100?"#3fb950":pct>0?"#d29922":"#21262d",borderRadius:2}}/>
            </div>
          </div>

          {/* Laboratório */}
          <div>
            <div style={{fontSize:10,fontWeight:600,color:"#2dd4bf",textTransform:"uppercase",marginBottom:6,borderBottom:"1px solid #21262d",paddingBottom:3}}>🧪 Laboratório</div>
            {amoColet>0&&<div style={{fontSize:11,marginBottom:3,display:"flex",justifyContent:"space-between"}}><span style={{color:"#8b949e"}}>Coletadas</span><span className="mono" style={{color:"#3fb950"}}>{amoColet}</span></div>}
            {amoEnv>0&&<div style={{fontSize:11,marginBottom:3,display:"flex",justifyContent:"space-between"}}><span style={{color:"#8b949e"}}>Em análise</span><span className="mono" style={{color:"#d29922"}}>{amoEnv}</span></div>}
            {amoOK>0&&<div style={{fontSize:11,marginBottom:3,display:"flex",justifyContent:"space-between"}}><span style={{color:"#8b949e"}}>Laudos OK</span><span className="mono" style={{color:"#3fb950"}}>{amoOK}</span></div>}
            {amoArea.length===0&&<div style={{fontSize:11,color:"#484f58"}}>Sem amostras</div>}
          </div>

          {/* Relatórios */}
          <div>
            <div style={{fontSize:10,fontWeight:600,color:"#8957e5",textTransform:"uppercase",marginBottom:6,borderBottom:"1px solid #21262d",paddingBottom:3}}>◈ Relatórios</div>
            {relArea.length===0&&<div style={{fontSize:11,color:"#484f58"}}>Sem relatórios</div>}
            {relArea.map(r=>{
              const s=ST_REL.find(x=>x.id===r.status);
              return(
                <div key={r.id} style={{fontSize:11,marginBottom:4}}>
                  <div style={{color:"#c9d1d9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.titulo}</div>
                  <span className={`badge ${s?.cls||"bg"}`} style={{fontSize:10}}>{s?.label||r.status}</span>
                  {r.prazo&&<span style={{fontSize:10,color:"#484f58",marginLeft:6}}>{fmtDateBR(r.prazo)}</span>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  // ── CONTEÚDO PARA IMPRESSÃO ──────────────────────────────────────────
  const gerarHTML = ()=>{
    const cli=clienteAtivo;
    const obsGeral = getEdit("obs_geral", obsExtra);
    const obsLab   = getEdit("obs_lab","");
    const obsProx  = getEdit("obs_prox","");

    let html = '';

    // Header
    html += '<div class="header">';
    html += '<div><img src="'+LOGO_HBR+'" class="logo" alt="HBR"/></div>';
    html += '<div style="text-align:right">';
    html += '<div style="font-size:16px;font-weight:700;color:#0d3b6e">Report Semanal — '+tituloModelo+'</div>';
    if(cli) html += '<div style="font-size:11px;color:#555;margin-top:2px">Cliente: <b>'+cli.nome+'</b></div>';
    html += '<div style="font-size:11px;color:#0d3b6e;font-weight:600;margin-top:2px">'+periodoStr+'</div>';
    html += '<div style="font-size:9px;color:#888;margin-top:2px">Emitido em '+fmtDateBR(hoje())+'</div>';
    html += '</div></div>';

    // Financeiro — só gerente
    if(modelo==="gerente"){
      html += '<h2>Resumo Financeiro</h2><div class="kpi-row">';
      [["Realizado (semana)","R$ "+fmt(totReal)],["Planejado (semana)","R$ "+fmt(totPlan)],["Acumulado","R$ "+fmt(totRealAcum)],["Custo Fixo (mês)","R$ "+fmt(totCustFixo)],["Custo Direto","R$ "+fmt(totCustDir)],["Margem Est.","R$ "+fmt(margem)]]
        .forEach(([l,v])=>{ html += '<div class="kpi"><div class="kpi-v">'+v+'</div><div class="kpi-l">'+l+'</div></div>'; });
      html += '</div>';
    }

    // Progresso por área
    html += '<h2>Progresso por Área</h2>';
    areasMap.forEach(({area,real,plan})=>{ html += BlocoArea({area,real,plan,isHTML:true}); });

    // Lab geral
    html += '<h2>Laboratório — Visão Geral</h2>';
    html += '<table><thead><tr><th>STATUS</th><th>QUANTIDADE</th></tr></thead><tbody>';
    ST_LAB.forEach(s=>{ const n=amoFiltAll.filter(a=>a.status===s.id).length; if(n>0) html += '<tr><td>'+s.label+'</td><td><b>'+n+'</b></td></tr>'; });
    html += '</tbody></table>';
    if(laudosCrit.length>0) html += '<div class="obs-box">⚠ '+laudosCrit.length+' laudo(s) com prazo crítico: '+laudosCrit.map(a=>(a.ponto||a.area)+' ('+fmtDateBR(a.prazoLaudo)+')').join(', ')+'</div>';
    if(obsLab) html += '<div class="obs-box">'+obsLab+'</div>';

    // Relatórios
    html += '<h2>Relatórios Técnicos</h2>';
    if(relFiltAll.length>0){
      html += '<table><thead><tr><th>TÍTULO</th><th>ÁREA</th><th>STATUS</th><th>PRAZO</th><th>RESPONSÁVEL</th></tr></thead><tbody>';
      relFiltAll.forEach(r=>{
        const s=ST_REL.find(x=>x.id===r.status);
        const cls=r.status==="aprovado"?"teal":r.status==="revisao_cliente"?"purple":r.status==="entregue"?"green":r.status==="em_elaboracao"?"orange":"";
        html += '<tr><td>'+r.titulo+'</td><td>'+(r.area||'—')+'</td><td><span class="badge '+cls+'">'+(s?.label||r.status)+'</span></td><td>'+(fmtDateBR(r.prazo)||'—')+'</td><td>'+(r.resp||'—')+'</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<p style="color:#888;font-size:10px">Nenhum relatório.</p>';
    }

    // Próxima semana
    html += '<h2>Próxima Semana</h2>';
    if(proxAreas.length>0){
      proxAreas.forEach(([area,itens])=>{
        html += '<h3>'+area+'</h3>';
        html += '<table><thead><tr><th>DATA</th><th>SERVIÇO</th><th>QTDE</th><th>OBS</th></tr></thead><tbody>';
        itens.sort((a,b)=>a.data.localeCompare(b.data)).forEach(l=>{
          const s=svcMap[l.sid]||{};
          html += '<tr><td>'+fmtDateBR(l.data)+'</td><td>'+(s.nome||l.sid)+'</td><td>'+fmtN(l.qtd)+' '+(s.unidade||'')+'</td><td>'+(l.obs||'—')+'</td></tr>';
        });
        html += '</tbody></table>';
      });
    } else {
      html += '<p style="color:#888;font-size:10px">Nenhuma atividade planejada.</p>';
    }
    if(obsProx) html += '<div class="obs-box">'+obsProx+'</div>';

    // Obs gerais
    if(obsGeral) html += '<h2>Observações Gerais</h2><div class="obs-box">'+obsGeral+'</div>';

    html += '<div class="footer">HBR Soluções Integradas — Report Semanal '+tituloModelo+' — '+periodoStr+' — Gerado em '+fmtDateBR(hoje())+'</div>';

    return html;
  }
  const imprimir = ()=>{
    const w=window.open("","_blank");
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Report Semanal HBR</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;font-size:11px;color:#1a1a2e;background:#fff;padding:20px}h2{font-size:12px;font-weight:700;color:#0d3b6e;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px;border-bottom:2px solid #0d3b6e;padding-bottom:3px}h3{font-size:11px;font-weight:600;color:#1a5276;margin:8px 0 4px}table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:10px}th{background:#0d3b6e;color:#fff;padding:4px 8px;text-align:left}td{padding:4px 8px;border-bottom:1px solid #e8eaf0}tr:nth-child(even) td{background:#f5f7fa}.header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #0d3b6e;padding-bottom:10px;margin-bottom:14px}.logo{height:48px}.kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.kpi{border:1px solid #d5d8dc;border-radius:4px;padding:6px 12px;min-width:110px;text-align:center}.kpi-v{font-size:14px;font-weight:700;color:#0d3b6e}.kpi-l{font-size:9px;color:#666;text-transform:uppercase}.area-block{border:1px solid #d5d8dc;border-radius:4px;padding:8px 12px;margin-bottom:8px}.area-title{font-weight:700;font-size:12px;color:#0d3b6e;margin-bottom:2px}.area-desc{font-size:10px;color:#666;margin-bottom:6px}.prog-bar{height:4px;background:#eee;border-radius:2px;margin-top:4px}.prog-fill{height:4px;border-radius:2px}.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:600}.green{background:#d5f5e3;color:#1e8449}.orange{background:#fdebd0;color:#d35400}.red{background:#fadbd8;color:#c0392b}.blue{background:#d6eaf8;color:#1a5276}.purple{background:#e8daef;color:#6c3483}.teal{background:#d1f2eb;color:#1a7a5e}.obs-box{background:#fef9e7;border-left:3px solid #f39c12;padding:8px 12px;margin:8px 0;font-size:10px}.footer{margin-top:20px;border-top:1px solid #d5d8dc;padding-top:6px;font-size:9px;color:#888;text-align:center}@media print{@page{margin:12mm}}</style>
    </head><body>${gerarHTML()}</body></html>`);
    w.document.close();
    setTimeout(()=>w.print(),400);
  };

  // ── RENDER ────────────────────────────────────────────────────────────
  return(
    <div style={{display:"grid",gap:16}}>

      {/* Sub-navegação histórico/preview */}
      <div style={{display:"flex",gap:0,borderBottom:"1px solid #21262d"}}>
        <button className={`tab-btn${subView==="preview"?" active":""}`} onClick={()=>setSubView("preview")}>◑ Preview</button>
        <button className={`tab-btn${subView==="historico"?" active":""}`} onClick={()=>setSubView("historico")}>
          ☰ Histórico {relSemanal?.length>0&&<span className="badge bg" style={{marginLeft:4}}>{relSemanal.length}</span>}
        </button>
      </div>

      {/* ── HISTÓRICO ── */}
      {subView==="historico"&&(
        <div style={{display:"grid",gap:12}}>
          {(!relSemanal||relSemanal.length===0)&&(
            <div className="card" style={{padding:"40px 20px",textAlign:"center",color:"#484f58"}}>
              <div style={{fontSize:28,marginBottom:10}}>☰</div>
              <div style={{color:"#8b949e"}}>Nenhum report semanal salvo ainda.</div>
              <div style={{fontSize:12,marginTop:6}}>Gere um report na aba Preview e clique em "Salvar no Histórico".</div>
            </div>
          )}
          {(relSemanal||[]).map(r=>(
            <div key={r.id} className="card" style={{padding:"14px 18px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                <div>
                  <div style={{fontWeight:600,color:"#c9d1d9",fontSize:13}}>
                    {r.modelo==="gerente"?"◎ Gerencial":r.modelo==="lider"?"▦ Operacional":"◫ Cliente"}
                    {" "}—{" "}{r.ini&&r.fim?`${fmtDateBR(r.ini)} a ${fmtDateBR(r.fim)}`:""}
                  </div>
                  <div style={{fontSize:11,color:"#484f58",marginTop:2}}>
                    {r.cliente} · Gerado em {fmtDateBR(r.geradoEm)} ·{" "}
                    <span className="mono" style={{color:"#3fb950"}}>R$ {fmt(r.totReal)}</span> realizado
                  </div>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setRelSemanal(a=>a.filter(x=>x.id!==r.id))}>✕ Excluir</button>
                </div>
              </div>
              {r.obsExtra&&<div style={{marginTop:8,padding:"8px 12px",background:"#161b22",borderRadius:4,fontSize:11,color:"#8b949e"}}>{r.obsExtra}</div>}
            </div>
          ))}
        </div>
      )}

      {/* ── PREVIEW ── */}
      {subView==="preview"&&(<>

        {/* Controles */}
        <div className="card" style={{padding:"16px 18px"}}>
          <div style={{display:"flex",alignItems:"flex-end",gap:16,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>SEMANA</div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="date" className="inp" style={{width:140}} value={ini} onChange={e=>setIni(e.target.value)}/>
                <span style={{color:"#484f58",fontSize:12}}>→</span>
                <input type="date" className="inp" style={{width:140}} value={fim} onChange={e=>setFim(e.target.value)}/>
                <button className="btn btn-ghost btn-sm" onClick={()=>{const s=semanaAtual();setIni(s.ini);setFim(s.fim);}}>↺ Semana atual</button>
              </div>
            </div>
            <div>
              <div style={{fontSize:10,color:"#484f58",marginBottom:5}}>MODELO</div>
              <div style={{display:"flex",gap:0,background:"#010409",borderRadius:6,border:"1px solid #30363d",overflow:"hidden"}}>
                {[{id:"gerente",l:"◎ Gerencial"},{id:"lider",l:"▦ Operacional"},{id:"cliente",l:"◫ Cliente"}].map(m=>(
                  <button key={m.id} onClick={()=>setModelo(m.id)}
                    style={{padding:"7px 16px",border:"none",cursor:"pointer",fontSize:12,transition:"all .15s",
                      background:modelo===m.id?"#1f6feb22":"transparent",
                      color:modelo===m.id?"#388bfd":"#484f58",
                      fontWeight:modelo===m.id?600:400,
                      borderRight:"1px solid #30363d"}}>
                    {m.l}
                  </button>
                ))}
              </div>
            </div>
            <div style={{marginLeft:"auto",display:"flex",gap:8}}>
              <button className="btn btn-ghost" onClick={imprimir}>⎙ PDF</button>
              <button className="btn btn-primary" onClick={salvarHistorico} disabled={salvando}>
                {salvando?"…":"☰ Salvar no Histórico"}
              </button>
            </div>
          </div>
        </div>

        {/* KPIs */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
          {[
            {l:"Realizado (semana)",  v:`R$ ${fmt(totReal)}`,     c:"ca-green",  show:true},
            {l:"Planejado (semana)",  v:`R$ ${fmt(totPlan)}`,     c:"ca-orange", show:true},
            {l:"Acumulado",           v:`R$ ${fmt(totRealAcum)}`, c:"ca-blue",   show:true},
            {l:"Amostras (total)",    v:amoFiltAll.length,        c:"",          show:true},
            {l:"Laudos críticos",     v:laudosCrit.length,        c:laudosCrit.length>0?"ca-red":"", show:true},
            {l:"Margem est.",         v:`R$ ${fmt(margem)}`,      c:margem>=0?"ca-green":"ca-red", show:modelo==="gerente"},
          ].filter(k=>k.show).map(({l,v,c})=>(
            <div key={l} className={`card ${c}`} style={{padding:"12px 16px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#484f58",marginBottom:4}}>{l.toUpperCase()}</div>
              <div className="mono" style={{fontWeight:700,fontSize:15,color:"#c9d1d9"}}>{v}</div>
            </div>
          ))}
        </div>

        {/* Preview do relatório */}
        <div className="card" style={{padding:"20px 24px",background:"#fff",color:"#1a1a2e"}} ref={printRef}>

          {/* Cabeçalho */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"3px solid #0d3b6e",paddingBottom:12,marginBottom:16}}>
            <img src={LOGO_HBR} style={{height:52}} alt="HBR"/>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:16,fontWeight:700,color:"#0d3b6e"}}>Report Semanal — {tituloModelo}</div>
              {clienteAtivo&&<div style={{fontSize:11,color:"#555",marginTop:2}}>Cliente: <strong>{clienteAtivo.nome}</strong></div>}
              <div style={{fontSize:11,color:"#0d3b6e",fontWeight:600,marginTop:2}}>{periodoStr}</div>
              <div style={{fontSize:9,color:"#888",marginTop:2}}>Emitido em {fmtDateBR(hoje())}</div>
            </div>
          </div>

          {/* Financeiro — só gerente */}
          {modelo==="gerente"&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,color:"#0d3b6e",textTransform:"uppercase",borderBottom:"2px solid #0d3b6e",paddingBottom:3,marginBottom:8}}>Resumo Financeiro</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {[["Realizado (semana)",`R$ ${fmt(totReal)}`,"#1e8449"],["Planejado (semana)",`R$ ${fmt(totPlan)}`,"#d35400"],["Acumulado",`R$ ${fmt(totRealAcum)}`,"#1a5276"],["Custo Fixo (mês)",`R$ ${fmt(totCustFixo)}`,"#c0392b"],["Custo Direto",`R$ ${fmt(totCustDir)}`,"#c0392b"],["Margem Estimada",`R$ ${fmt(margem)}`,margem>=0?"#1e8449":"#c0392b"]]
                  .map(([l,v,c])=>(<div key={l} style={{border:"1px solid #d5d8dc",borderRadius:4,padding:"6px 12px",minWidth:110,textAlign:"center"}}><div style={{fontSize:14,fontWeight:700,color:c}}>{v}</div><div style={{fontSize:9,color:"#666",textTransform:"uppercase",marginTop:2}}>{l}</div></div>))}
              </div>
            </div>
          )}

          {/* Progresso por área */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:"#0d3b6e",textTransform:"uppercase",borderBottom:"2px solid #0d3b6e",paddingBottom:3,marginBottom:8}}>Progresso por Área</div>
            {areasMap.length===0&&<div style={{color:"#888",fontSize:11}}>Sem atividades no período.</div>}
            {areasMap.map(({area,real,plan})=><BlocoArea key={area} area={area} real={real} plan={plan}/>)}
          </div>

          {/* Laboratório geral */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:"#0d3b6e",textTransform:"uppercase",borderBottom:"2px solid #0d3b6e",paddingBottom:3,marginBottom:8}}>Laboratório — Visão Geral</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
              {ST_LAB.map(s=>{const n=amoFiltAll.filter(a=>a.status===s.id).length;return(<div key={s.id} style={{border:"1px solid #d5d8dc",borderRadius:4,padding:"5px 10px",textAlign:"center",minWidth:70}}><div style={{fontSize:16,fontWeight:700,color:n>0?"#0d3b6e":"#ccc"}}>{n}</div><div style={{fontSize:9,color:"#888"}}>{s.label}</div></div>);})}
            </div>
            {laudosCrit.length>0&&<div style={{background:"#fef9e7",borderLeft:"3px solid #f39c12",padding:"6px 10px",fontSize:10}}>⚠ {laudosCrit.length} laudo(s) com prazo crítico: {laudosCrit.map(a=>`${a.ponto||a.area} (${fmtDateBR(a.prazoLaudo)})`).join(", ")}</div>}
            {/* Obs lab editável */}

                <tbody>
                  {relFiltAll.map(r=>{
                    const s=ST_REL.find(x=>x.id===r.status);
                    const bg=r.status==="aprovado"?"#d1f2eb":r.status==="revisao_cliente"?"#e8daef":r.status==="entregue"?"#d5f5e3":r.status==="em_elaboracao"?"#fdebd0":"#eaecee";
                    const fg=r.status==="aprovado"?"#1a7a5e":r.status==="revisao_cliente"?"#6c3483":r.status==="entregue"?"#1e8449":r.status==="em_elaboracao"?"#d35400":"#666";
                    const dp=r.prazo&&!["entregue","revisao_cliente","aprovado"].includes(r.status)?diffD(hoje(),r.prazo):null;
                    return(
                      <tr key={r.id} style={{borderBottom:"1px solid #e8eaf0"}}>
                        <td style={{padding:"4px 8px",fontWeight:500}}>{r.titulo}</td>
                        <td style={{padding:"4px 8px"}}>{r.area||"—"}</td>
                        <td style={{padding:"4px 8px"}}><span style={{background:bg,color:fg,padding:"1px 6px",borderRadius:10,fontSize:9,fontWeight:600}}>{s?.label||r.status}</span></td>
                        <td style={{padding:"4px 8px"}}>{r.prazo?`${fmtDateBR(r.prazo)}${dp!==null?` (${dp}d)`:""}`:"—"}</td>
                        <td style={{padding:"4px 8px",color:"#888"}}>{r.resp||"—"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* Próxima semana */}
          {proxAreas.length>0&&(
            <div style={{marginBottom:16}}>
